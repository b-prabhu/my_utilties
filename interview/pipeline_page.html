<title>Certainti Hiring Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap">
<style>
  :root{
    --seed:#AFD3F2;
    --ink:#2C313A; --ink-2:#5B636F; --ink-3:#8A929E;
    --paper:      color-mix(in srgb, var(--seed) 17%, #FBFBFC);
    --surface:    color-mix(in srgb, var(--seed)  4%, #FFFFFF);
    --surface-2:  color-mix(in srgb, var(--seed) 11%, #FFFFFF);
    --sunk:       color-mix(in srgb, var(--seed) 20%, #FFFFFF);
    --line:       color-mix(in srgb, var(--seed) 34%, #EDEEF1);
    --line-2:     color-mix(in srgb, var(--seed) 55%, #DFE1E6);
    --tint:       color-mix(in srgb, var(--seed) 34%, #FFFFFF);
    --tint-2:     color-mix(in srgb, var(--seed) 62%, #FFFFFF);
    --deep:       color-mix(in srgb, var(--seed) 38%, #232A35);
    --on-tint:#2C313A;
    --ok:#3F6E4F;     --ok-bg:#E6F2E9;
    --warn:#8A6520;   --warn-bg:#FAEFDB;
    --risk:#9A463D;   --risk-bg:#F9E5E3;
    --shadow:0 1px 2px rgba(44,49,58,.04), 0 6px 18px rgba(44,49,58,.05);
    --r:14px; --r-sm:10px;
    --font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E7E9ED; --ink-2:#A9B1BC; --ink-3:#7C8592;
      --paper:      color-mix(in srgb, var(--seed)  8%, #121419);
      --surface:    color-mix(in srgb, var(--seed)  7%, #1A1E25);
      --surface-2:  color-mix(in srgb, var(--seed) 12%, #20252D);
      --sunk:       color-mix(in srgb, var(--seed)  5%, #0E1116);
      --line:       color-mix(in srgb, var(--seed) 14%, #2C323B);
      --line-2:     color-mix(in srgb, var(--seed) 26%, #3A424D);
      --tint:       color-mix(in srgb, var(--seed) 20%, #232932);
      --tint-2:     color-mix(in srgb, var(--seed) 34%, #2A313B);
      --deep:       color-mix(in srgb, var(--seed) 72%, #FFFFFF);
      --on-tint:#EDEFF3;
      --ok:#8FC7A2;     --ok-bg:#1B2A21;
      --warn:#DCB169;   --warn-bg:#2B2418;
      --risk:#E09A92;   --risk-bg:#2E1E1C;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E7E9ED; --ink-2:#A9B1BC; --ink-3:#7C8592;
    --paper:      color-mix(in srgb, var(--seed)  8%, #121419);
    --surface:    color-mix(in srgb, var(--seed)  7%, #1A1E25);
    --surface-2:  color-mix(in srgb, var(--seed) 12%, #20252D);
    --sunk:       color-mix(in srgb, var(--seed)  5%, #0E1116);
    --line:       color-mix(in srgb, var(--seed) 14%, #2C323B);
    --line-2:     color-mix(in srgb, var(--seed) 26%, #3A424D);
    --tint:       color-mix(in srgb, var(--seed) 20%, #232932);
    --tint-2:     color-mix(in srgb, var(--seed) 34%, #2A313B);
    --deep:       color-mix(in srgb, var(--seed) 72%, #FFFFFF);
    --on-tint:#EDEFF3;
    --ok:#8FC7A2;     --ok-bg:#1B2A21;
    --warn:#DCB169;   --warn-bg:#2B2418;
    --risk:#E09A92;   --risk-bg:#2E1E1C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font); font-size:13.5px; font-weight:400; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance}
  p{margin:0}
  button,input,select,textarea{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--deep); outline-offset:2px; border-radius:6px}
  .med{font-weight:500}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:1380px; margin:0 auto; padding-inline:16px}

  /* ---------------- masthead ---------------- */
  .masthead{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brandrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-block:13px 11px}
  .mark{
    width:34px; height:34px; border-radius:11px; flex:none;
    background:var(--tint-2); border:1px solid var(--line-2);
    display:grid; place-items:center; font-weight:500; font-size:13px; color:var(--deep);
  }
  .brand h1{font-size:19px; letter-spacing:-.01em; line-height:1.2}
  .brand p{color:var(--ink-3); font-size:11.5px; margin-top:1px}
  .mtools{margin-left:auto; display:flex; align-items:center; gap:8px}
  .asof{font-size:11px; color:var(--ink-3); text-align:right; line-height:1.3}
  .asof b{display:block; font-weight:500; color:var(--ink-2); font-size:12px}

  .iconbtn{
    appearance:none; cursor:pointer; height:34px; padding:0 12px; border-radius:11px;
    background:var(--tint); border:1px solid var(--line-2); color:var(--deep);
    font-size:12px; font-weight:500; display:inline-flex; align-items:center; gap:7px;
  }
  .iconbtn:hover{background:var(--tint-2)}
  .swatch{width:13px; height:13px; border-radius:50%; background:var(--seed);
    border:1px solid rgba(0,0,0,.14); flex:none}

  .stats{display:flex; flex-wrap:wrap; border-top:1px solid var(--line)}
  .stat{flex:1 1 120px; padding:8px 14px 9px; border-right:1px solid var(--line)}
  .stat:first-child{padding-left:0}
  .stat:last-child{border-right:0}
  .stat .k{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
  .stat .v{font-size:18px; font-weight:500; line-height:1.3}
  .stat .v small{font-size:11.5px; color:var(--ink-3); font-weight:400}
  .stat.r .v{color:var(--risk)} .stat.g .v{color:var(--ok)}

  .tabs{display:flex; border-top:1px solid var(--line)}
  .tab{
    appearance:none; background:none; border:0; border-bottom:2px solid transparent;
    padding:9px 15px 8px; font-size:12.5px; color:var(--ink-3); cursor:pointer;
  }
  .tab:first-child{padding-left:0}
  .tab[aria-selected="true"]{color:var(--deep); font-weight:500; border-bottom-color:var(--deep)}
  .tab:hover{color:var(--ink)}

  /* ---------------- theme sheet ---------------- */
  .themesheet{
    position:absolute; right:16px; top:calc(100% - 4px); z-index:60; width:min(330px, calc(100vw - 32px));
    background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r);
    box-shadow:var(--shadow); padding:14px;
  }
  .themesheet h4{font-size:12px; margin-bottom:9px; color:var(--ink-2)}
  .swatches{display:grid; grid-template-columns:repeat(8,1fr); gap:7px}
  .sw{
    appearance:none; cursor:pointer; aspect-ratio:1; border-radius:9px; padding:0;
    border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
  }
  .sw[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .customrow{display:flex; align-items:center; gap:9px; margin-top:13px;
    padding-top:12px; border-top:1px solid var(--line)}
  .customrow label{font-size:12px; color:var(--ink-2); flex:1}
  .customrow input[type=color]{
    width:38px; height:30px; padding:0; border:1px solid var(--line-2);
    border-radius:8px; background:var(--surface); cursor:pointer;
  }
  .moderow{display:flex; gap:6px; margin-top:11px}
  .modebtn{
    flex:1; appearance:none; cursor:pointer; padding:6px; border-radius:9px; font-size:11.5px;
    background:var(--surface-2); border:1px solid var(--line-2); color:var(--ink-2);
  }
  .modebtn[aria-pressed="true"]{background:var(--tint-2); color:var(--on-tint); font-weight:500}

  /* ---------------- toolbar ---------------- */
  main{padding-block:14px 44px}
  .notice{
    display:block; margin-bottom:12px; padding:9px 13px; border-radius:var(--r-sm);
    font-size:12px; background:var(--warn-bg); color:var(--warn);
    border:1px solid color-mix(in srgb, var(--warn) 26%, transparent);
  }
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .searchwrap{position:relative; flex:1 1 240px; min-width:0; max-width:400px}
  .search{
    width:100%; padding:9px 32px 9px 13px; border-radius:100px;
    background:var(--surface); border:1px solid var(--line-2); color:var(--ink);
  }
  .search::placeholder{color:var(--ink-3)}
  .clearq{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    appearance:none; background:none; border:0; cursor:pointer; color:var(--ink-3);
    width:22px; height:22px; border-radius:50%; line-height:1; font-size:15px;
  }
  .clearq:hover{background:var(--sunk); color:var(--ink)}
  .chip{
    appearance:none; cursor:pointer; padding:6px 12px; font-size:12px; white-space:nowrap;
    background:var(--surface); color:var(--ink-2);
    border:1px solid var(--line-2); border-radius:100px;
  }
  .chip:hover{border-color:var(--deep); color:var(--ink)}
  .chip[aria-pressed="true"],.chip.on{
    background:var(--tint-2); border-color:var(--deep); color:var(--on-tint); font-weight:500;
  }
  .chip .n{opacity:.6; margin-left:5px; font-size:11px}
  .sortsel{
    padding:7px 10px; background:var(--surface); border:1px solid var(--line-2);
    border-radius:100px; font-size:12px; margin-left:auto;
  }

  .refine{
    margin-top:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:13px 14px;
    display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  }
  .facet h4{font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:7px}
  .facet .opts{display:flex; flex-wrap:wrap; gap:5px}
  .facet .chip{padding:4px 10px; font-size:11.5px}
  .facet .chip[disabled]{opacity:.38; cursor:default}

  .seg{display:inline-flex; border:1px solid var(--line-2); border-radius:100px; overflow:hidden}
  .segbtn{
    appearance:none; cursor:pointer; background:var(--surface); border:0; color:var(--ink-3);
    padding:6px 12px; font-size:12px;
  }
  .segbtn + .segbtn{border-left:1px solid var(--line-2)}
  .segbtn[aria-pressed="true"]{background:var(--tint-2); color:var(--on-tint); font-weight:500}

  .export{
    margin-top:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); padding:14px;
  }
  .export h4{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:0}
  .export .grp{margin-bottom:12px}
  .export .grphead{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
  .export .opts{display:flex; flex-wrap:wrap; gap:5px}
  .export .chip{padding:4px 10px; font-size:11.5px}
  .exfoot{
    display:flex; flex-wrap:wrap; gap:9px; align-items:center;
    border-top:1px solid var(--line); padding-top:12px;
  }
  .exfoot .sum{font-size:12px; color:var(--ink-3); margin-right:auto}
  .exfoot .sum b{color:var(--ink); font-weight:500}
  .btn{
    appearance:none; cursor:pointer; padding:7px 15px; border-radius:100px; font-size:12.5px;
    font-weight:500; background:var(--tint-2); color:var(--on-tint); border:1px solid var(--deep);
  }
  .btn.ghost{background:var(--surface); color:var(--ink-2); border-color:var(--line-2); font-weight:400}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .exmsg{font-size:11.5px; color:var(--ink-3); width:100%}
  .exmsg.err{color:var(--risk)}
  .exmsg.ok{color:var(--ok)}

  .more{
    grid-column:1/-1; margin-top:7px; padding-top:7px; border-top:1px dashed var(--line);
    font-size:11px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:4px 16px;
  }
  .more b{color:var(--ink-2); font-weight:400}
  .list.compact .who span,
  .list.compact .pay i,
  .list.compact .stages em,
  .list.compact .more{display:none}
  .list.compact .row{padding-block:6px}
  .list.compact .role .rec{display:inline; margin-top:0; margin-left:6px}

  .activebar{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:11px}
  .count{font-size:12px; color:var(--ink-3)}
  .count b{color:var(--ink); font-weight:500}
  .pillx{
    display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px;
    background:var(--tint); border:1px solid var(--line-2); border-radius:100px; font-size:11.5px;
  }
  .pillx button{
    appearance:none; background:none; border:0; cursor:pointer; color:var(--ink-3);
    font-size:14px; line-height:1; width:16px; height:16px; border-radius:50%;
  }
  .pillx button:hover{background:var(--surface); color:var(--ink)}
  .linkbtn{
    appearance:none; background:none; border:0; cursor:pointer; color:var(--deep);
    font-size:11.5px; font-weight:500; text-decoration:underline; text-underline-offset:2px;
  }

  /* ---------------- rows ---------------- */
  .colhead,.row{
    display:grid; align-items:center; gap:10px;
    grid-template-columns:4px 28px minmax(150px,1.5fr) 124px 52px 118px 108px 112px 100px;
  }
  .colhead{padding:14px 14px 6px 0; font-size:10px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-3)}
  .colhead span:nth-child(5),.colhead span:nth-child(6){text-align:right}
  .list{display:flex; flex-direction:column; gap:6px}
  .row{
    width:100%; text-align:left; cursor:pointer; padding:10px 14px 10px 0; font:inherit; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  }
  .row:hover{border-color:var(--line-2); box-shadow:var(--shadow)}
  .row[aria-current="true"]{border-color:var(--deep); box-shadow:0 0 0 1px var(--deep)}
  .rail{align-self:stretch; margin:-10px 0; background:transparent}
  .rail.high{background:var(--risk)} .rail.med{background:var(--warn)} .rail.low{background:var(--line-2)}
  .sl{font-size:11.5px; color:var(--ink-3); text-align:center}
  .who strong{display:block; font-size:14px; font-weight:500; line-height:1.3}
  .who span{display:block; font-size:11px; color:var(--ink-3); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who .cvdot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--deep);
    margin-right:5px; vertical-align:middle;
  }
  .role{font-size:11px; color:var(--ink-2)}
  .role .rec{display:block; margin-top:2px; color:var(--warn); font-weight:500; line-height:1.25}
  .role .rec.ok{color:var(--ok); font-weight:400}
  .exp{font-size:12px; text-align:right; color:var(--ink-2)}
  .pay{text-align:right; font-size:12px; line-height:1.35}
  .pay i{font-style:normal; display:block; font-size:10.5px; color:var(--ink-3)}
  .pay i.hot{color:var(--warn)}
  .pill{
    display:inline-block; padding:2.5px 9px; border-radius:100px; font-size:10.5px;
    font-weight:500; white-space:nowrap; border:1px solid transparent;
  }
  .pill.ok{background:var(--ok-bg); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 24%,transparent)}
  .pill.warn{background:var(--warn-bg); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 24%,transparent)}
  .pill.risk{background:var(--risk-bg); color:var(--risk); border-color:color-mix(in srgb,var(--risk) 24%,transparent)}
  .pill.mute{background:var(--sunk); color:var(--ink-3); border-color:var(--line)}
  .pill.seed{background:var(--tint); color:var(--deep); border-color:var(--line-2)}
  .stages{display:flex; flex-direction:column; gap:3px; align-items:flex-start}
  .dotrow{display:flex; gap:4px; align-items:center}
  .stages em{font-style:normal; font-size:10px; color:var(--ink-3); line-height:1.2}
  .dot{width:8px; height:8px; border-radius:50%; border:1.5px solid var(--line-2)}
  .dot.done{background:var(--ok); border-color:var(--ok)}
  .dot.fail{background:var(--risk); border-color:var(--risk)}
  .dot.live{background:var(--deep); border-color:var(--deep)}
  .dot.hold{background:var(--warn); border-color:var(--warn)}
  .empty{padding:44px 16px; text-align:center; color:var(--ink-3); font-size:13px}

  @media (max-width:1060px){
    .colhead{display:none}
    .row{
      grid-template-columns:4px 28px minmax(130px,1fr) 108px 104px;
      grid-template-areas:"rail sl who pay avail" "rail sl role stages status" "rail sl more more more";
      row-gap:7px; align-items:start;
    }
    .rail{grid-area:rail} .sl{grid-area:sl; padding-top:2px} .who{grid-area:who}
    .role{grid-area:role} .exp{display:none} .pay{grid-area:pay}
    .avail{grid-area:avail; text-align:right} .stages{grid-area:stages}
    .status{grid-area:status; text-align:right} .more{grid-area:more}
  }
  @media (max-width:560px){
    .row{
      grid-template-columns:4px 26px 1fr auto;
      grid-template-areas:"rail sl who who" "rail sl role pay" "rail sl stages avail" "rail sl status status" "rail sl more more";
    }
    .status{text-align:left} .avail{text-align:right} .more{grid-area:more}
  }

  /* ---------------- action log ---------------- */
  .acts{display:flex; flex-direction:column; gap:6px}
  .act{
    display:grid; gap:4px 12px; padding:12px 14px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r);
    grid-template-columns:auto minmax(0,1fr) 154px;
    grid-template-areas:"sev head ctl" ". body ctl";
  }
  .act .sev{grid-area:sev} .act .head{grid-area:head}
  .act .body{grid-area:body} .act .ctl{grid-area:ctl}
  .act .head{font-weight:500; font-size:12.5px}
  .act .head span{font-weight:400; color:var(--ink-3); font-size:11px}
  .act .body{font-size:12px; color:var(--ink-2)}
  .act .body em{font-style:normal; color:var(--ink); }
  .act .ctl{display:flex; flex-direction:column; gap:5px}
  .act .ctl select,.act .ctl input{
    padding:5px 9px; border-radius:100px; font-size:11.5px;
    background:var(--surface-2); border:1px solid var(--line-2); width:100%;
  }
  .act.closed{opacity:.5}
  @media (max-width:720px){
    .act{grid-template-columns:auto 1fr; grid-template-areas:"sev head" ". body" "ctl ctl"}
    .act .ctl{flex-direction:row}
  }

  /* ---------------- drawer ---------------- */
  .scrim{position:fixed; inset:0; background:rgba(28,32,40,.4); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .18s ease}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; z-index:50; inset:0 0 0 auto; width:min(520px,100%);
    background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; transform:translateX(102%);
    transition:transform .2s ease; box-shadow:var(--shadow);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){ .drawer,.scrim{transition:none} }
  @media (max-width:560px){ .drawer{width:100%; border-left:0} }
  .dhead{padding:14px 16px 0; border-bottom:1px solid var(--line)}
  .dtop{display:flex; gap:12px; align-items:flex-start}
  .dhead h2{font-size:18px; line-height:1.25}
  .dhead .sub{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .x{
    margin-left:auto; appearance:none; background:var(--sunk); border:1px solid var(--line);
    width:28px; height:28px; border-radius:9px; cursor:pointer; color:var(--ink-2);
    font-size:15px; line-height:1; flex:none;
  }
  .x:hover{color:var(--ink)}
  .dtabs{display:flex; gap:2px; margin-top:11px}
  .dtab{
    appearance:none; background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
    padding:7px 12px; font-size:12px; color:var(--ink-3);
  }
  .dtab:first-child{padding-left:0}
  .dtab[aria-selected="true"]{color:var(--deep); font-weight:500; border-bottom-color:var(--deep)}
  .dbody{overflow-y:auto; padding:0 16px 30px; flex:1}
  .sec{padding-top:15px}
  .sec > h3{
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
    padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:9px;
  }
  .kv{display:grid; grid-template-columns:106px 1fr; gap:5px 12px; font-size:12px}
  .kv dt{color:var(--ink-3)}
  .kv dd{margin:0; word-break:break-word}

  function buildCsv(){

  function doDownload(){
    var built = buildCsv();
    exMsg("Waiting for you to confirm the download\u2026");
    dl.save({filename:exFilename(), data:built.text}).then(function(){
      exMsg("Saved " + built.rows + " records.", "ok");
    }, function(e){
      var code = e && e.code;
      if (code === "declined") exMsg("Download cancelled.");
      else if (code === "rate_limited") exMsg("A download prompt is already open. Finish it, then try again.", "err");
      else if (code === "too_large") exMsg("That export is too large. Choose fewer columns or narrow the filters.", "err");
      else exMsg("Could not save the file. Copy to the clipboard instead.", "err");
    });
  }
  function doCopy(){
    var built = buildCsv();
    var done = function(){ exMsg("Copied " + built.rows + " records. Paste into a spreadsheet.", "ok"); };
    var fail = function(){ exMsg("Could not reach the clipboard in this view.", "err"); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(built.text).then(done, fail);
      } else { fail(); }
    } catch (e) { fail(); }
  }

  /* Revision counters. localRev bumps on every keystroke or pick; savedRev
     records the revision a completed write covered. While the two differ the
     candidate has edits the server has not acknowledged, and an incoming
     snapshot must not overwrite them. */
  var localRev = {}, savedRev = {}, actRev = {}, actSaved = {};
  function touch(sl){ localRev[sl] = (localRev[sl] || 0) + 1; }
  function clean(sl){ return (localRev[sl] || 0) === (savedRev[sl] || 0); }
  function touchAct(id){ actRev[id] = (actRev[id] || 0) + 1; }
  function cleanAct(id){ return (actRev[id] || 0) === (actSaved[id] || 0); }

  function setSave(msg, isErr){
    var l = $("saveline"); if (!l) return;
    l.classList.toggle("err", !!isErr);
    l.textContent = msg;
  }
  function saveError(m){ setSave(m, true); }

  /* ===================== persistence ===================== */
  var timers = {}, chains = {};
  function debounce(key, fn){ clearTimeout(timers[key]); timers[key] = setTimeout(fn, 550); }
  function queue(key, fn){ chains[key] = (chains[key] || Promise.resolve()).then(fn, fn); return chains[key]; }

  function handleWriteError(e){
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted"){
      canWrite = false;
      showNotice("You can view this portal but not change it. Ask the owner for edit access to record interview outcomes.");
      if (current) openDrawer(current);
      renderActs();
    } else if (code === "quota_exceeded" || code === "resource_exhausted"){
      saveError("Not saved — the store is busy. Try again shortly.");
    } else {
      saveError("Not saved — connection problem.");
    }
  }
  function saveTrack(sl){
    if (!db){ setSave("Not connected \u2014 nothing is being saved. Reload the page.", true); return; }
    if (!canWrite){ setSave("Read-only in this view", true); return; }
    var rev = localRev[sl] || 0;
    var t = track[sl], body = {};
    Object.keys(t).forEach(function(k){ body[k] = t[k]; });
    setSave("Saving\u2026", false);
    queue("t" + sl, function(){
      return db.doc("tracking/c" + sl).set(body).then(function(){
        if (rev > (savedRev[sl] || 0)) savedRev[sl] = rev;
        if (current === sl && clean(sl)) setSave("Saved for everyone", false);
      }, handleWriteError);
    });
  }
  function saveAct(id){
    if (!db || !canWrite) return;
    var rev = actRev[id] || 0;
    var a = acts[id], body = {status:a.status, owner:a.owner};
    queue("a" + id, function(){
      return db.doc("actions/" + id).set(body).then(function(){
        if (rev > (actSaved[id] || 0)) actSaved[id] = rev;
      }, handleWriteError);
    });
  }
  function showNotice(text){
    var n = $("notice");
    n.hidden = false; n.className = "notice"; n.textContent = text;
  }

  function connect(){
    var cl = window.claude;
    if (!cl || !cl.use){ offline(); return; }
    Promise.resolve(cl.use("downloads")).then(function(d){
      dl = d || null;
      if (!$("exportpanel").hidden) renderExport();
    }, function(){ dl = null; });
    Promise.resolve(cl.use("db")).then(function(store){
      if (!store){ offline(); return; }
      db = store; dbLive = true;
      // Edits made while the store was still connecting are still pending.
      Object.keys(localRev).forEach(function(sl){ if (!clean(sl)) saveTrack(+sl); });
      Object.keys(actRev).forEach(function(id){ if (!cleanAct(id)) saveAct(id); });
      store.collection("tracking").onSnapshot(function(snap){
        snap.docs.forEach(function(d){
          var sl = +String(d.id).replace(/^c/, "");
          if (!BY_SL[sl]) return;
          if (!clean(sl)) return;   // this viewer has edits the server has not confirmed
          var data = d.data() || {}, t = blankTrack();
          Object.keys(LEGACY).forEach(function(old){
            if (data[old] != null && data[LEGACY[old]] == null) data[LEGACY[old]] = data[old];
          });
          Object.keys(t).forEach(function(k){ if (data[k] != null) t[k] = data[k]; });
          track[sl] = t;
        });
        renderAll();
        if (current !== null && clean(current) && !$("dbody").contains(document.activeElement)) openDrawer(current);
      }, function(){});
      store.collection("actions").onSnapshot(function(snap){
        snap.docs.forEach(function(d){
          if (!acts[d.id] || !cleanAct(d.id)) return;
          var data = d.data() || {};
          acts[d.id] = {status:data.status || "Open", owner:data.owner || ""};
        });
        renderActs(); renderStats();
      }, function(){});
    }, function(){ offline(); });
  }
  function offline(){
    dbLive = false; canWrite = false;
    showNotice("Shared saving is not available in this view, so interview outcomes cannot be recorded here. Everything else on the page is live.");
    renderActs();
    if (current) openDrawer(current);
  }

  /* ===================== wiring ===================== */
  (function(){
    var dl = document.getElementById("rolesuggest");
    ROLE_SUGGEST.forEach(function(r){
      var o = document.createElement("option"); o.value = r; dl.appendChild(o);
    });
  })();
  applyTheme();
  buildThemeSheet();
  $("asof").textContent = fmtDate(today);

  $("themebtn").addEventListener("click", function(e){
    e.stopPropagation();
    var sheet = $("themesheet"), open = sheet.hidden;
    sheet.hidden = !open;
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function(e){
    var sheet = $("themesheet");
    if (!sheet.hidden && !sheet.contains(e.target) && e.target !== $("themebtn")){
      sheet.hidden = true;
      $("themebtn").setAttribute("aria-expanded", "false");
    }
  });

  $("q").addEventListener("input", function(e){
    q = e.target.value.trim().toLowerCase();
    $("clearq").hidden = !q;
    renderAll();
  });
  $("clearq").addEventListener("click", function(){
    $("q").value = ""; q = ""; this.hidden = true; renderAll(); $("q").focus();
  });
  $("sort").addEventListener("change", function(e){ sortBy = e.target.value; renderRows(); });
  function setDensity(d){
    density = d;
    $("v-compact").setAttribute("aria-pressed", d === "compact" ? "true" : "false");
    $("v-detail").setAttribute("aria-pressed", d === "detail" ? "true" : "false");
    try { localStorage.setItem("ikrux.density", d); } catch (e) {}
    renderRows();
  }
  $("v-compact").addEventListener("click", function(){ setDensity("compact"); });
  $("v-detail").addEventListener("click", function(){ setDensity("detail"); });
  setDensity(density);

  $("exportbtn").addEventListener("click", function(){
    var open = $("exportpanel").hidden;
    if (open) renderExport();
    $("exportpanel").hidden = !open;
    this.setAttribute("aria-pressed", open ? "true" : "false");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });

  $("refinebtn").addEventListener("click", function(){
    var open = $("refine").hidden;
    $("refine").hidden = !open;
    this.setAttribute("aria-pressed", open ? "true" : "false");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  if (C.every(function(c){ return c.resume; })) $("cvonly").hidden = true;
  $("cvonly").addEventListener("click", function(){
    var on = sel.fCv.indexOf("On file") > -1;
    sel.fCv = on ? [] : ["On file"];
    this.setAttribute("aria-pressed", on ? "false" : "true");
    renderAll();
  });
  $("flagonly").addEventListener("click", function(){
    var on = sel.fFlag.length === 3;
    sel.fFlag = on ? [] : ["High","Medium","Low"];
    this.setAttribute("aria-pressed", on ? "false" : "true");
    renderAll();
  });

  var sc = $("sevchips");
  [["","All"],["High","High"],["Medium","Medium"],["Low","Low"]].forEach(function(p){
    var b = chipBtn(p[1], actSev === p[0], function(){
      actSev = p[0];
      Array.prototype.forEach.call(sc.children, function(x){ x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      renderActs();
    });
    sc.appendChild(b);
  });
  $("hidedone").addEventListener("click", function(){
    actHideDone = !actHideDone;
    this.setAttribute("aria-pressed", actHideDone ? "true" : "false");
    renderActs();
  });

  function selectTab(which){
    var pipe = which === "pipeline";
    $("tab-pipeline").setAttribute("aria-selected", pipe ? "true" : "false");
    $("tab-actions").setAttribute("aria-selected", pipe ? "false" : "true");
    $("view-pipeline").hidden = !pipe;
    $("view-actions").hidden = pipe;
  }
  $("tab-pipeline").addEventListener("click", function(){ selectTab("pipeline"); });
  $("tab-actions").addEventListener("click", function(){ selectTab("actions"); });

  ["profile","resume","track"].forEach(function(k){
    $("dt-" + k).addEventListener("click", function(){ if (current !== null) openDrawer(current, k); });
  });
  $("dclose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (!$("themesheet").hidden){
      $("themesheet").hidden = true;
      $("themebtn").setAttribute("aria-expanded", "false");
      return;
    }
    if (current !== null) closeDrawer();
  });

  renderAll();
  renderActs();
  connect();
})();
</script>
