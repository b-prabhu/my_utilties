<title>Coimbatore Hiring Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
  :root{
    --paper:#F3F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --sunk:#ECEEE9;
    --ink:#14202E; --ink-2:#44525F; --ink-3:#6E7B87; --line:#DCDFD9; --line-2:#C8CCC4;
    --accent:#1B5E8C; --accent-soft:#E4EEF5; --accent-ink:#134A6F;
    --ok:#2E6F4E; --ok-soft:#E2EFE7;
    --warn:#8A6210; --warn-soft:#F6EDDA;
    --risk:#A3372B; --risk-soft:#F7E4E1;
    --shadow:0 1px 2px rgba(20,32,46,.06), 0 8px 24px rgba(20,32,46,.07);
    --r:9px;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10151B; --surface:#172029; --surface-2:#1C262F; --sunk:#0B1015;
      --ink:#E4E8EC; --ink-2:#A6B2BC; --ink-3:#7A8791; --line:#2A3641; --line-2:#3A4855;
      --accent:#6FB2DA; --accent-soft:#1B2E3B; --accent-ink:#9FCDE8;
      --ok:#6FBE90; --ok-soft:#17291F;
      --warn:#D9A648; --warn-soft:#2B2416;
      --risk:#E08579; --risk-soft:#2E1A18;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#10151B; --surface:#172029; --surface-2:#1C262F; --sunk:#0B1015;
    --ink:#E4E8EC; --ink-2:#A6B2BC; --ink-3:#7A8791; --line:#2A3641; --line-2:#3A4855;
    --accent:#6FB2DA; --accent-soft:#1B2E3B; --accent-ink:#9FCDE8;
    --ok:#6FBE90; --ok-soft:#17291F;
    --warn:#D9A648; --warn-soft:#2B2416;
    --risk:#E08579; --risk-soft:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance}
  button,input,select,textarea{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* ---------- masthead ---------- */
  .masthead{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .wrap{max-width:1360px; margin:0 auto; padding-inline:16px}
  .brandrow{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; padding-block:14px 12px}
  .brand h1{
    font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:-.01em; line-height:1.1;
  }
  .brand p{margin:3px 0 0; color:var(--ink-3); font-size:12.5px}
  .asof{
    margin-left:auto; text-align:right; font-size:11px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.09em;
  }
  .asof b{display:block; font-family:var(--mono); font-size:13px; letter-spacing:0;
    text-transform:none; color:var(--ink); font-weight:500; margin-top:2px}

  .stats{display:flex; gap:0; flex-wrap:wrap; border-top:1px solid var(--line)}
  .stat{
    flex:1 1 128px; padding:9px 14px 10px; border-right:1px solid var(--line);
  }
  .stat:first-child{padding-left:0}
  .stat:last-child{border-right:0}
  .stat .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.085em; color:var(--ink-3)}
  .stat .v{font-family:var(--mono); font-size:19px; font-weight:500; line-height:1.25; margin-top:1px}
  .stat .v small{font-size:12px; color:var(--ink-3); font-weight:400}
  .stat.is-risk .v{color:var(--risk)}
  .stat.is-ok .v{color:var(--ok)}

  .tabs{display:flex; gap:2px; border-top:1px solid var(--line); background:var(--surface-2)}
  .tab{
    appearance:none; background:none; border:0; border-bottom:2px solid transparent;
    padding:9px 14px; font-size:13px; font-weight:500; color:var(--ink-3); cursor:pointer;
  }
  .tab:first-child{padding-left:0}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
  .tab:hover{color:var(--ink)}

  /* ---------- notices ---------- */
  .notice{
    display:flex; gap:9px; align-items:flex-start; margin:12px 0 0;
    padding:9px 12px; border-radius:var(--r); font-size:12.5px; line-height:1.45;
    background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 28%, transparent);
  }
  .notice b{font-weight:600}

  /* ---------- toolbar ---------- */
  main{padding-block:14px 40px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
  .search{
    flex:1 1 210px; min-width:0; max-width:320px; padding:7px 11px;
    background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r);
  }
  .search::placeholder{color:var(--ink-3)}
  .chips{display:flex; gap:5px; flex-wrap:wrap}
  .chip{
    appearance:none; cursor:pointer; padding:6px 11px; font-size:12.5px; font-weight:500;
    background:var(--surface); color:var(--ink-2);
    border:1px solid var(--line-2); border-radius:100px;
  }
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface)}
  .chip:hover{border-color:var(--accent)}
  .sortsel{
    padding:7px 9px; background:var(--surface); border:1px solid var(--line-2);
    border-radius:var(--r); font-size:12.5px; margin-left:auto;
  }

  /* ---------- rows ---------- */
  .colhead, .row{
    display:grid; align-items:center; gap:10px;
    grid-template-columns:3px 30px minmax(150px,1.5fr) 132px 60px 124px 108px 116px 104px;
  }
  .colhead{
    padding:0 12px 6px 0; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.085em; color:var(--ink-3);
  }
  .colhead span:nth-child(6),.colhead span:nth-child(5){text-align:right}
  .list{display:flex; flex-direction:column; gap:5px}
  .row{
    width:100%; text-align:left; cursor:pointer; padding:9px 12px 9px 0;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    overflow:hidden; font:inherit; color:inherit;
  }
  .row:hover{border-color:var(--line-2); box-shadow:var(--shadow)}
  .row[aria-current="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .rail{align-self:stretch; background:transparent; border-radius:2px 0 0 2px; margin:-9px 0}
  .rail.high{background:var(--risk)} .rail.med{background:var(--warn)} .rail.low{background:var(--line-2)}
  .sl{font-family:var(--mono); font-size:12px; color:var(--ink-3); text-align:center}
  .who strong{
    display:block; font-family:var(--serif); font-size:16.5px; font-weight:500;
    line-height:1.2; letter-spacing:-.005em;
  }
  .who span{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .role{font-size:11.5px; color:var(--ink-2); line-height:1.25}
  .exp{font-family:var(--mono); font-size:12.5px; text-align:right; color:var(--ink-2)}
  .pay{text-align:right; font-family:var(--mono); font-size:12.5px; line-height:1.3}
  .pay b{font-weight:500}
  .pay i{font-style:normal; display:block; font-size:11px; color:var(--ink-3)}
  .pay i.hot{color:var(--warn)}

  .pill{
    display:inline-block; padding:2.5px 8px; border-radius:100px; font-size:11px;
    font-weight:600; letter-spacing:.01em; white-space:nowrap;
    border:1px solid transparent;
  }
  .pill.ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
  .pill.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
  .pill.risk{background:var(--risk-soft); color:var(--risk); border-color:color-mix(in srgb,var(--risk) 26%,transparent)}
  .pill.mute{background:var(--sunk); color:var(--ink-3); border-color:var(--line)}
  .pill.accent{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 26%,transparent)}

  .stages{display:flex; gap:4px; align-items:center}
  .dot{
    width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line-2); background:transparent;
  }
  .dot.done{background:var(--ok); border-color:var(--ok)}
  .dot.fail{background:var(--risk); border-color:var(--risk)}
  .dot.live{background:var(--accent); border-color:var(--accent)}
  .dot.hold{background:var(--warn); border-color:var(--warn)}
  .stages em{font-style:normal; font-size:10.5px; color:var(--ink-3); margin-left:3px}

  .empty{padding:40px 16px; text-align:center; color:var(--ink-3); font-size:13px}

  @media (max-width:1040px){
    .colhead{display:none}
    .row{
      grid-template-columns:3px 30px minmax(130px,1fr) 112px 108px;
      grid-template-areas:
        "rail sl who pay avail"
        "rail sl role stages status";
      row-gap:7px; align-items:start;
    }
    .rail{grid-area:rail} .sl{grid-area:sl; padding-top:3px} .who{grid-area:who}
    .role{grid-area:role} .exp{display:none} .pay{grid-area:pay}
    .avail{grid-area:avail; text-align:right} .stages{grid-area:stages} .status{grid-area:status; text-align:right}
  }
  @media (max-width:560px){
    .row{
      grid-template-columns:3px 28px 1fr auto;
      grid-template-areas:
        "rail sl who who"
        "rail sl role pay"
        "rail sl stages avail"
        "rail sl status status";
    }
    .status{text-align:left}
    .avail{text-align:right}
  }

  /* ---------- action log ---------- */
  .acts{display:flex; flex-direction:column; gap:6px}
  .act{
    display:grid; gap:4px 12px; padding:11px 13px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r);
    grid-template-columns:auto minmax(0,1fr) 150px;
    grid-template-areas:"sev head ctl" ". body ctl";
  }
  .act .sev{grid-area:sev} .act .head{grid-area:head} .act .body{grid-area:body} .act .ctl{grid-area:ctl}
  .act .head{font-weight:600; font-size:13px}
  .act .head span{font-weight:400; color:var(--ink-3); font-family:var(--mono); font-size:11.5px}
  .act .body{font-size:12.5px; color:var(--ink-2); line-height:1.5}
  .act .body em{font-style:normal; color:var(--ink); font-weight:500}
  .act .ctl{display:flex; flex-direction:column; gap:5px}
  .act.done{opacity:.55}
  @media (max-width:700px){
    .act{grid-template-columns:auto 1fr; grid-template-areas:"sev head" ". body" "ctl ctl"}
    .act .ctl{flex-direction:row}
  }

  /* ---------- drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(12,20,28,.44); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(460px,100%);
    background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; transform:translateX(102%);
    transition:transform .2s ease; box-shadow:var(--shadow);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){
    .drawer,.scrim{transition:none}
  }
  @media (max-width:560px){ .drawer{width:100%; border-left:0} }
  .dhead{
    padding:14px 16px 12px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start;
  }
  .dhead h2{font-family:var(--serif); font-size:21px; font-weight:600; line-height:1.15}
  .dhead p{margin:3px 0 0; font-size:12px; color:var(--ink-3)}
  .x{
    margin-left:auto; appearance:none; background:var(--sunk); border:1px solid var(--line);
    width:28px; height:28px; border-radius:7px; cursor:pointer; color:var(--ink-2);
    font-size:15px; line-height:1; flex:none;
  }
  .x:hover{color:var(--ink); border-color:var(--line-2)}
  .dbody{overflow-y:auto; padding:0 16px 28px; flex:1}
  .sec{padding-top:16px}
  .sec > h3{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3);
    padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:9px;
  }
  .kv{display:grid; grid-template-columns:104px 1fr; gap:5px 12px; font-size:12.5px}
  .kv dt{color:var(--ink-3)}
  .kv dd{margin:0; word-break:break-word}
  .kv dd.num{font-family:var(--mono)}
  .verdict{
    padding:10px 12px; border-radius:var(--r); font-size:12.5px; line-height:1.55;
    border:1px solid transparent;
  }
  .verdict b{display:block; margin-bottom:3px; font-size:11px; text-transform:uppercase; letter-spacing:.08em}
  .verdict.match{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 24%,transparent)}
  .verdict.caution{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 24%,transparent)}
  .verdict.risk{background:var(--risk-soft); color:var(--risk); border-color:color-mix(in srgb,var(--risk) 24%,transparent)}
  .verdict p{margin:0; color:var(--ink-2)}
  .verdict.match p{color:var(--ink-2)}
  .flaglist{display:flex; flex-direction:column; gap:7px}
  .flag{display:flex; gap:8px; font-size:12.5px; line-height:1.5; align-items:flex-start}
  .flag .t{flex:1}
  .flag .t em{font-style:normal; display:block; color:var(--ink-3); margin-top:2px}

  .form{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .form .full{grid-column:1/-1}
  .fld{display:flex; flex-direction:column; gap:3px; min-width:0}
  .fld label{font-size:10.5px; text-transform:uppercase; letter-spacing:.075em; color:var(--ink-3)}
  .fld input,.fld select,.fld textarea{
    width:100%; padding:6px 8px; background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line-2); border-radius:7px; font-size:12.5px;
  }
  .fld textarea{resize:vertical; min-height:58px; line-height:1.5}
  .fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:.55; cursor:not-allowed}
  .subhead{
    grid-column:1/-1; font-size:11px; font-weight:600; color:var(--ink-2);
    margin-top:4px; display:flex; align-items:center; gap:8px;
  }
  .subhead::after{content:""; flex:1; height:1px; background:var(--line)}
  .saveline{
    grid-column:1/-1; font-size:11.5px; color:var(--ink-3); min-height:16px;
    font-family:var(--mono);
  }
  .saveline.err{color:var(--risk)}
</style>

<div class="masthead">
  <div class="wrap brandrow">
    <div class="brand">
      <h1>Coimbatore Hiring Pipeline</h1>
      <p>IKrux Engineering &middot; 17 candidates submitted 21 Sep 2026</p>
    </div>
    <div class="asof">As on<b id="asof">&mdash;</b></div>
  </div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-pipeline" role="tab" aria-selected="true" aria-controls="view-pipeline">Pipeline</button>
      <button class="tab" id="tab-actions" role="tab" aria-selected="false" aria-controls="view-actions">Action log</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="notice" hidden></div>

  <section id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline">
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search name, company, skill&hellip;" aria-label="Search candidates">
      <div class="chips" id="rolechips"></div>
      <button class="chip" id="flagonly" aria-pressed="false">Flagged only</button>
      <select class="sortsel" id="sort" aria-label="Sort candidates">
        <option value="sl">Submission order</option>
        <option value="avail">Soonest available</option>
        <option value="ectc">Highest expectation</option>
        <option value="hike">Largest hike</option>
        <option value="name">Name</option>
      </select>
    </div>
    <div class="colhead" aria-hidden="true">
      <span></span><span>#</span><span>Candidate</span><span>Role</span><span>Exp</span>
      <span>CTC &rarr; ECTC</span><span>Availability</span><span>Stages</span><span>Status</span>
    </div>
    <div class="list" id="rows"></div>
  </section>

  <section id="view-actions" role="tabpanel" aria-labelledby="tab-actions" hidden>
    <div class="toolbar">
      <div class="chips" id="sevchips"></div>
      <button class="chip" id="hidedone" aria-pressed="false">Hide closed</button>
    </div>
    <div class="acts" id="acts"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dname" tabindex="-1">
  <div class="dhead">
    <div>
      <h2 id="dname">&mdash;</h2>
      <p id="drole"></p>
    </div>
    <button class="x" id="dclose" aria-label="Close panel">&times;</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

    var l = $("saveline"); if (!l || !canWrite) return;
    l.classList.remove("err"); l.textContent = "Saving…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var n = $("saveline");
      if (n && !n.classList.contains("err")) n.textContent = dbLive ? "Saved for everyone" : "Saved locally — not shared";
    }, 900);
  }
  function saveError(msg){
    var l = $("saveline"); if (!l) return;
    l.classList.add("err"); l.textContent = msg;
  }

  /* ---------------- persistence ---------------- */
  var timers = {};
  function debounce(key, fn){
    clearTimeout(timers[key]);
    timers[key] = setTimeout(fn, 550);
  }

  var chains = {};
  function queue(key, fn){
    chains[key] = (chains[key] || Promise.resolve()).then(fn, fn);
    return chains[key];
  }

  function handleWriteError(e){
    var code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted"){
      canWrite = false;
      showNotice("You can view this pipeline but not change it. Ask the owner for edit access to record interview outcomes.", true);
      if (current) openDrawer(current);
      renderActs();
    } else if (code === "quota_exceeded" || code === "resource_exhausted"){
      saveError("Not saved — the store is busy. Try again shortly.");
    } else {
      saveError("Not saved — connection problem.");
    }
  }

  function saveTrack(sl){
    if (!db || !canWrite) return;
    var body = {};
    var t = track[sl];
    Object.keys(t).forEach(function(k){ body[k] = t[k]; });
    queue("t" + sl, function(){
      return db.doc("tracking/c" + sl).set(body).catch(handleWriteError);
    });
  }
  function saveAct(id){
    if (!db || !canWrite) return;
    var a = acts[id];
    queue("a" + id, function(){
      return db.doc("actions/" + id).set({status:a.status, owner:a.owner}).catch(handleWriteError);
    });
  }

  function showNotice(text, warn){
    var n = $("notice");
    n.hidden = false;
    n.className = "notice";
    n.textContent = "";
    var b = el("b", null, warn ? "Read-only. " : "Heads up. ");
    n.appendChild(b);
    n.appendChild(document.createTextNode(text));
  }

  async function connect(){
    var c = window.claude;
    if (!c || !c.use) { offline(); return; }
    var store = null;
    try { store = await c.use("db"); } catch (e) { store = null; }
    if (!store) { offline(); return; }
    db = store; dbLive = true;

    store.collection("tracking").onSnapshot(function(snap){
      snap.docs.forEach(function(d){
        var sl = +String(d.id).replace(/^c/, "");
        if (!BY_SL[sl]) return;
        var data = d.data() || {};
        var t = blankTrack();
        Object.keys(t).forEach(function(k){ if (data[k] != null) t[k] = data[k]; });
        track[sl] = t;
      });
      renderRows(); renderStats();
      if (current) refreshOpenForm();
    }, function(){ /* subscription ended; page keeps working */ });

    store.collection("actions").onSnapshot(function(snap){
      snap.docs.forEach(function(d){
        if (!acts[d.id]) return;
        var data = d.data() || {};
        acts[d.id] = {status:data.status || "Open", owner:data.owner || ""};
      });
      renderActs(); renderStats();
    }, function(){});
  }

  function refreshOpenForm(){
    // Re-render the drawer only when it is not being typed into.
    var a = document.activeElement;
    if (a && $("dbody").contains(a)) return;
    openDrawer(current);
  }

  function offline(){
    dbLive = false; canWrite = false;
    showNotice("Shared saving is not available in this view, so interview outcomes cannot be recorded here. Everything else on the page is live.", true);
    renderActs();
    if (current) openDrawer(current);
  }

  /* ---------------- wiring ---------------- */
  $("asof").textContent = fmtDate(today);

  var rc = $("rolechips");
  [["", "All roles"]].concat(ROLES.map(function(r){ return [r, r]; })).forEach(function(p){
    var b = el("button", "chip", p[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", filters.role === p[0] ? "true" : "false");
    b.addEventListener("click", function(){
      filters.role = p[0];
      Array.prototype.forEach.call(rc.children, function(x){ x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      renderRows();
    });
    rc.appendChild(b);
  });

  var sc = $("sevchips");
  [["", "All"], ["High", "High"], ["Medium", "Medium"], ["Low", "Low"]].forEach(function(p){
    var b = el("button", "chip", p[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", actFilters.sev === p[0] ? "true" : "false");
    b.addEventListener("click", function(){
      actFilters.sev = p[0];
      Array.prototype.forEach.call(sc.children, function(x){ x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      renderActs();
    });
    sc.appendChild(b);
  });

  $("q").addEventListener("input", function(e){
    filters.q = e.target.value.trim().toLowerCase(); renderRows();
  });
  $("sort").addEventListener("change", function(e){ filters.sort = e.target.value; renderRows(); });
  $("flagonly").addEventListener("click", function(){
    filters.flagged = !filters.flagged;
    this.setAttribute("aria-pressed", filters.flagged ? "true" : "false");
    renderRows();
  });
  $("hidedone").addEventListener("click", function(){
    actFilters.hideDone = !actFilters.hideDone;
    this.setAttribute("aria-pressed", actFilters.hideDone ? "true" : "false");
    renderActs();
  });

  function selectTab(which){
    var pipe = which === "pipeline";
    $("tab-pipeline").setAttribute("aria-selected", pipe ? "true" : "false");
    $("tab-actions").setAttribute("aria-selected", pipe ? "false" : "true");
    $("view-pipeline").hidden = !pipe;
    $("view-actions").hidden = pipe;
  }
  $("tab-pipeline").addEventListener("click", function(){ selectTab("pipeline"); });
  $("tab-actions").addEventListener("click", function(){ selectTab("actions"); });

  $("dclose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && current !== null) closeDrawer();
  });

  renderStats();
  renderRows();
  renderActs();
  connect();
})();
</script>
