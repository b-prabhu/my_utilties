  return `<div class="scrollx" role="group" aria-label="Measurement">${Object.entries(MTYPES).map(([k, v]) => `<button class="chip" aria-pressed="${type === k}" data-act="mType" data-t="${k}">${v[0]}</button>`).join('')}</div>
  <button class="btn primary" data-act="measureForm" data-type="${type}">${I.plus}Log ${MTYPES[type][0].toLowerCase()}</button>
  <div class="grid2"><div class="stat"><span class="k">Latest</span><span class="v">${last ? mDisp(type, last.value) + '<small>' + u + '</small>' : '–'}</span><span class="tiny muted">${last ? esc(fmtDate(last.measuredAt)) : 'No entries'}</span></div>
  <div class="stat"><span class="k">Change in range</span><span class="v">${inR.length > 1 ? (inR[inR.length - 1].value - inR[0].value >= 0 ? '+' : '−') + mDisp(type, Math.abs(inR[inR.length - 1].value - inR[0].value)) + '<small>' + u + '</small>' : '–'}</span></div>
  <div class="stat"><span class="k">7-day average</span><span class="v">${last7.length >= 3 ? mDisp(type, sum(last7.map(x => x.value)) / last7.length) + '<small>' + u + '</small>' : '–'}</span>${last7.length < 3 ? '<span class="tiny muted">Needs 3 entries this week</span>' : ''}</div>
  <div class="stat"><span class="k">30-day trend</span><span class="v">${tr == null ? '–' : (tr >= 0 ? '+' : '−') + mDisp(type, Math.abs(tr)) + '<small>' + u + '/wk</small>'}</span></div></div>

  <section class="card">${rangeChips(p)}${lineChart('mc', ser.pts, { dotsOnly: type === 'weight' && ser.pts.length > 8, extra: type === 'weight' && ser.pts.length > 8 ? ser.avg : null, fmt: v => trim(round(v, 10)), label: MTYPES[type][0] + ' trend' })}
  ${type === 'weight' && ser.pts.length > 8 ? '<div class="legend"><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--primary)" opacity=".45"/></svg>Weigh-ins</span><span><svg width="22" height="6"><path d="M1 3h20" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4"/></svg>7-day average</span></div>' : ''}</section>
  <section class="card"><h3>Entries</h3><div class="list">${all.slice().reverse().slice(0, 30).map(x => `<div class="li"><div class="grow"><b class="num">${fmtV(x.value)}</b><div class="tiny muted">${esc(fmtDate(x.measuredAt))} · ${fmtTime(x.measuredAt)}${x.note ? ' · ' + esc(x.note) : ''}</div></div><button class="btn sm ghost danger" data-act="delMeasure" data-id="${x.id}" aria-label="Delete entry">Delete</button></div>`).join('') || '<div class="empty">No entries yet.</div>'}</div></section>`;
};
function measureSheet(type = 'weight') {

  sheet('Log measurement', `<div class="grid2"><label class="f">Measurement<select class="in" id="m-type" data-chg="mFormType">${Object.entries(MTYPES).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label>
  <label class="f">Value (<span id="m-unit">${mUnit(type)}</span>)<input class="in" id="m-val" inputmode="decimal" value="${lv ? mDisp(type, lv.value) : ''}"></label>
  <label class="f">Date<input class="in" type="date" id="m-date" value="${dkey(d)}"></label><label class="f">Time<input class="in" type="time" id="m-time" value="${pad(d.getHours())}:${pad(d.getMinutes())}"></label></div>

  <button class="btn primary big" data-act="saveMeasure">Save</button>`);
}

/* ============ ACTIVITIES ============ */
VIEWS.activities = p => {
  const [a, b] = rangeOf(p), list = S.activities.filter(x => inRange(x.startedAt, a, b)).sort((x, y) => y.startedAt - x.startedAt);

  const mo = Array.from({ length: 6 }, (_, i) => { const t = new Date(); const s = new Date(t.getFullYear(), t.getMonth() - 5 + i, 1), e = new Date(+new Date(s.getFullYear(), s.getMonth() + 1, 1) - 1); const n = S.activities.filter(x => x.type === 'badminton' && inRange(x.startedAt, s, e)).length; return { l: fmtDate(s, { month: 'short' }), v: n, t: fmtDate(s, { month: 'long' }) + ': ' + n + ' badminton session' + (n === 1 ? '' : 's') }; });

};
function activitySheet(id, type) {

  <label class="f">Intensity<select class="in" id="a-int">${INTENSITY.map(v => `<option ${x && x.intensity === v ? 'selected' : (!x && v === 'moderate' ? 'selected' : '')}>${v}</option>`).join('')}</select></label>

/* ============ GOALS ============ */
const GOAL_TYPES = { weekly_workouts: 'Workouts per week', monthly_workouts: 'Workouts per month', strength: 'Exercise strength', body_weight: 'Body weight', measurement: 'Body measurement', activity_minutes: 'Weekly activity minutes', consistency: 'Workout adherence %' };
function latestM(type) { const m = S.measurements.filter(x => x.type === type).sort((a, b) => a.measuredAt - b.measuredAt); return m[m.length - 1]; }
function goalProgress(g) {
  const [w0, w1] = weekRange(0), t = new Date();
  const dir = (cur, base, target) => { if (cur == null) return { pct: null }; if (base == null || base === target) return { pct: cur >= target ? 1 : 0 }; return { pct: clamp((cur - base) / (target - base), 0, 1) }; };
  if (g.type === 'weekly_workouts') { const c = weekStats(w0, w1).workouts; return { cur: c, curTxt: c + ' this week', tgt: g.target + ' / week', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' to go' }; }
  if (g.type === 'monthly_workouts') { const c = doneSessions().filter(s => inRange(s.startedAt, new Date(t.getFullYear(), t.getMonth(), 1), t)).length; return { curTxt: c + ' this month', tgt: g.target + ' / month', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' to go' }; }
  if (g.type === 'activity_minutes') { const c = Math.round(weekStats(w0, w1).cardio); return { curTxt: c + ' min this week', tgt: g.target + ' min', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' min to go' }; }
  if (g.type === 'consistency') { const ad = adherence(addDays(now(), -27), new Date()); return { curTxt: (ad.pct ?? '–') + '% (4 weeks)', tgt: g.target + '%', pct: ad.pct == null ? null : clamp(ad.pct / g.target, 0, 1), rem: '' }; }
  if (g.type === 'strength') { const b = prData().best[g.exerciseId]; const c = b ? (g.metric === 'e1' ? b.e1 : b.top) : null; const r = dir(c, g.baseline, g.target); return { curTxt: c ? fmtW(round(c, 10)) : 'Not logged', tgt: fmtW(g.target) + (g.metric === 'e1' ? ' est. 1RM' : ''), pct: r.pct, rem: c != null && c < g.target ? fmtW(round(g.target - c, 10)) + ' to go' : c != null ? 'Reached' : '' }; }
  const mt = g.type === 'body_weight' ? 'weight' : g.mtype, lm = latestM(mt), c = lm ? lm.value : null, fv = v => mDisp(mt, v) + ' ' + mUnit(mt);
  const rows = S.measurements.filter(x => x.type === mt && x.measuredAt > now() - 30 * DAY), tr = trendPerWeek(rows);
  if (g.mode === 'range') {
    const inr = c != null && c >= g.min && c <= g.max, tgtV = c != null && c > g.max ? g.max : g.min;
    const r = inr ? { pct: 1 } : dir(c, g.baseline, tgtV);
    let eta = ''; if (!inr && c != null && tr && Math.sign(tgtV - c) === Math.sign(tr)) eta = 'At the current trend: around ' + fmtDate(now() + (tgtV - c) / tr * 7 * DAY, { day: 'numeric', month: 'short', year: 'numeric' });
    return { curTxt: c == null ? 'Not logged' : fv(c), tgt: fv(g.min) + ' – ' + fv(g.max), pct: r.pct, rem: c == null ? '' : inr ? 'In range. Maintain it.' : fv(Math.abs(tgtV - c)) + (c > g.max ? ' above range' : ' below range'), eta, range: true, inr };
  }
  const r = dir(c, g.baseline, g.target), left = c == null ? null : g.target - c;
  let eta = ''; if (c != null && tr && left && Math.sign(left) === Math.sign(tr)) eta = 'At the current trend: around ' + fmtDate(now() + left / tr * 7 * DAY, { day: 'numeric', month: 'short', year: 'numeric' });
  return { curTxt: c == null ? 'Not logged' : fv(c), tgt: fv(g.target), pct: r.pct, rem: left == null ? '' : Math.abs(left) < 0.05 ? 'Reached' : fv(Math.abs(left)) + ' to go', eta };
}
VIEWS.goals = () => `<button class="btn primary" data-act="goalForm">${I.plus}New goal</button>
  ${S.goals.map(g => { const p = goalProgress(g); return `<section class="card"><div class="row nw between" style="align-items:flex-start"><div class="grow"><div class="eyebrow">${esc(GOAL_TYPES[g.type])}</div><h3>${esc(g.title)}</h3></div><button class="btn sm ghost danger" data-act="delGoal" data-id="${g.id}" aria-label="Delete goal">Delete</button></div>

<script>
/* ============ colour themes ============ */
var ACT_EXTRA, CHG_EXTRA, INP_EXTRA;
// Each palette is a hue + saturation. Tones are derived and contrast-checked so text and chart marks stay legible on white.
const PALETTES = [['periwinkle', 'Periwinkle', 232, 72], ['lavender', 'Lavender', 266, 56], ['rose', 'Rose', 345, 62], ['peach', 'Peach', 18, 80], ['butter', 'Butter', 44, 86], ['mint', 'Mint', 158, 46], ['sage', 'Sage', 100, 24], ['sky', 'Sky', 199, 72]];

function lum(c) { const x = c.map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * x[0] + .7152 * x[1] + .0722 * x[2]; }

<script>

  rem: el => { const s = set(), r = s.reminders[el.dataset.k], f = el.dataset.f; r[f] = f === 'on' ? el.checked : f === 'day' ? +el.value : el.value; setKV('settings', s); if (f === 'on') render(); },
  mFormType: el => { const t = el.value, lv = latestM(t); $('#m-unit').textContent = mUnit(t); $('#m-val').value = lv ? mDisp(t, lv.value) : ''; },
  aFormType: el => { const t = el.value; $('#a-distw').hidden = !ACTS[t][1]; $('#a-bad').hidden = t !== 'badminton'; },
  gFormType: el => goalSheet(el.value),
  impFile: el => { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#imp-text').value = r.result; }; r.readAsText(f); },
};
const INP = {
  exSearch: el => { const p = cur().p; p.q = el.value; $('#exlist').innerHTML = exList(exFilter(p), 'go" data-v="exercise'); },
  pickSearch: el => { $('#picklist').innerHTML = exList(exFilter({ q: el.value }), 'pickDo'); },
};

/* ============ export ============ */
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
function exportSheet(kind) {
  let text, name, type = 'text/csv';
  const iso = t => t ? new Date(t).toISOString() : '';
  if (kind === 'workouts') { const rows = [['session_id', 'started_at', 'ended_at', 'workout', 'session_status', 'exercise', 'set_number', 'set_type', 'weight_kg', 'weight_basis', 'reps', 'duration_s', 'rir', 'rpe', 'set_status', 'volume_kg']];
    doneSessions().forEach(s => s.exercises.forEach(sx => sx.sets.forEach((x, i) => rows.push([s.id, iso(s.startedAt), iso(s.endedAt), s.name, s.status, sx.name, i + 1, x.type, x.weight, sx.loadBasis, x.reps, x.duration, x.rir, x.rpe, x.status, setVol(x, sx)])))); text = csv(rows); name = 'fittrack-workouts.csv'; }
  else if (kind === 'measurements') { text = csv([['measured_at', 'type', 'value', 'unit', 'note']].concat(S.measurements.slice().sort((a, b) => a.measuredAt - b.measuredAt).map(m => [iso(m.measuredAt), m.type, m.value, MTYPES[m.type][1] === 'w' ? 'kg' : MTYPES[m.type][1] === 'l' ? 'cm' : '%', m.note]))); name = 'fittrack-measurements.csv'; }
  else if (kind === 'activities') { text = csv([['started_at', 'ended_at', 'type', 'duration_s', 'distance_m', 'avg_hr', 'calories', 'intensity', 'format', 'matches', 'source', 'notes']].concat(S.activities.slice().sort((a, b) => a.startedAt - b.startedAt).map(a => [iso(a.startedAt), iso(a.endedAt), a.type, a.duration, a.distance, a.hr, a.calories, a.intensity, a.format, a.matches, a.source, a.notes]))); name = 'fittrack-activities.csv'; }
  else { text = JSON.stringify({ app: 'FitTrack', version: 1, exportedAt: new Date().toISOString(), units: { weight: 'kg', length: 'cm', distance: 'm', time: 'ms epoch' }, data: { exercises: S.exercises, templates: S.templates, sessions: S.sessions, measurements: S.measurements, activities: S.activities, goals: S.goals, kv: S.kv } }, null, 1); name = 'fittrack-backup.json'; type = 'application/json'; }
  sheet('Export ' + (kind === 'all' ? 'all data' : kind), `<p class="small muted">Values are stored in kilograms, centimetres and metres regardless of display units. Download asks you to confirm where to save the file.</p><textarea class="in" id="exp-text" readonly style="min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(text)}</textarea><div class="btns"><button class="btn" data-act="copyExport">Copy</button><button class="btn primary" data-act="downloadExport" data-name="${name}" data-type="${type}">Download ${name.split('.').pop().toUpperCase()}</button></div>`);
}

/* ============ timers, alerts, reminders ============ */
let restAlerted = false, actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() { try { if (!actx) return; [0, 0.28].forEach(t0 => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.start(t); o.stop(t + 0.25); }); } catch (e) {} }
function notify(title, body) { try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) { new Notification(title, { body, tag: 'fittrack-' + title }); return true; } } catch (e) {} return false; }
function restDone() { const s = set(); if (s.vibrate && navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {} if (s.sound) beep(); notify('Rest complete', 'Time for your next set.'); }
function tick() {
  const a = A(); if (!a) return;
  const el = elapsed(a); document.querySelectorAll('[data-tick="elapsed"]').forEach(n => n.textContent = fmtClock(el));
  if (a.rest) {
    const left = a.rest.endAt - now();
    const t = document.querySelector('[data-tick="rest"]'), b = document.querySelector('[data-tick="restbar"]');
    if (t) { t.textContent = left > 0 ? fmtClock(left) : 'Go'; t.classList.toggle('done', left <= 0); }
    if (b) b.style.width = clamp(100 - left / (a.rest.dur * 1000) * 100, 0, 100) + '%';
    if (left <= 0 && !restAlerted && !a.rest.alerted) { restAlerted = true; a.rest.alerted = true; put('sessions', a); restDone(); renderRest(); }
    if (left < -6000) { a.rest = null; put('sessions', a); renderRest(); }
  }
}
function checkReminders() {
  if (!ME) return;
  const s = set(), r = s.reminders, d = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes()), tk = dkey(d), fired = S.kv.remFired || {};
  const fire = (k, title, body) => { if (fired[k] === tk) return; fired[k] = tk; setKV('remFired', fired); if (!notify(title, body)) toast(title + ': ' + body); };
  const p = planFor(d), due = p.kind === 'workout' && !p.skipped && dayStatus(d) === 'scheduled';
  if (r.workout.on && hm >= r.workout.time && due) fire('workout', 'Workout today', planLabel(p) + ' is scheduled.');
  if (r.missed.on && hm >= r.missed.time && due) fire('missed', 'Workout not logged', planLabel(p) + ' is still open today. Log it, move it or skip it.');
  if (r.weigh.on && r.weigh.days.includes(d.getDay()) && hm >= r.weigh.time && !S.measurements.some(m => m.type === 'weight' && dkey(m.measuredAt) === tk)) fire('weigh', 'Weigh-in', 'Log your body weight for today.');
  if (r.review.on && d.getDay() === r.review.day && hm >= r.review.time) fire('review', 'Weekly review', 'Your week in numbers is ready on the Progress tab.');
}
let hostTheme = null;
function applyTheme() { applyPalette(); const t = set().theme, root = document.documentElement; if (hostTheme === null) hostTheme = root.getAttribute('data-theme') || ''; if (t === 'system') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); } else root.setAttribute('data-theme', t); applyPalette(); }
function syncChip() { const c = $('#syncchip'); if (!c) return; const on = navigator.onLine, n = pendingCount();
  const [txt, ok] = !idb ? ['Not connected', false] : W.readOnly ? ['View only', false] : n ? [on ? 'Saving…' : `Offline · ${n} waiting`, on] : W.dead ? ['Not saved', false] : ['Saved', true];
  c.classList.toggle('off', !ok); c.querySelector('span').textContent = txt; c.setAttribute('aria-label', 'Storage: ' + txt); }
function fixSettings() { const s = S.kv.settings || {}; S.kv.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ...s, reminders: { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS.reminders)), ...(s.reminders || {}) } }; S.kv.profile = { ...DEFAULT_PROFILE, ...(S.kv.profile || {}) }; if (!S.kv.settings.appearanceV2) { S.kv.settings.theme = 'light'; S.kv.settings.appearanceV2 = true; } if (!S.kv.overrides) S.kv.overrides = {}; if (!S.kv.schedule) S.kv.schedule = { days: {} }; }

/* ============ wiring ============ */
Object.assign(ACT, ACT_EXTRA, AUTH_ACT); Object.assign(CHG, CHG_EXTRA); Object.assign(INP, INP_EXTRA);
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { unlockAudio(); f(el, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').innerHTML) closeSheet(); if (e.key === 'Enter' && e.target.matches('.stepper input')) e.target.blur(); });
document.addEventListener('pointermove', chartHover); document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerout', chartLeave);
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.stepper input')) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); renderBars(); if (A()) keepAwake(true); } });
window.addEventListener('online', syncChip); window.addEventListener('offline', syncChip);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && (h !== R.tab || R.stack.length)) tab(h); });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!$('#sheet').innerHTML && !document.activeElement.matches('input,textarea,select')) render(); }, 250); });

boot();
</script>
