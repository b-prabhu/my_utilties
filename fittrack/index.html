<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2563EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single mobile column (max 560px) — sticky top bar, scrolling cards, fixed bottom tab bar; workout controls sit within thumb reach. */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B;
  --primary:#2563EB; --primary-ink:#1D4ED8; --primary-soft:#DBEAFE; --on-primary:#FFFFFF;
  --success:#16A34A; --success-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --error:#DC2626; --error-soft:#FEE2E2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#172033; --surface-2:#1E2A40; --line:#26324A;
  --ink:#F8FAFC; --ink-2:#CBD5E1; --muted:#94A3B8;
  --primary:#60A5FA; --primary-ink:#93C5FD; --primary-soft:#1E3A5F; --on-primary:#0B1220;
  --success:#4ADE80; --success-soft:#14361F; --warn:#FBBF24; --warn-soft:#3A2E10; --error:#F87171; --error-soft:#3B1717;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#172033; --surface-2:#1E2A40; --line:#26324A;
  --ink:#F8FAFC; --ink-2:#CBD5E1; --muted:#94A3B8;
  --primary:#60A5FA; --primary-ink:#93C5FD; --primary-soft:#1E3A5F; --on-primary:#0B1220;
  --success:#4ADE80; --success-soft:#14361F; --warn:#FBBF24; --warn-soft:#3A2E10; --error:#F87171; --error-soft:#3B1717;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{flex:1;min-width:0;margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);min-height:32px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--success)}
.sync.off i{background:var(--warn)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px;display:flex;flex-direction:column;gap:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--primary)}
.minibar{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.minibar button{max-width:536px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:var(--r);background:var(--primary);color:var(--on-primary);padding:10px 14px;min-height:48px;box-shadow:var(--shadow);text-align:left}
.minibar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* type */
h2{margin:0;font:700 20px/1.15 var(--f-display);letter-spacing:.01em;text-wrap:balance}
h3{margin:0;font:600 17px/1.2 var(--f-body)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--primary);font-weight:600;padding:8px 4px;min-height:44px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.hero{background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding-inline:0}
button.li:first-child{border-top:0}
.chev{color:var(--muted);flex:none}

/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font:600 14px var(--f-body);color:var(--muted);margin-left:2px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.delta{font-size:12.5px;font-weight:600}
.up{color:var(--success)} .down{color:var(--error)} .flatd{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:54px;font-size:17px;border-radius:14px;width:100%}
.btn.danger{color:var(--error);border-color:var(--line)}
.btn.danger.solid{background:var(--error);border-color:var(--error);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--error-soft);color:var(--error)}
.pill.info{background:var(--primary-soft);color:var(--primary-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scrollx>*{flex:none}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.in,select.in,textarea.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;font-size:16px;color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--line);padding:6px 0}
.switch:first-child{border-top:0}
.switch input[type=checkbox]{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input[type=checkbox]:checked{background:var(--primary)}
.switch input[type=checkbox]:checked::after{transform:translateX(18px)}
.switch select.in{width:auto;min-width:120px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;min-width:0}
.day .dn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dd{font:700 20px/1 var(--f-display)}
.day .dl{font-size:10.5px;line-height:1.15;text-align:center;color:var(--ink-2);font-weight:600;min-height:24px;overflow-wrap:anywhere;padding-inline:2px}
.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.st svg{width:12px;height:12px}
.st.completed{background:var(--success);color:#fff}
.st.progress{background:var(--primary);color:var(--on-primary)}
.st.scheduled{border:2px solid var(--primary)}
.st.missed{border:2px dashed var(--error);color:var(--error)}
.st.skipped{background:var(--surface-2);color:var(--muted)}
.st.rest{background:var(--surface-2);color:var(--muted)}

/* workout */
.wk-head{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;margin-inline:-16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.clock{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.ok>i{background:var(--success)}
.expill{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;min-width:44px;padding:4px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px}
.expill[aria-current="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.expill.done{color:var(--success)}
.expill.skip{color:var(--muted);text-decoration:line-through}
.exname{font:700 26px/1.1 var(--f-display);text-wrap:balance}
.setcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.setcard.completed{background:var(--success-soft);border-color:transparent}
.setcard.skipped{opacity:.6}
.setcard.next{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.set-top{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.setno{font:700 18px/1 var(--f-display);min-width:22px}
.set-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px;gap:8px;align-items:end}
.stepper{display:flex;flex-direction:column;gap:3px;min-width:0}
.stepper .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.stepper .ctl{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;height:46px}
.stepper button{border:0;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink-2)}
.stepper input{border:0;background:transparent;text-align:center;font:700 20px var(--f-display);font-variant-numeric:tabular-nums;min-width:0;width:100%;padding:0}
.donebtn{height:46px;border-radius:12px;border:2px solid var(--success);background:var(--surface);color:var(--success);display:grid;place-items:center}
.donebtn svg{width:24px;height:24px}
.completed .donebtn{background:var(--success);color:#fff}
.set-extra{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.set-extra select{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 6px;font-size:13px}
.set-extra .btn{min-height:34px;padding:4px 10px;font-size:13px}
.rec{border-radius:12px;padding:12px;background:var(--primary-soft);color:var(--ink);display:flex;flex-direction:column;gap:8px;font-size:14px}
.restbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.restbar>div{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.restbar .t{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.restbar .lab{font-size:12px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .bar{background:rgba(127,127,127,.3)}
.restbar button{min-height:40px;border-radius:10px;border:1px solid rgba(127,127,127,.4);background:transparent;color:inherit;font-weight:700;padding:0 10px}
.restbar .done{color:var(--success)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.chart .ar{fill:var(--primary);opacity:.1}
.chart .dot{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.chart .dot.soft{fill:var(--primary);opacity:.45;stroke:none}
.chart .barr{fill:var(--primary)}
.chart .barr.dim{fill:var(--primary);opacity:.35}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .vl{fill:var(--ink-2);font-size:11px;font-weight:600;font-family:var(--f-body)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(84px,30%) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13.5px;min-height:28px}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--primary);border-radius:99px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.glyph{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.glyph svg{width:28px;height:28px}
.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.fav{color:var(--warn)}
ol.steps,ul.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card>summary{cursor:pointer;font-weight:600;min-height:28px;list-style-position:inside}
.paused{background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:600}
.prline{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prline:first-child{border-top:0}
.medal{width:30px;height:30px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
</style>

<header class="top"><div class="top-in">
  <button class="iconbtn" id="backbtn" data-act="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">FitTrack</h1>
  <button class="sync" id="syncchip" data-act="go" data-v="sync" aria-label="Storage and sync status"><i></i><span>On device</span></button>
</div></header>
<main id="main" aria-live="polite"><div class="empty">Loading FitTrack…</div></main>
<div id="minibar"></div>

const idbAll = st => new Promise(res => { if (!idb) return res([]); try { const q = idb.transaction(st).objectStore(st).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } });
function idbPut(st, obj) { if (!idb) return; try { idb.transaction(st, 'readwrite').objectStore(st).put(JSON.parse(JSON.stringify(obj))); } catch (e) { console.warn('save failed', e); } }
function idbDel(st, id) { if (!idb) return; try { idb.transaction(st, 'readwrite').objectStore(st).delete(id); } catch (e) {} }

function put(st, obj) {

  const arr = S[st]; const i = arr.findIndex(x => x.id === obj.id);
  if (i < 0) arr.push(obj); else arr[i] = obj;
  idbPut(st, obj); enqueue(st, obj.id, i < 0 ? 'create' : 'update'); S.ver++;
}
function del(st, id) { S[st] = S[st].filter(x => x.id !== id); idbDel(st, id); enqueue(st, id, 'delete'); S.ver++; }
function setKV(key, val) { S.kv[key] = val; idbPut('kv', { key, val }); enqueue('kv', key, 'update'); S.ver++; }
function enqueue(entity, entityId, op) {
  // Each local change gets a client operation ID; repeated edits to the same record coalesce into one pending op.
  let q = S.queue.find(x => x.entity === entity && x.entityId === entityId);

    const st = new Date(d);
    if (d.getDay() === 6) { st.setHours(10, 0, 0, 0); const dur = 80 + Math.floor(rnd() * 25);

    if (d.getDay() === 3) { st.setHours(19, 0, 0, 0); const dur = 35 + Math.floor(rnd() * 15);
      put('activities', { id: uid(), type: 'walking', startedAt: st.getTime(), endedAt: st.getTime() + dur * 60e3, duration: dur * 60, distance: Math.round(dur * 85), hr: null, calories: null, intensity: 'easy', notes: 'Recovery walk', source: 'manual', sample: true }); }

    else if (r && r.no) rec = `<div class="rec" style="background:var(--surface-2)"><span class="small">${esc(r.no)}</span></div>`; }
  else if (sx.rec === 'applied') rec = `<p class="tiny muted">Progression applied to this session's working sets.</p>`;
  const nextIdx = sx.sets.findIndex(x => x.status === 'pending');
  const sets = sx.sets.map((x, i) => setCard(s, sx, x, i, prevSets[i], i === nextIdx)).join('');
  return `${head}${paused}
  <section class="card" style="gap:14px">
    <div class="row nw" style="align-items:flex-start"><div class="glyph" aria-hidden="true">${glyph(sx.equipment)}</div><div class="grow"><div class="tiny muted">Exercise ${s.cur + 1} of ${n}${sx.optional ? ' · optional' : ''}</div><button class="exname" style="border:0;background:none;padding:0;text-align:left;color:var(--ink)" data-act="go" data-v="exercise" data-id="${sx.exerciseId}">${esc(sx.name)}</button>
      <div class="tiny muted">${esc([ex.primary].concat(ex.secondary || []).filter(Boolean).join(', '))} · ${esc(sx.equipment || '')}${sx.loadBasis === 'per_hand' ? ' · weight per hand' : ''}</div></div></div>
    <div class="row small" style="gap:6px"><span class="pill info">Target ${sx.sets.length} × ${repTxt(sx.repMin, sx.repMax)}${sx.tracking === 'duration' ? ' s' : ''}</span><span class="pill">Rest ${fmtRest(sx.rest)}</span></div>
    <div class="small"><span class="muted">Last time${prev ? ' (' + esc(fmtDate(prev.s.startedAt)) + ')' : ''}:</span> ${prev ? prevSets.map(x => esc(setTxt(x, prev.sx))).join(' · ') : 'no history yet'}</div>
    ${rec}
    <div class="sec" style="gap:8px">${sets}</div>
    <div class="btns"><button class="btn sm" data-act="addSet">${I.plus}Add set</button><button class="btn sm" data-act="pickExercise" data-mode="sub">Substitute</button>${sx.status === 'skipped' ? '<button class="btn sm" data-act="unskipEx">Unskip</button>' : '<button class="btn sm" data-act="skipEx">Skip exercise</button>'}</div>
    <label class="check small"><input type="checkbox" id="flag-${sx.id}" data-chg="flag" ${sx.flag ? 'checked' : ''}>Discomfort or poor technique today</label>
    <label class="f">Exercise notes<input class="in" id="xn-${sx.id}" data-chg="sxNotes" value="${esc(sx.notes)}" placeholder="Seat height 4, slow eccentric…"></label>
    <div class="row nw"><button class="btn grow" data-act="exGo" data-i="${s.cur - 1}" ${s.cur === 0 ? 'disabled' : ''}>‹ Previous</button><button class="btn grow ${nextIdx < 0 ? 'primary' : ''}" data-act="exGo" data-i="${s.cur + 1}" ${s.cur >= n - 1 ? 'disabled' : ''}>Next ›</button></div>
  </section>${sessionFooter(s)}`;
}
const setTxt = (x, sx) => sx.tracking === 'duration' ? (x.duration || 0) + ' s' : sx.tracking === 'reps' ? (x.reps || 0) + ' reps' : `${wNum(x.weight)}${sx.tracking === 'assisted' ? ' assist' : ''} × ${x.reps}`;
function setCard(s, sx, x, i, pv, isNext) {
  const showW = sx.tracking === 'weight_reps' || sx.tracking === 'assisted';
  const dur = sx.tracking === 'duration';
  const typeName = (SET_TYPES.find(t => t[0] === x.type) || [0, 'Working'])[1];
  const stepper = (field, label, val) => `<div class="stepper"><span class="lbl">${label}</span><div class="ctl"><button data-act="step" data-f="${field}" data-d="-1" data-i="${i}" aria-label="Decrease ${label}">−</button><input id="in-${x.id}-${field}" inputmode="decimal" value="${esc(val)}" data-chg="setField" data-f="${field}" data-i="${i}" aria-label="Set ${i + 1} ${label}"><button data-act="step" data-f="${field}" data-d="1" data-i="${i}" aria-label="Increase ${label}">+</button></div></div>`;
  const ctl = dur ? stepper('duration', 'Seconds', x.duration ?? '') + '<div></div>'
    : (showW ? stepper('weight', (sx.tracking === 'assisted' ? 'Assist ' : '') + wUnit() + (sx.loadBasis === 'per_hand' ? '/hand' : ''), wNum(x.weight)) : '<div></div>') + stepper('reps', 'Reps', x.reps ?? '');
  const sel = (f, opts, v, lab) => `<select id="sel-${x.id}-${f}" data-chg="setField" data-f="${f}" data-i="${i}" aria-label="${lab}">${opts.map(o => `<option value="${o[0]}" ${String(v ?? '') === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  return `<div class="setcard ${x.status} ${isNext && x.status === 'pending' ? 'next' : ''}">
    <div class="set-top"><span class="setno">${i + 1}</span><b>${esc(typeName)}</b><span class="muted">Target ${repTxt(x.tMin, x.tMax)}${dur ? ' s' : ''}</span><span class="muted grow" style="text-align:right">${pv ? 'Prev ' + esc(setTxt(pv, sx)) : ''}</span>${x.status === 'skipped' ? '<span class="pill">Skipped</span>' : ''}</div>
    <div class="set-ctl">${ctl}<button class="donebtn" data-act="toggleSet" data-i="${i}" aria-pressed="${x.status === 'completed'}" aria-label="${x.status === 'completed' ? 'Mark set ' + (i + 1) + ' not done' : 'Complete set ' + (i + 1)}">${I.check}</button></div>
    <div class="set-extra">${sel('type', SET_TYPES, x.type, 'Set type')}${set().showRir ? sel('rir', [['', 'RIR –'], [0, 'RIR 0'], [1, 'RIR 1'], [2, 'RIR 2'], [3, 'RIR 3'], [4, 'RIR 4+']], x.rir, 'Reps in reserve') : ''}${set().showRpe ? sel('rpe', [['', 'RPE –']].concat([6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map(v => [v, 'RPE ' + v])), x.rpe, 'Rate of perceived exertion') : ''}
      <span class="grow"></span>${x.status === 'pending' ? `<button class="btn sm ghost" data-act="skipSet" data-i="${i}">Skip</button>` : x.status === 'skipped' ? `<button class="btn sm ghost" data-act="unskipSet" data-i="${i}">Undo skip</button>` : ''}<button class="btn sm ghost danger" data-act="delSet" data-i="${i}" aria-label="Delete set ${i + 1}">Delete</button></div></div>`;
}
function sessionFooter(s) {
  return `<section class="sec"><div class="grid2"><button class="btn" data-act="pickExercise" data-mode="add">${I.plus}Add exercise</button><button class="btn" data-act="pauseToggle">${s.pausedAt ? 'Resume' : 'Pause'} workout</button></div>
  <button class="btn primary big" data-act="finishSheet">Finish workout</button><button class="btn danger" data-act="discard">Discard workout</button>
  <p class="tiny muted" style="text-align:center">Every change is saved on this device instantly. You can close the app and resume later.</p></section>`;
}
</script>
<script>
/* ============ PLAN ============ */
VIEWS.plan = () => {
  const sow = set().weekStart, order = Array.from({ length: 7 }, (_, i) => (sow + i) % 7), days = S.kv.schedule.days;
  const opt = (d) => `<option value="tpl:" disabled>Workout templates</option>${S.templates.filter(t => t.active).map(t => `<option value="tpl:${t.id}" ${d.kind === 'workout' && d.templateId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="recovery" ${d.kind === 'recovery' ? 'selected' : ''}>Active recovery</option><option value="cardio" ${d.kind === 'cardio' ? 'selected' : ''}>Cardio / Badminton</option><option value="rest" ${d.kind === 'rest' ? 'selected' : ''}>Rest</option>`;
  const ov = S.kv.overrides || {}, tk = dkey(now());
  const ovs = Object.keys(ov).filter(k => k >= dkey(addDays(now(), -7))).sort();
  const nWork = Object.values(days).filter(d => d.kind === 'workout').length;
  return `<section class="card"><div class="sec-h"><h3>Weekly schedule</h3><span class="tiny muted">${nWork} workouts / week · repeats weekly</span></div>
    <div class="list">${order.map(wd => `<div class="li"><label for="sch-${wd}" style="width:96px;font-weight:600">${WDL[wd]}</label><select class="in grow" id="sch-${wd}" data-chg="schedDay" data-wd="${wd}">${opt(days[wd] || { kind: 'rest' })}</select></div>`).join('')}</div></section>
  <section class="card"><div class="sec-h"><h3>Changes to specific days</h3><button class="link" data-act="extraForm">${'+ Extra workout'}</button></div>
    ${ovs.length ? `<div class="list">${ovs.map(k => { const p = planFor(fromKey(k)); return `<div class="li"><div class="grow"><div style="font-weight:600">${esc(fmtDate(fromKey(k)))}${k === tk ? ' · today' : ''}</div><div class="tiny muted">${p.skipped ? 'Skipped' : esc(planLabel(p))}${p.note ? ' · ' + esc(p.note) : ''}</div></div><button class="btn sm" data-act="undoOverride" data-k="${k}">Undo</button></div>`; }).join('')}</div>` : '<p class="small muted">Skip, move or add a workout from the Home week strip. One-off changes show here and never alter the weekly pattern.</p>'}</section>
  <section class="sec"><div class="sec-h"><h2>Workout templates</h2><button class="link" data-act="go" data-v="template" data-id="new">+ New</button></div>
  ${S.templates.map(t => `<div class="card"><div class="row nw between" style="align-items:flex-start"><div class="grow"><h3>${esc(t.name)} ${t.active ? '' : '<span class="pill">Inactive</span>'}</h3><p class="tiny muted">${t.items.length} exercises · ${sum(t.items.map(i => i.sets))} sets · ~${t.duration} min · v${t.version}</p><p class="small" style="margin-top:6px">${esc(t.items.map(i => (exOf(i.exerciseId) || {}).name).filter(Boolean).join(' · '))}</p></div></div>
    <div class="btns"><button class="btn sm" data-act="go" data-v="template" data-id="${t.id}">Edit</button><button class="btn sm" data-act="dupTpl" data-id="${t.id}">Duplicate</button><button class="btn sm primary" data-act="startTpl" data-id="${t.id}">Start</button></div></div>`).join('')}</section>
  <button class="btn" data-act="go" data-v="exercises">Open exercise library ${I.chev}</button>`;
};

VIEWS.template = p => {
  if (p.ro) { const t = tplOf(p.id); if (!t) return '<div class="empty">Template not found.</div>';
    return `<section class="card"><h2>${esc(t.name)}</h2><p class="small muted">${esc(t.description)}</p><div class="list">${t.items.map((it, i) => { const e = exOf(it.exerciseId) || {}; return `<button class="li" data-act="go" data-v="exercise" data-id="${it.exerciseId}"><span class="setno">${i + 1}</span><div class="grow"><div style="font-weight:600">${esc(e.name)}</div><div class="tiny muted">${it.sets} × ${repTxt(it.repMin, it.repMax)} · rest ${fmtRest(it.rest)}${it.optional ? ' · optional' : ''}</div></div>${I.chev}</button>`; }).join('')}</div>
      <div class="btns"><button class="btn primary" data-act="startTpl" data-id="${t.id}">${I.play}Start</button><button class="btn" data-act="tplEdit" data-id="${t.id}">Edit template</button></div></section>`; }
  if (!p.draft) { const t = p.id === 'new' ? { id: uid(), name: '', description: '', muscles: [], duration: 60, version: 0, active: true, items: [], isNew: true } : JSON.parse(JSON.stringify(tplOf(p.id))); p.draft = t; }
  const d = p.draft;
  return `<section class="card"><label class="f">Name<input class="in" id="tp-name" data-chg="tpField" data-f="name" value="${esc(d.name)}" placeholder="e.g. Full Body C" maxlength="60"></label>
    <label class="f">Description<input class="in" id="tp-desc" data-chg="tpField" data-f="description" value="${esc(d.description)}"></label>
    <div class="grid2"><label class="f">Primary muscles<input class="in" id="tp-mus" data-chg="tpField" data-f="muscles" value="${esc(d.muscles.join(', '))}" placeholder="Chest, Lats"></label><label class="f">Est. minutes<input class="in" id="tp-dur" type="number" min="5" max="240" data-chg="tpField" data-f="duration" value="${d.duration}"></label></div>
    <label class="check"><input type="checkbox" id="tp-act" data-chg="tpField" data-f="active" ${d.active ? 'checked' : ''}>Active (shows in Start and the schedule)</label></section>
  <section class="sec"><div class="sec-h"><h2>Exercises</h2><span class="tiny muted">${d.items.length} · ${sum(d.items.map(i => +i.sets || 0))} sets</span></div>
  ${d.items.map((it, i) => { const e = exOf(it.exerciseId) || {}; return `<div class="card" style="gap:10px"><div class="row nw"><span class="setno">${i + 1}</span><b class="grow">${esc(e.name)}</b><button class="iconbtn" data-act="tpMove" data-i="${i}" data-d="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button><button class="iconbtn" data-act="tpMove" data-i="${i}" data-d="1" aria-label="Move down" ${i === d.items.length - 1 ? 'disabled' : ''}>↓</button><button class="iconbtn" data-act="tpDel" data-i="${i}" aria-label="Remove ${esc(e.name)}" style="color:var(--error)">✕</button></div>
    <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))"><label class="f">Sets<input class="in" id="ti-${it.id}-s" type="number" min="1" max="12" data-chg="tpItem" data-i="${i}" data-f="sets" value="${it.sets}"></label><label class="f">Reps min<input class="in" id="ti-${it.id}-a" type="number" min="1" max="100" data-chg="tpItem" data-i="${i}" data-f="repMin" value="${it.repMin}"></label><label class="f">Reps max<input class="in" id="ti-${it.id}-b" type="number" min="1" max="100" data-chg="tpItem" data-i="${i}" data-f="repMax" value="${it.repMax}"></label><label class="f">Rest s<input class="in" id="ti-${it.id}-r" type="number" min="0" max="900" step="15" data-chg="tpItem" data-i="${i}" data-f="rest" value="${it.rest}"></label></div>
    <label class="check small"><input type="checkbox" id="ti-${it.id}-o" data-chg="tpItem" data-i="${i}" data-f="optional" ${it.optional ? 'checked' : ''}>Optional</label></div>`; }).join('') || '<div class="empty">No exercises yet.</div>'}
  <button class="btn" data-act="pickExercise" data-mode="tpl">${I.plus}Add exercise</button></section>
  <p class="tiny muted">Saving creates version ${(d.version || 0) + 1}. Workouts you already logged keep their own copy and do not change.</p>
  <div class="btns"><button class="btn primary big" data-act="tpSave">Save template</button>${d.isNew ? '' : '<button class="btn danger" data-act="tpDelete">Delete template</button>'}</div>`;
};

/* ============ EXERCISE LIBRARY ============ */
function exFilter(p) {
  const q = (p.q || '').toLowerCase().trim();
  return S.exercises.filter(e => e.active !== false && (!q || e.name.toLowerCase().includes(q) || (e.aliases || []).some(a => a.toLowerCase().includes(q))) && (!p.muscle || e.primary === p.muscle || (e.secondary || []).includes(p.muscle)) && (!p.equip || e.equipment === p.equip) && (!p.fav || e.fav))
    .sort((a, b) => (b.fav - a.fav) || a.name.localeCompare(b.name));
}
function exList(list, act) { return list.length ? list.map(e => `<button class="li" data-act="${act}" data-id="${e.id}"><div class="glyph" style="width:40px;height:40px;border-radius:10px" aria-hidden="true">${glyph(e.equipment)}</div><div class="grow"><div style="font-weight:600">${esc(e.name)} ${e.custom ? '<span class="pill">Custom</span>' : ''}</div><div class="tiny muted">${esc(e.primary)} · ${esc(e.equipment)} · ${esc(e.movement)}</div></div>${e.fav ? `<span class="fav" aria-label="Favorite">${I.star}</span>` : ''}${I.chev}</button>`).join('') : '<div class="empty">No exercises match. Try another search or create a custom exercise.</div>'; }
VIEWS.exercises = p => `<section class="sec"><input class="in" id="ex-q" type="search" placeholder="Search ${S.exercises.length} exercises" data-inp="exSearch" value="${esc(p.q || '')}" aria-label="Search exercises">
  <div class="grid2"><select class="in" id="ex-m" data-chg="exFilt" data-f="muscle" aria-label="Muscle group"><option value="">All muscles</option>${MUSCLES.map(m => `<option ${p.muscle === m ? 'selected' : ''}>${m}</option>`).join('')}</select><select class="in" id="ex-e" data-chg="exFilt" data-f="equip" aria-label="Equipment"><option value="">All equipment</option>${EQUIP.map(m => `<option ${p.equip === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
  <div class="row between"><button class="chip" aria-pressed="${!!p.fav}" data-act="exFav">★ Favorites</button><button class="btn sm primary" data-act="exForm">${I.plus}Custom exercise</button></div></section>
  <section class="card"><div class="list" id="exlist">${exList(exFilter(p), 'go" data-v="exercise')}</div></section>`;

VIEWS.exercise = p => {
  const e = exOf(p.id); if (!e) return '<div class="empty">Exercise not found.</div>';
  const h = exHistory(e.id), b = prData().best[e.id], metric = p.metric || 'e1';
  const wr = e.tracking === 'weight_reps';
  const pts = h.map(({ s, sx }) => { const m = sxMetrics(sx); const y = metric === 'e1' ? m.e1 : metric === 'top' ? m.top : metric === 'vol' ? m.vol : m.reps; return { x: s.startedAt, y: metric === 'vol' ? (imp() ? y * LB : y) : metric === 'reps' ? y : +wNum(y) }; }).filter(x => x.y > 0);
  const last = h[h.length - 1];
  const repsAt = b && b.repsAt ? Object.entries(b.repsAt).sort((a, c) => c[0] - a[0]).slice(0, 6) : [];
  const metricLabel = { e1: 'Estimated 1RM', top: 'Heaviest set', vol: 'Volume', reps: 'Total reps' };
  return `<section class="card"><div class="row nw" style="align-items:flex-start"><div class="glyph" aria-hidden="true">${glyph(e.equipment)}</div><div class="grow"><h2>${esc(e.name)}</h2><p class="tiny muted">${esc(e.equipment)} · ${esc(e.movement)} · ${esc(e.difficulty)}</p></div><button class="iconbtn fav" data-act="toggleFav" data-id="${e.id}" aria-pressed="${!!e.fav}" aria-label="${e.fav ? 'Remove from favorites' : 'Add to favorites'}">${e.fav ? I.star : I.starO}</button></div>
    <p>${esc(e.description)}</p>
    <div class="chips"><span class="pill info">Primary: ${esc(e.primary)}</span>${(e.secondary || []).map(m => `<span class="pill">${esc(m)}</span>`).join('')}</div>
    <div class="grid3"><div class="stat"><span class="k">Rep range</span><span class="v" style="font-size:22px">${esc(e.repRange)}</span></div><div class="stat"><span class="k">Rest</span><span class="v" style="font-size:22px">${fmtRest(e.rest)}</span></div><div class="stat"><span class="k">Tracking</span><span class="v" style="font-size:18px">${esc({ weight_reps: 'Weight × reps', reps: 'Reps only', duration: 'Duration', assisted: 'Assisted' }[e.tracking])}</span></div></div>
    ${e.loadBasis === 'per_hand' ? '<p class="tiny muted">Logged weight is per dumbbell. Volume counts both hands (weight × 2 × reps).</p>' : ''}
    ${e.custom ? `<div class="btns"><button class="btn sm" data-act="exForm" data-id="${e.id}">Edit custom exercise</button></div>` : ''}</section>
  <section class="card"><h3>Performance</h3>
    ${h.length ? `<div class="grid2"><div class="stat"><span class="k">Last performed</span><span class="v" style="font-size:20px">${esc(fmtDate(last.s.startedAt))}</span><span class="tiny muted">${esc(last.sx.sets.filter(x => x.status === 'completed').map(x => setTxt(x, last.sx)).join(', '))}</span></div><div class="stat"><span class="k">Sessions</span><span class="v">${h.length}</span></div>
      ${wr ? `<div class="stat"><span class="k">Heaviest set</span><span class="v">${wNum(b.top)}<small>${wUnit()}</small></span></div><div class="stat"><span class="k">Est. 1RM (Epley, approx.)</span><span class="v">${wNum(round(b.e1, 10))}<small>${wUnit()}</small></span></div>` : `<div class="stat"><span class="k">${e.tracking === 'duration' ? 'Longest hold' : 'Most reps'}</span><span class="v">${e.tracking === 'duration' ? b.maxDur + '<small>s</small>' : b.maxReps}</span></div>`}</div>
    ${wr ? `<div class="chips" role="group" aria-label="Chart metric">${Object.entries(metricLabel).map(([k, l]) => `<button class="chip" aria-pressed="${metric === k}" data-act="exMetric" data-m="${k}">${l}</button>`).join('')}</div>
    ${lineChart('exc', pts, { fmt: v => trim(round(v, 10)) + (metric === 'reps' ? '' : ' ' + wUnit()), label: metricLabel[metric] + ' over time' })}
    ${metric === 'e1' ? '<p class="tiny muted">Estimated 1RM = weight × (1 + reps ÷ 30). An approximation, only computed for sets of 12 reps or fewer.</p>' : ''}` : ''}
    ${repsAt.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Weight</th><th>Most reps</th><th>Est. 1RM</th></tr></thead><tbody>${repsAt.map(([w, r]) => `<tr><td>${fmtW(+w)}</td><td>${r}</td><td>${e1rm(+w, r) ? fmtW(round(e1rm(+w, r), 10)) : '–'}</td></tr>`).join('')}</tbody></table></div>` : ''}` : '<div class="empty">No sessions logged with this exercise yet.</div>'}</section>
  <section class="card"><h3>How to do it</h3><ol class="steps">${(e.instructions || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>${(e.mistakes || []).length ? `<h3>Common mistakes</h3><ul class="steps">${e.mistakes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${e.videoUrl ? `<a class="btn sm" href="${esc(e.videoUrl)}" target="_blank" rel="noopener">Watch demonstration</a>` : ''}</section>
  ${h.length ? `<section class="card"><h3>History</h3><div class="list">${h.slice().reverse().slice(0, 12).map(({ s, sx }) => `<button class="li" data-act="go" data-v="session" data-id="${s.id}"><div class="grow"><div style="font-weight:600">${esc(fmtDate(s.startedAt))} · ${esc(s.name)}</div><div class="tiny muted num">${esc(sx.sets.filter(x => x.status === 'completed').map(x => setTxt(x, sx)).join(' · '))}${wr ? ' · ' + fmtVol(sxVolume(sx)) : ''}</div></div>${I.chev}</button>`).join('')}</div></section>` : ''}`;
};
function exFormSheet(id) {
  const e = id ? exOf(id) : { name: '', primary: 'Chest', secondary: [], equipment: 'machine', movement: 'compound', tracking: 'weight_reps', rest: set().defaultRest, repRange: '8–12', loadBasis: 'total', difficulty: 'beginner', description: '', instructions: [], aliases: [], videoUrl: '' };
  sheet(id ? 'Edit exercise' : 'Custom exercise', `<label class="f">Name<input class="in" id="xf-name" value="${esc(e.name)}" maxlength="60"></label>
  <label class="f">Also known as (comma separated)<input class="in" id="xf-alias" value="${esc((e.aliases || []).join(', '))}"></label>
  <div class="grid2"><label class="f">Primary muscle<select class="in" id="xf-prim">${MUSCLES.map(m => `<option ${e.primary === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label><label class="f">Equipment<select class="in" id="xf-eq">${EQUIP.map(m => `<option ${e.equipment === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>

VIEWS.compare = p => {
  const s = S.sessions.find(x => x.id === p.id); if (!s) return '<div class="empty">Workout not found.</div>';

<script>
/* ============ PROGRESS ============ */
const RANGES = [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['180', '6 months'], ['365', '12 months'], ['custom', 'Custom']];
function rangeOf(p) {
  if (p.range === 'custom' && p.from && p.to) return [fromKey(p.from), new Date(+addDays(fromKey(p.to), 1) - 1)];
  const n = +(p.range && p.range !== 'custom' ? p.range : 30); return [sod(addDays(now(), -(n - 1))), new Date()];
}
function rangeChips(p) { return `<div class="scrollx" role="group" aria-label="Date range">${RANGES.map(([k, l]) => `<button class="chip" aria-pressed="${(p.range || '30') === k}" data-act="range" data-r="${k}">${l}</button>`).join('')}</div>
  ${p.range === 'custom' ? `<div class="grid2"><label class="f">From<input class="in" type="date" id="pr-from" data-chg="rangeDate" data-f="from" value="${p.from || ''}"></label><label class="f">To<input class="in" type="date" id="pr-to" data-chg="rangeDate" data-f="to" value="${p.to || ''}"></label></div>` : ''}`; }
function buckets(a, b) {
  const days = (b - a) / DAY, out = [];
  if (days <= 120) { for (let s = weekStart(a); s <= b; s = addDays(s, 7)) out.push({ a: s, b: new Date(+addDays(s, 7) - 1), l: fmtDate(s, { day: 'numeric', month: 'short' }) }); }
  else { for (let s = new Date(a.getFullYear(), a.getMonth(), 1); s <= b; s = new Date(s.getFullYear(), s.getMonth() + 1, 1)) out.push({ a: s, b: new Date(+new Date(s.getFullYear(), s.getMonth() + 1, 1) - 1), l: fmtDate(s, { month: 'short' }) }); }
  return out;
}
function muscleAttr(exId) { const e = exOf(exId); if (!e) return {}; const m = { [e.primary]: 1 }; if (set().muscleSecondary) (e.secondary || []).forEach(x => { if (!m[x]) m[x] = 0.5; }); return m; }
function weightSeries(a, b, type = 'weight') {
  const all = S.measurements.filter(x => x.type === type).sort((x, y) => x.measuredAt - y.measuredAt);
  const pts = all.filter(x => inRange(x.measuredAt, a, b)).map(x => ({ x: x.measuredAt, y: +mDisp(type, x.value), t: fmtDate(x.measuredAt) + ': ' + mDisp(type, x.value) + ' ' + mUnit(type) }));
  const avg = pts.map(p => { const w = all.filter(x => x.measuredAt <= p.x && x.measuredAt > p.x - 7 * DAY); return { x: p.x, y: w.length >= 2 ? +mDisp(type, sum(w.map(x => x.value)) / w.length) : p.y }; });
  return { all, pts, avg };
}
VIEWS.progress = p => {
  const [a, b] = rangeOf(p), ss = doneSessions().filter(s => inRange(s.startedAt, a, b));
  const acts = S.activities.filter(x => inRange(x.startedAt, a, b)), adh = adherence(a, b);
  const prs = prData().events.filter(e => inRange(e.at, a, b));
  const vol = sum(ss.map(s => sessionVolume(s))), avgDur = ss.length ? sum(ss.map(elapsed)) / ss.length : 0;
  const tracked = [...new Set(doneSessions().flatMap(s => s.exercises.filter(x => x.tracking === 'weight_reps' && x.sets.some(st => st.status === 'completed')).map(x => x.exerciseId)))].map(exOf).filter(Boolean).sort((x, y) => x.name.localeCompare(y.name));
  const exId = p.ex && exOf(p.ex) ? p.ex : (tracked[0] || {}).id, metric = p.metric || 'e1';
  const sPts = exId ? exHistory(exId).filter(x => inRange(x.s.startedAt, a, b)).map(({ s, sx }) => { const m = sxMetrics(sx); const y = metric === 'e1' ? m.e1 : metric === 'top' ? m.top : m.vol; return { x: s.startedAt, y: metric === 'vol' ? Math.round(imp() ? y * LB : y) : +wNum(round(y, 10)) }; }).filter(x => x.y > 0) : [];
  const bk = buckets(a, b);
  const volBars = bk.map(k => { const v = sum(ss.filter(s => inRange(s.startedAt, k.a, k.b)).map(s => sessionVolume(s))); return { l: k.l, v: Math.round(imp() ? v * LB : v), t: (bk.length > 20 ? '' : 'Week of ') + k.l + ': ' + fmtVol(v) }; });
  const conBars = bk.map(k => { const n = ss.filter(s => inRange(s.startedAt, k.a, k.b)).length, ad = adherence(k.a, k.b); return { l: k.l, v: n, t: `${k.l}: ${n} workout${n === 1 ? '' : 's'}${ad.pct != null ? ' · ' + ad.pct + '% adherence' : ''}` }; });
  const mv = {}, ms = {};
  ss.forEach(s => s.exercises.forEach(sx => { const at = muscleAttr(sx.exerciseId), v = sxVolume(sx), hs = sx.sets.filter(st => st.status === 'completed' && ['working', 'failure', 'backoff'].includes(st.type)).length; Object.entries(at).forEach(([m, f]) => { mv[m] = (mv[m] || 0) + v * f; ms[m] = (ms[m] || 0) + hs * f; }); }));
  const byType = {}; ss.forEach(s => { (byType[s.name] = byType[s.name] || []).push(elapsed(s)); });
  const bw = weightSeries(a, b);
  const pf = prof();
  const missed = (() => { let n = 0; for (let d = sod(a); d <= b && dkey(d) < dkey(now()); d = addDays(d, 1)) if (planFor(d).kind === 'workout' && ['missed', 'skipped'].includes(dayStatus(d))) n++; return n; })();
  const months = (b - a) / DAY / 30.4;
  return `${sampleBanner()}${rangeChips(p)}
  <div class="grid3"><div class="stat"><span class="k">Workouts</span><span class="v">${ss.length}</span></div><div class="stat"><span class="k">Adherence</span><span class="v">${adh.pct == null ? '–' : adh.pct + '<small>%</small>'}</span><span class="tiny muted">${adh.done}/${adh.eligible} scheduled</span></div><div class="stat"><span class="k">Volume</span><span class="v">${compact(imp() ? vol * LB : vol)}<small>${wUnit()}</small></span></div>
  <div class="stat"><span class="k">Avg session</span><span class="v">${Math.round(avgDur / 60e3)}<small>min</small></span></div><div class="stat"><span class="k">Activity</span><span class="v">${Math.round(sum(acts.map(x => x.duration)) / 60)}<small>min</small></span></div><div class="stat"><span class="k">New records</span><span class="v">${prs.length}</span></div></div>
  <section class="card"><div class="sec-h"><h3>Strength</h3><button class="link" data-act="go" data-v="records">Records</button></div>
    ${tracked.length ? `<select class="in" id="pg-ex" data-chg="progEx" aria-label="Exercise">${tracked.map(e => `<option value="${e.id}" ${e.id === exId ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
    <div class="chips" role="group" aria-label="Metric">${[['e1', 'Est. 1RM'], ['top', 'Heaviest set'], ['vol', 'Volume']].map(([k, l]) => `<button class="chip" aria-pressed="${metric === k}" data-act="progMetric" data-m="${k}">${l}</button>`).join('')}</div>
    ${lineChart('str', sPts, { fmt: v => trim(round(v, 10)) + ' ' + wUnit(), label: 'Strength trend', empty: 'Fewer than two sessions with this exercise in the selected range.' })}
    ${metric === 'e1' ? '<p class="tiny muted">Estimated 1RM uses the Epley formula. It is an approximation and skips sets above 12 reps.</p>' : ''}` : '<div class="empty">Finish a workout to start tracking strength.</div>'}</section>
  <section class="card"><div class="sec-h"><h3>Training volume</h3><span class="tiny muted">${set().volumeAllTypes ? 'all set types' : 'working sets'} · ${bk.length > 20 ? 'monthly' : 'weekly'}</span></div>${barChart('vol', volBars, { fmt: v => v.toLocaleString() + ' ' + wUnit(), axisFmt: v => v >= 1000 ? round(v / 1000, 10) + 'k' : v, label: 'Training volume per period' })}</section>
  <section class="card"><div class="sec-h"><h3>Consistency</h3><span class="tiny muted">workouts per ${bk.length > 20 ? 'month' : 'week'}</span></div>${barChart('con', conBars, { fmt: v => v, label: 'Workouts per period' })}

    ${lineChart('bw', bw.pts, { dotsOnly: true, extra: bw.avg, refs: pf.weightMin && pf.weightMax ? [+wNum(pf.weightMin), +wNum(pf.weightMax)] : [], fmt: v => trim(round(v, 10)), label: 'Body weight trend', empty: 'Log body weight at least twice in this range to see the trend.' })}</section>
  <div class="grid2"><button class="btn" data-act="go" data-v="activities">Activities ${I.chev}</button><button class="btn" data-act="go" data-v="goals">Goals ${I.chev}</button><button class="btn" data-act="go" data-v="history">History ${I.chev}</button><button class="btn" data-act="go" data-v="records">Records ${I.chev}</button></div>`;
};

/* ============ MEASUREMENTS ============ */
function trendPerWeek(rows) { if (rows.length < 3) return null; const xs = rows.map(r => r.measuredAt / (7 * DAY)), ys = rows.map(r => r.value), mx = sum(xs) / xs.length, my = sum(ys) / ys.length; const d = sum(xs.map(x => (x - mx) ** 2)); return d ? sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / d : null; }
VIEWS.measurements = p => {
  const type = p.type || 'weight', [a, b] = rangeOf(p), ser = weightSeries(a, b, type), u = mUnit(type);
  const all = ser.all, last = all[all.length - 1], inR = all.filter(x => inRange(x.measuredAt, a, b));
  const last7 = all.filter(x => x.measuredAt > now() - 7 * DAY), last30 = all.filter(x => x.measuredAt > now() - 30 * DAY), tr = trendPerWeek(last30);
  const pf = prof(), fmtV = v => mDisp(type, v) + ' ' + u;
  return `<div class="scrollx" role="group" aria-label="Measurement">${Object.entries(MTYPES).map(([k, v]) => `<button class="chip" aria-pressed="${type === k}" data-act="mType" data-t="${k}">${v[0]}</button>`).join('')}</div>

  <div class="grid2"><div class="stat"><span class="k">Latest</span><span class="v">${last ? mDisp(type, last.value) + '<small>' + u + '</small>' : '–'}</span><span class="tiny muted">${last ? esc(fmtDate(last.measuredAt)) : 'No entries'}</span></div>
  <div class="stat"><span class="k">Change in range</span><span class="v">${inR.length > 1 ? (inR[inR.length - 1].value - inR[0].value >= 0 ? '+' : '−') + mDisp(type, Math.abs(inR[inR.length - 1].value - inR[0].value)) + '<small>' + u + '</small>' : '–'}</span></div>
  <div class="stat"><span class="k">7-day average</span><span class="v">${last7.length >= 3 ? mDisp(type, sum(last7.map(x => x.value)) / last7.length) + '<small>' + u + '</small>' : '–'}</span>${last7.length < 3 ? '<span class="tiny muted">Needs 3 entries this week</span>' : ''}</div>
  <div class="stat"><span class="k">30-day trend</span><span class="v">${tr == null ? '–' : (tr >= 0 ? '+' : '−') + mDisp(type, Math.abs(tr)) + '<small>' + u + '/wk</small>'}</span></div></div>
  ${type === 'weight' && pf.weightMin && pf.weightMax ? `<p class="small">Target range <b>${fmtW(pf.weightMin)} – ${fmtW(pf.weightMax)}</b>${last ? (last.value < pf.weightMin ? ' · below range' : last.value > pf.weightMax ? ` · ${fmtW(round(last.value - pf.weightMax, 10))} above range` : ' · in range') : ''}</p>` : ''}
  <section class="card">${rangeChips(p)}${lineChart('mc', ser.pts, { dotsOnly: type === 'weight' && ser.pts.length > 8, extra: type === 'weight' && ser.pts.length > 8 ? ser.avg : null, fmt: v => trim(round(v, 10)), label: MTYPES[type][0] + ' trend' })}
  ${type === 'weight' && ser.pts.length > 8 ? '<div class="legend"><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--primary)" opacity=".45"/></svg>Weigh-ins</span><span><svg width="22" height="6"><path d="M1 3h20" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4"/></svg>7-day average</span></div>' : ''}</section>
  <section class="card"><h3>Entries</h3><div class="list">${all.slice().reverse().slice(0, 30).map(x => `<div class="li"><div class="grow"><b class="num">${fmtV(x.value)}</b><div class="tiny muted">${esc(fmtDate(x.measuredAt))} · ${fmtTime(x.measuredAt)}${x.note ? ' · ' + esc(x.note) : ''}</div></div><button class="btn sm ghost danger" data-act="delMeasure" data-id="${x.id}" aria-label="Delete entry">Delete</button></div>`).join('') || '<div class="empty">No entries yet.</div>'}</div></section>`;
};
function measureSheet(type = 'weight') {
  const d = new Date(); const lv = S.measurements.filter(x => x.type === type).sort((x, y) => x.measuredAt - y.measuredAt).pop();
  sheet('Log measurement', `<div class="grid2"><label class="f">Measurement<select class="in" id="m-type" data-chg="mFormType">${Object.entries(MTYPES).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label>
  <label class="f">Value (<span id="m-unit">${mUnit(type)}</span>)<input class="in" id="m-val" inputmode="decimal" value="${lv ? mDisp(type, lv.value) : ''}"></label>
  <label class="f">Date<input class="in" type="date" id="m-date" value="${dkey(d)}"></label><label class="f">Time<input class="in" type="time" id="m-time" value="${pad(d.getHours())}:${pad(d.getMinutes())}"></label></div>

/* ============ ACTIVITIES ============ */

  const wk = Array.from({ length: 8 }, (_, i) => { const s = addDays(weekStart(now()), (i - 7) * 7), e = new Date(+addDays(s, 7) - 1); const m = Math.round(sum(S.activities.filter(x => inRange(x.startedAt, s, e)).map(x => x.duration)) / 60); return { l: fmtDate(s, { day: 'numeric', month: 'short' }), v: m, t: 'Week of ' + fmtDate(s, { day: 'numeric', month: 'short' }) + ': ' + m + ' min' }; });
  const mo = Array.from({ length: 6 }, (_, i) => { const t = new Date(); const s = new Date(t.getFullYear(), t.getMonth() - 5 + i, 1), e = new Date(+new Date(s.getFullYear(), s.getMonth() + 1, 1) - 1); const n = S.activities.filter(x => x.type === 'badminton' && inRange(x.startedAt, s, e)).length; return { l: fmtDate(s, { month: 'short' }), v: n, t: fmtDate(s, { month: 'long' }) + ': ' + n + ' badminton session' + (n === 1 ? '' : 's') }; });

  <section class="card"><h3>Badminton sessions per month</h3>${barChart('abd', mo, { fmt: v => v, label: 'Badminton sessions per month' })}</section>
  <section class="card"><h3>Distance by activity</h3>${hbars(Object.entries(dist).map(([k, v]) => ({ l: ACTS[k][0], v })), fmtDist)}</section>
  <section class="card"><h3>Log</h3><div class="list">${list.map(x => `<button class="li" data-act="activityForm" data-id="${x.id}"><div class="grow"><div style="font-weight:600">${esc(ACTS[x.type] ? ACTS[x.type][0] : x.type)}${x.format ? ' · ' + esc(x.format) : ''}</div><div class="tiny muted">${esc(fmtDate(x.startedAt))} · ${Math.round(x.duration / 60)} min${x.distance ? ' · ' + fmtDist(x.distance) : ''} · ${esc(x.intensity)}${x.matches ? ' · ' + x.matches + ' matches' : ''}${x.hr ? ' · ' + x.hr + ' bpm' : ''}</div></div>${I.chev}</button>`).join('') || '<div class="empty">No activities in this range.</div>'}</div></section>`;
};

/* ============ GOALS ============ */
const GOAL_TYPES = { weekly_workouts: 'Workouts per week', monthly_workouts: 'Workouts per month', strength: 'Exercise strength', body_weight: 'Body weight', measurement: 'Body measurement', activity_minutes: 'Weekly activity minutes', consistency: 'Workout adherence %' };
function latestM(type) { const m = S.measurements.filter(x => x.type === type).sort((a, b) => a.measuredAt - b.measuredAt); return m[m.length - 1]; }
function goalProgress(g) {
  const [w0, w1] = weekRange(0), t = new Date();
  const dir = (cur, base, target) => { if (cur == null) return { pct: null }; if (base == null || base === target) return { pct: cur >= target ? 1 : 0 }; return { pct: clamp((cur - base) / (target - base), 0, 1) }; };
  if (g.type === 'weekly_workouts') { const c = weekStats(w0, w1).workouts; return { cur: c, curTxt: c + ' this week', tgt: g.target + ' / week', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' to go' }; }
  if (g.type === 'monthly_workouts') { const c = doneSessions().filter(s => inRange(s.startedAt, new Date(t.getFullYear(), t.getMonth(), 1), t)).length; return { curTxt: c + ' this month', tgt: g.target + ' / month', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' to go' }; }
  if (g.type === 'activity_minutes') { const c = Math.round(weekStats(w0, w1).cardio); return { curTxt: c + ' min this week', tgt: g.target + ' min', pct: clamp(c / g.target, 0, 1), rem: Math.max(0, g.target - c) + ' min to go' }; }
  if (g.type === 'consistency') { const ad = adherence(addDays(now(), -27), new Date()); return { curTxt: (ad.pct ?? '–') + '% (4 weeks)', tgt: g.target + '%', pct: ad.pct == null ? null : clamp(ad.pct / g.target, 0, 1), rem: '' }; }
  if (g.type === 'strength') { const b = prData().best[g.exerciseId]; const c = b ? (g.metric === 'e1' ? b.e1 : b.top) : null; const r = dir(c, g.baseline, g.target); return { curTxt: c ? fmtW(round(c, 10)) : 'Not logged', tgt: fmtW(g.target) + (g.metric === 'e1' ? ' est. 1RM' : ''), pct: r.pct, rem: c != null && c < g.target ? fmtW(round(g.target - c, 10)) + ' to go' : c != null ? 'Reached' : '' }; }
  const mt = g.type === 'body_weight' ? 'weight' : g.mtype, lm = latestM(mt), c = lm ? lm.value : null, fv = v => mDisp(mt, v) + ' ' + mUnit(mt);
  const rows = S.measurements.filter(x => x.type === mt && x.measuredAt > now() - 30 * DAY), tr = trendPerWeek(rows);
  if (g.mode === 'range') {
    const inr = c != null && c >= g.min && c <= g.max, tgtV = c != null && c > g.max ? g.max : g.min;
    const r = inr ? { pct: 1 } : dir(c, g.baseline, tgtV);
    let eta = ''; if (!inr && c != null && tr && Math.sign(tgtV - c) === Math.sign(tr)) eta = 'At the current trend: around ' + fmtDate(now() + (tgtV - c) / tr * 7 * DAY, { day: 'numeric', month: 'short', year: 'numeric' });
    return { curTxt: c == null ? 'Not logged' : fv(c), tgt: fv(g.min) + ' – ' + fv(g.max), pct: r.pct, rem: c == null ? '' : inr ? 'In range. Maintain it.' : fv(Math.abs(tgtV - c)) + (c > g.max ? ' above range' : ' below range'), eta, range: true, inr };
  }
  const r = dir(c, g.baseline, g.target), left = c == null ? null : g.target - c;
  let eta = ''; if (c != null && tr && left && Math.sign(left) === Math.sign(tr)) eta = 'At the current trend: around ' + fmtDate(now() + left / tr * 7 * DAY, { day: 'numeric', month: 'short', year: 'numeric' });
  return { curTxt: c == null ? 'Not logged' : fv(c), tgt: fv(g.target), pct: r.pct, rem: left == null ? '' : Math.abs(left) < 0.05 ? 'Reached' : fv(Math.abs(left)) + ' to go', eta };
}
VIEWS.goals = () => `<button class="btn primary" data-act="goalForm">${I.plus}New goal</button>
  ${S.goals.map(g => { const p = goalProgress(g); return `<section class="card"><div class="row nw between" style="align-items:flex-start"><div class="grow"><div class="eyebrow">${esc(GOAL_TYPES[g.type])}</div><h3>${esc(g.title)}</h3></div><button class="btn sm ghost danger" data-act="delGoal" data-id="${g.id}" aria-label="Delete goal">Delete</button></div>
    <div class="row between small"><span>Now <b class="num">${esc(p.curTxt)}</b></span><span>Target <b class="num">${esc(p.tgt)}</b></span></div>
    ${p.pct != null ? `<div class="bar ${p.pct >= 1 ? 'ok' : ''}" role="progressbar" aria-valuenow="${Math.round(p.pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(g.title)} progress"><i style="width:${p.pct * 100}%"></i></div>` : ''}
    <div class="row between tiny"><span class="${p.inr || p.pct >= 1 ? 'up' : 'muted'}" style="font-weight:600">${p.pct != null ? Math.round(p.pct * 100) + '% · ' : ''}${esc(p.rem || '')}</span>${g.targetDate ? `<span class="muted">by ${esc(fmtDate(fromKey(g.targetDate), { day: 'numeric', month: 'short', year: 'numeric' }))}</span>` : ''}</div>
    ${p.eta ? `<p class="tiny muted">${esc(p.eta)}</p>` : ''}</section>`; }).join('') || '<div class="empty">No goals yet. Set a weekly workout target or a body weight range to start.</div>'}`;
function goalSheet(type = 'weekly_workouts') {
  const f = { weekly_workouts: `<label class="f">Workouts per week<input class="in" id="g-target" inputmode="numeric" value="4"></label>`, monthly_workouts: `<label class="f">Workouts per month<input class="in" id="g-target" inputmode="numeric" value="16"></label>`, activity_minutes: `<label class="f">Minutes per week<input class="in" id="g-target" inputmode="numeric" value="150"></label>`, consistency: `<label class="f">Adherence target (%)<input class="in" id="g-target" inputmode="numeric" value="90"></label>`,
    strength: `<label class="f">Exercise<select class="in" id="g-ex">${S.exercises.filter(e => e.tracking === 'weight_reps').sort((a, b) => a.name.localeCompare(b.name)).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><div class="grid2"><label class="f">Measure<select class="in" id="g-metric"><option value="max_weight">Heaviest set</option><option value="e1">Estimated 1RM</option></select></label><label class="f">Target (${wUnit()})<input class="in" id="g-target" inputmode="decimal"></label></div>`,
    body_weight: `<label class="f">Goal style<select class="in" id="g-mode"><option value="range">Stay within a range (maintenance)</option><option value="target">Reach a target</option></select></label><div class="grid2"><label class="f">Target or range min (${wUnit()})<input class="in" id="g-min" inputmode="decimal"></label><label class="f">Range max (${wUnit()})<input class="in" id="g-max" inputmode="decimal" placeholder="for ranges"></label></div>`,
    measurement: `<label class="f">Measurement<select class="in" id="g-mt">${Object.entries(MTYPES).filter(([k]) => k !== 'weight').map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></label><label class="f">Target (${lUnit()} or %)<input class="in" id="g-target" inputmode="decimal"></label>` }[type];
  sheet('New goal', `<label class="f">Goal type<select class="in" id="g-type" data-chg="gFormType">${Object.entries(GOAL_TYPES).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
  <label class="f">Name<input class="in" id="g-title" placeholder="e.g. ${esc(GOAL_TYPES[type])}"></label>${f}
  <label class="f">Target date (optional)<input class="in" type="date" id="g-date"></label><p class="tiny muted">Progress counts in the right direction automatically: losing toward a lower target and gaining toward a higher one both show as progress.</p><p class="tiny" id="g-err" style="color:var(--error)"></p>
  <button class="btn primary big" data-act="saveGoal">Save goal</button>`);
}

/* ============ RECORDS ============ */

  const rows = Object.entries(best).map(([id, b]) => ({ e: exOf(id), b })).filter(r => r.e).sort((x, y) => x.e.name.localeCompare(y.e.name));
  return `<div class="grid2"><div class="stat"><span class="k">Current streak</span><span class="v">${streak()}</span><span class="tiny muted">scheduled workouts</span></div><div class="stat"><span class="k">Longest streak</span><span class="v">${longestStreak()}</span></div></div>
  <section class="card"><h3>Best lifts</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Exercise</th><th>Heaviest</th><th>Est. 1RM*</th><th>Best volume</th></tr></thead><tbody>${rows.map(({ e, b }) => `<tr><td><button class="link" style="padding:0;min-height:0;text-align:left;font-weight:600" data-act="go" data-v="exercise" data-id="${e.id}">${esc(e.name)}</button></td>${e.tracking === 'weight_reps' ? `<td>${fmtW(b.top)}</td><td>${b.e1 ? fmtW(round(b.e1, 10)) : '–'}</td><td>${fmtVol(b.vol)}</td>` : `<td colspan="3">${e.tracking === 'duration' ? b.maxDur + ' s hold' : b.maxReps + ' reps'}</td>`}</tr>`).join('') || '<tr><td colspan="4">No records yet.</td></tr>'}</tbody></table></div><p class="tiny muted">*Estimated with the Epley formula; an approximation.</p></section>
  <section class="card"><h3>Record timeline</h3>${events.slice().reverse().slice(0, 25).map(e => `<div class="prline"><span class="medal">PR</span><div class="grow small"><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.kind)} · ${esc(fmtDate(e.at))}</div></div><b class="num small">${esc(e.val)}</b></div>`).join('') || '<div class="empty">Records appear when you beat a previous best.</div>'}</section>`;
};

/* ============ PROFILE ============ */
