<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap">
<style>
/* Layout: single mobile column (max 560px) — sticky top bar, scrolling cards, fixed bottom tab bar; workout controls sit within thumb reach. */
/* Color: white ground, cool neutral ink, one pastel theme hue (--a-* set by the theme picker; periwinkle defaults below).
   Type: Poppins 400 for reading, 500 for emphasis and numbers - no other weights. */
:root{
  --a-soft:#F2F3FE; --a-tint:#D3D8FB; --a-accent:#6A78EE; --a-text:#4B5AE0; --a-ink:#262F86;
  --ad-soft:#262838; --ad-tint:#363C66; --ad-accent:#8F9BF5; --ad-text:#AEB7F8; --ad-ink:#E6E9FD;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:var(--a-soft); --line:#ECEEF3;
  --ink:#1F2330; --ink-2:#4A5063; --muted:#737A8E;
  --primary:var(--a-accent); --primary-text:var(--a-text); --primary-ink:var(--a-ink); --primary-soft:var(--a-soft); --primary-tint:var(--a-tint); --on-primary:var(--a-ink);
  --success:#15803D; --success-soft:#E6F6EA; --warn:#A16207; --warn-soft:#FDF5E1; --error:#D92D20; --error-soft:#FDECEB;
  --shadow:0 1px 2px rgba(31,35,48,.04),0 6px 20px rgba(31,35,48,.05);
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121419; --surface:#1A1D24; --surface-2:var(--ad-soft); --line:#2A2E38;
  --ink:#F3F4F7; --ink-2:#C9CCD6; --muted:#9298A8;
  --primary:var(--ad-accent); --primary-text:var(--ad-text); --primary-ink:var(--ad-ink); --primary-soft:var(--ad-soft); --primary-tint:var(--ad-tint); --on-primary:var(--ad-ink);
  --success:#4ADE80; --success-soft:#16301F; --warn:#FBBF24; --warn-soft:#352B12; --error:#F87171; --error-soft:#3A1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1A1D24; --surface-2:var(--ad-soft); --line:#2A2E38;
  --ink:#F3F4F7; --ink-2:#C9CCD6; --muted:#9298A8;
  --primary:var(--ad-accent); --primary-text:var(--ad-text); --primary-ink:var(--ad-ink); --primary-soft:var(--ad-soft); --primary-tint:var(--ad-tint); --on-primary:var(--ad-ink);
  --success:#4ADE80; --success-soft:#16301F; --warn:#FBBF24; --warn-soft:#352B12; --error:#F87171; --error-soft:#3A1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
b,strong,h1,h2,h3,h4,th,summary,legend,optgroup{font-weight:500}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{flex:1;min-width:0;margin:0;font:500 19px/1.2 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);min-height:32px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--success)}
.top .iconbtn.pal-btn{width:40px;height:40px}
.pal-btn .pdot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--primary-tint) 0 50%,var(--primary) 0);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.sync.off i{background:var(--warn)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px;display:flex;flex-direction:column;gap:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}

.nav button svg{width:56px;height:30px;padding:3px 16px;border-radius:999px;transition:background .15s}
.nav button[aria-current="page"]{color:var(--primary-ink)}
.nav button[aria-current="page"] svg{background:var(--primary-tint)}
.minibar{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.minibar button{max-width:536px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:var(--r);background:var(--primary-tint);color:var(--primary-ink);padding:10px 14px;min-height:48px;box-shadow:var(--shadow);text-align:left}
.minibar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* type */
h2{margin:0;font:500 18px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{margin:0;font:500 17px/1.2 var(--f-body)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--primary-text);font-weight:500;padding:8px 4px;min-height:44px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(180deg,var(--primary-soft),var(--surface) 75%);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding-inline:0}
button.li:first-child{border-top:0}
.chev{color:var(--muted);flex:none}

/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:500 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font:400 12px var(--f-body);color:var(--muted);margin-left:2px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.delta{font-size:12.5px;font-weight:500}
.up{color:var(--success)} .down{color:var(--error)} .flatd{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary-tint);border-color:transparent;color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(.97)}
.btn{transition:background .15s,filter .15s,transform .1s}.btn:active{transform:scale(.98)}
.btn.big{min-height:54px;font-size:17px;border-radius:14px;width:100%}
.btn.danger{color:var(--error);border-color:var(--line)}
.btn.danger.solid{background:var(--error);border-color:var(--error);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--error-soft);color:var(--error)}
.pill.info{background:var(--primary-tint);color:var(--primary-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{transition:background .15s;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--primary-tint);border-color:transparent;color:var(--primary-ink)}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scrollx>*{flex:none}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}
.in,select.in,textarea.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;font-size:16px;color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--line);padding:6px 0}
.switch:first-child{border-top:0}
.switch input[type=checkbox]{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input[type=checkbox]:checked{background:var(--primary)}
.switch input[type=checkbox]:checked::after{transform:translateX(18px)}
.switch select.in{width:auto;min-width:120px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;min-width:0}
.day .dn{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dd{font:500 16px/1.1 var(--f-display)}
.day .dl{font-size:9.5px;line-height:1.15;text-align:center;color:var(--ink-2);font-weight:500;min-height:24px;overflow-wrap:anywhere;padding-inline:2px}
.day.today{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500}
.st svg{width:12px;height:12px}
.st.completed{background:var(--success);color:#fff}
.st.progress{background:var(--primary-tint);color:var(--primary-ink)}
.st.scheduled{border:2px solid var(--primary)}
.st.missed{border:2px dashed var(--error);color:var(--error)}
.st.skipped{background:var(--surface-2);color:var(--muted)}
.st.rest{background:var(--surface-2);color:var(--muted)}

/* workout */
.wk-head{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;margin-inline:-16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.clock{font:500 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.ok>i{background:var(--success)}
.expill{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;min-width:44px;padding:4px 10px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:5px}
.expill[aria-current="true"]{background:var(--primary-tint);color:var(--primary-ink);border-color:transparent}
.expill.done{color:var(--success)}
.expill.skip{color:var(--muted);text-decoration:line-through}
.exname{font:500 21px/1.25 var(--f-display);text-wrap:balance}
.setcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.setcard.completed{background:var(--success-soft);border-color:transparent}
.setcard.skipped{opacity:.6}
.setcard.next{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.set-top{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.setno{font:500 15px/1 var(--f-display);min-width:22px}
.set-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px;gap:8px;align-items:end}
.stepper{display:flex;flex-direction:column;gap:3px;min-width:0}
.stepper .lbl{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.stepper .ctl{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;height:46px}
.stepper button{border:0;background:var(--surface-2);font-size:20px;font-weight:500;color:var(--ink-2)}
.stepper input{border:0;background:transparent;text-align:center;font:500 17px var(--f-display);font-variant-numeric:tabular-nums;min-width:0;width:100%;padding:0}
.donebtn{height:46px;border-radius:12px;border:2px solid var(--success);background:var(--surface);color:var(--success);display:grid;place-items:center}
.donebtn svg{width:24px;height:24px}
.completed .donebtn{background:var(--success);color:#fff}
.set-extra{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.set-extra select{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 6px;font-size:13px}
.set-extra .btn{min-height:34px;padding:4px 10px;font-size:13px}
.rec{border-radius:14px;padding:14px;background:var(--primary-soft);color:var(--ink);display:flex;flex-direction:column;gap:8px;font-size:14px}
.restbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.restbar>div{max-width:536px;margin:0 auto;background:var(--primary-tint);color:var(--primary-ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 28px rgba(31,35,48,.14)}
.restbar .t{font:500 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.restbar .lab{font-size:12px;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .bar{background:rgba(255,255,255,.55)}.restbar .bar>i{background:var(--primary-ink)}
.restbar button{min-height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.5);color:inherit;font-weight:500;padding:0 10px}
.restbar .done{color:var(--success)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.chart .ar{fill:var(--primary);opacity:.1}
.chart .dot{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.chart .dot.soft{fill:var(--primary);opacity:.45;stroke:none}
.chart .barr{fill:var(--primary)}
.chart .barr.dim{fill:var(--primary);opacity:.35}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .vl{fill:var(--ink-2);font-size:11px;font-weight:500;font-family:var(--f-body)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(84px,30%) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13.5px;min-height:28px}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--primary);border-radius:99px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}
.banner{border-radius:14px;padding:12px 14px;background:var(--primary-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.glyph{width:52px;height:52px;border-radius:16px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;flex:none}
.glyph svg{width:28px;height:28px}
.big{font:500 36px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.fav{color:var(--warn)}
ol.steps,ul.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card>summary{cursor:pointer;font-weight:500;min-height:28px;list-style-position:inside}
.paused{background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:500}

.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.sw:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.sw[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);color:var(--ink)}
.sw .dot{width:46px;height:46px;border-radius:50%;position:relative;display:grid;place-items:center}
.sw .dot i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.65)}

.sw .ck{position:absolute;right:-3px;top:-3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);display:none;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.sw[aria-checked="true"] .ck{display:grid}
.sw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sw:focus-within{outline:2px solid var(--primary);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center;transition:background .15s}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(31,35,48,.12)}
.preview{border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pvbar{flex:1;background:var(--primary);border-radius:4px 4px 0 0;display:block}
body.authmode .top,body.authmode .nav,body.authmode #minibar,body.authmode #restbar{display:none}
body.authmode main{padding-block:24px 48px}
.auth{display:flex;flex-direction:column;gap:22px;width:100%;max-width:420px;margin:0 auto;padding-top:8px}
.authform{gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mk{width:48px;height:48px;border-radius:15px;background:var(--primary-tint);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acc{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:160px;justify-content:center;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.acc:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.acc .av{margin-bottom:8px}
.acc.add{border-style:dashed;background:transparent}
.av{border-radius:50%;display:grid;place-items:center;font-weight:500;flex:none;line-height:1}
img.av{object-fit:cover;display:block;background:var(--surface-2)}
.av.plus{background:var(--surface-2);color:var(--primary-text);font-size:28px}
.pw{position:relative;display:block}
.pw input{padding-right:72px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--primary-text);font-weight:500;font-size:13px;min-height:40px;min-width:44px;padding:0 10px;border-radius:8px}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:-6px}
.meter i{display:block;height:100%;border-radius:9px;transition:width .2s,background .2s}
.code{font:500 20px/1.5 var(--f-body);letter-spacing:.04em;display:flex;flex-wrap:wrap;justify-content:center;column-gap:2px;text-align:center;background:var(--primary-soft);color:var(--primary-ink);border:1px dashed var(--primary);border-radius:16px;padding:18px 12px;word-break:break-word;user-select:all}
.ferr{color:var(--error);font-size:13px;min-height:0}
.ferr:empty{display:none}
#acctbtn .av{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
@media (max-width:420px){.sync span{display:none}.sync{padding:4px 8px}}

    return `<button class="day ${isT ? 'today' : ''}" data-act="dayMenu" data-k="${dkey(d)}" aria-label="${WDL[d.getDay()]} ${d.getDate()}: ${esc(planLabel(pl))}, ${STATUS_TXT[s]}"><span class="dn">${WD[d.getDay()].slice(0, 2)}</span><span class="dd">${d.getDate()}</span><span class="dl">${esc(pl.skipped ? 'Skipped' : planLabel(pl, true))}</span>${statusIcon(s)}</button>`; }).join('');
  const curW = avgWeight(addDays(now(), -7), new Date()), prevW = avgWeight(addDays(now(), -14), addDays(now(), -7));
  // strength: exercises whose best e1RM in the last 7 days beats their best in the 7 days before
  const e1In = (a, b) => { const m = {}; doneSessions().filter(s => inRange(s.startedAt, a, b)).forEach(s => s.exercises.forEach(sx => { const v = sxMetrics(sx).e1; if (v) m[sx.exerciseId] = Math.max(m[sx.exerciseId] || 0, v); })); return m; };
  const ce = e1In(addDays(now(), -7), new Date()), pe = e1In(addDays(now(), -14), addDays(now(), -7));
  const ups = Object.keys(ce).filter(k => pe[k] && ce[k] > pe[k] + 0.05).length, downs = Object.keys(ce).filter(k => pe[k] && ce[k] < pe[k] - 0.05).length;
  const recent = doneSessions().slice(-3).reverse();
  return `${sampleBanner()}
  <section class="sec"><div><div class="eyebrow">${esc(fmtDate(t, { weekday: 'long', day: 'numeric', month: 'long' }))}</div><h2 style="font-size:22px;margin-top:2px">${greet}${prof().name ? ', ' + esc(prof().name) : ''}</h2></div>
    <div class="chips"><span class="pill info">Training week ${trainingWeek()}</span><span class="pill ${stk ? 'ok' : ''}">${stk} scheduled workout${stk === 1 ? '' : 's'} in a row</span></div></section>
  ${today}
  <section class="sec"><div class="sec-h"><h2>This week</h2><button class="link" data-act="tab" data-t="plan">Edit plan</button></div><div class="week">${strip}</div>
    <div class="legend tiny"><span>${statusIcon('completed')}Done</span><span>${statusIcon('scheduled')}Planned</span><span>${statusIcon('missed')}Missed</span><span>${statusIcon('rest')}Rest</span></div></section>
  <section class="sec"><h2>Weekly statistics</h2><div class="grid3">
    <div class="stat"><span class="k">Workouts</span><span class="v">${ws.workouts}</span></div>
    <div class="stat"><span class="k">Adherence</span><span class="v">${ws.adh.pct == null ? '–' : ws.adh.pct + '<small>%</small>'}</span><span class="tiny muted">${ws.adh.done} of ${ws.adh.eligible} due</span></div>
    <div class="stat"><span class="k">Training time</span><span class="v">${fmtDur(ws.time).replace(' min', '<small>min</small>')}</span></div>
    <div class="stat"><span class="k">Volume</span><span class="v">${compact(imp() ? ws.volume * LB : ws.volume)}<small>${wUnit()}</small></span></div>
    <div class="stat"><span class="k">Cardio</span><span class="v">${Math.round(ws.cardio)}<small>min</small></span></div>
    <div class="stat"><span class="k">New records</span><span class="v">${ws.prs}</span></div></div></section>
  <section class="card"><div class="sec-h"><h3>Compared with last week</h3><span class="tiny muted">7 days vs prior 7</span></div><div class="list">
    <div class="li"><span class="grow">Body weight (avg)</span><span class="num">${curW == null ? '–' : fmtW(round(curW, 10))}</span>${delta(curW, prevW, v => fmtW(round(v, 10)), false)}</div>
    <div class="li"><span class="grow">Training volume</span><span class="num">${fmtVol(ws.volume)}</span>${delta(ws.volume, ps.workouts || ps.volume ? ps.volume : null, fmtVol)}</div>
    <div class="li"><span class="grow">Workouts</span><span class="num">${ws.workouts}</span>${delta(ws.workouts, ps.workouts, v => v)}</div>
    <div class="li"><span class="grow">Strength (est. 1RM)</span><span class="small">${ups || downs ? `<span class="up">${ups} up</span> · <span class="${downs ? 'down' : 'muted'}">${downs} down</span>` : '<span class="muted">No repeat lifts yet</span>'}</span></div>
    <div class="li"><span class="grow">Activity minutes</span><span class="num">${Math.round(ws.cardio)} min</span>${delta(ws.cardio, ps.cardio, v => Math.round(v) + ' min')}</div></div></section>
  <section class="sec"><h2>Quick actions</h2><div class="grid2">
    <button class="btn" data-act="tab" data-t="workout">${I.play}Start workout</button><button class="btn" data-act="measureForm" data-type="weight">Log body weight</button>
    <button class="btn" data-act="activityForm">Record activity</button><button class="btn" data-act="go" data-v="history">View history</button></div></section>
  ${recent.length ? `<section class="card"><div class="sec-h"><h3>Recent workouts</h3><button class="link" data-act="go" data-v="history">All</button></div><div class="list">${recent.map(sessionRow).join('')}</div></section>` : ''}`;
};
function sessionRow(s) { const st = sessionStats(s); return `<button class="li" data-act="go" data-v="session" data-id="${s.id}"><div class="grow"><div style="font-weight:500">${esc(s.name)}</div><div class="tiny muted">${esc(fmtDate(s.startedAt))} · ${fmtDur(st.duration)} · ${st.exercises} exercises · ${st.working} working sets · ${fmtVol(st.volume)}</div></div>${s.status === 'partial' ? pill('partial', 'Partial') : ''}${I.chev}</button>`; }

/* ============ WORKOUT TAB ============ */
VIEWS.workout = () => {
  const a = activeSession(); if (a) return activeView(a);
  const t = new Date(), p = planFor(t), tk = dkey(t);
  const todayTpl = p.kind === 'workout' && !p.skipped ? tplOf(p.templateId) : null;
  const tpls = S.templates.filter(x => x.active);
  return `${todayTpl && dayStatus(t) !== 'completed' ? `<div class="hero"><span class="eyebrow">Scheduled today</span><h2 style="font-size:22px">${esc(todayTpl.name)}</h2><p class="muted small">${todayTpl.items.length} exercises · ${sum(todayTpl.items.map(i => i.sets))} sets · ~${todayTpl.duration} min</p><button class="btn primary big" data-act="startTpl" data-id="${todayTpl.id}" data-k="${tk}">${I.play}Start workout</button></div>` : ''}
  <section class="sec"><h2>${todayTpl ? 'Or pick another' : 'Start a workout'}</h2>
  ${tpls.map(tp => { const last = doneSessions().filter(s => s.templateId === tp.id).pop(); return `<div class="card"><div class="row nw between"><div class="grow"><h3>${esc(tp.name)}</h3><p class="tiny muted">${tp.items.length} exercises · ${sum(tp.items.map(i => i.sets))} sets · ${last ? 'last ' + esc(fmtDate(last.startedAt)) : 'not done yet'}</p></div><button class="btn primary" data-act="startTpl" data-id="${tp.id}" aria-label="Start ${esc(tp.name)}">${I.play}Start</button></div></div>`; }).join('')}
  <button class="btn" data-act="startEmpty">${I.plus}Empty workout</button></section>
  <section class="card"><div class="sec-h"><h3>History</h3><button class="link" data-act="go" data-v="history">See all</button></div><div class="list">${doneSessions().slice(-4).reverse().map(sessionRow).join('') || '<div class="empty">No workouts logged yet.</div>'}</div></section>`;
};

function activeView(s) {
  const st = sessionStats(s), n = s.exercises.length;
  const doneEx = s.exercises.filter(x => x.status !== 'pending').length;
  s.cur = clamp(s.cur || 0, 0, Math.max(0, n - 1));
  const sx = s.exercises[s.cur];
  const head = `<div class="wk-head"><div class="row nw between"><div class="grow"><div class="eyebrow">${esc(s.name)}</div><div class="clock" data-tick="elapsed">${fmtClock(elapsed(s))}</div></div>
    <div style="text-align:right" class="small"><div><b class="num">${doneEx}/${n}</b> exercises</div><div><b class="num">${st.sets}/${st.planned}</b> sets</div></div></div>
    <div class="bar"><i style="width:${st.planned ? st.sets / st.planned * 100 : 0}%"></i></div>
    <div class="scrollx" role="tablist" aria-label="Exercises">${s.exercises.map((x, i) => `<button class="expill ${x.status === 'done' ? 'done' : x.status === 'skipped' ? 'skip' : ''}" role="tab" aria-current="${i === s.cur}" data-act="exGo" data-i="${i}" aria-label="${esc(x.name)}${x.status === 'done' ? ', done' : x.status === 'skipped' ? ', skipped' : ''}">${x.status === 'done' ? I.check.replace('<svg', '<svg width="14" height="14"') : ''}${i + 1}</button>`).join('')}</div></div>`;
  const paused = s.pausedAt ? `<div class="paused"><span>Workout paused · timer stopped</span><button class="btn primary sm" data-act="pauseToggle">Resume</button></div>` : '';
  if (!sx) return head + paused + `<div class="empty">No exercises yet. Add the first one.</div><button class="btn primary big" data-act="pickExercise" data-mode="add">${I.plus}Add exercise</button>${sessionFooter(s)}`;
  const ex = exOf(sx.exerciseId) || {};
  const prev = prevExercise(sx.exerciseId, s.startedAt);
  const prevSets = prev ? prev.sx.sets.filter(x => x.status === 'completed') : [];
  let rec = '';
  if (!sx.rec) { const r = recommend(sx, s.startedAt);
    if (r && !r.no) rec = `<div class="rec"><b>Ready to progress?</b><span>Consider ${fmtW(r.to)} next (smallest increment). ${esc(r.reason)}</span><div class="btns"><button class="btn sm primary" data-act="recApply" data-w="${r.to}">Use ${esc(fmtW(r.to))} for this session</button><button class="btn sm" data-act="recDismiss">Keep ${esc(fmtW(r.from))}</button></div></div>`;
    else if (r && r.no) rec = `<div class="rec" style="background:var(--surface-2)"><span class="small">${esc(r.no)}</span></div>`; }
  else if (sx.rec === 'applied') rec = `<p class="tiny muted">Progression applied to this session's working sets.</p>`;
  const nextIdx = sx.sets.findIndex(x => x.status === 'pending');
  const sets = sx.sets.map((x, i) => setCard(s, sx, x, i, prevSets[i], i === nextIdx)).join('');
  return `${head}${paused}
  <section class="card" style="gap:14px">
    <div class="row nw" style="align-items:flex-start"><div class="glyph" aria-hidden="true">${glyph(sx.equipment)}</div><div class="grow"><div class="tiny muted">Exercise ${s.cur + 1} of ${n}${sx.optional ? ' · optional' : ''}</div><button class="exname" style="border:0;background:none;padding:0;text-align:left;color:var(--ink)" data-act="go" data-v="exercise" data-id="${sx.exerciseId}">${esc(sx.name)}</button>
      <div class="tiny muted">${esc([ex.primary].concat(ex.secondary || []).filter(Boolean).join(', '))} · ${esc(sx.equipment || '')}${sx.loadBasis === 'per_hand' ? ' · weight per hand' : ''}</div></div></div>
    <div class="row small" style="gap:6px"><span class="pill info">Target ${sx.sets.length} × ${repTxt(sx.repMin, sx.repMax)}${sx.tracking === 'duration' ? ' s' : ''}</span><span class="pill">Rest ${fmtRest(sx.rest)}</span></div>
    <div class="small"><span class="muted">Last time${prev ? ' (' + esc(fmtDate(prev.s.startedAt)) + ')' : ''}:</span> ${prev ? prevSets.map(x => esc(setTxt(x, prev.sx))).join(' · ') : 'no history yet'}</div>
    ${rec}
    <div class="sec" style="gap:8px">${sets}</div>
    <div class="btns"><button class="btn sm" data-act="addSet">${I.plus}Add set</button><button class="btn sm" data-act="pickExercise" data-mode="sub">Substitute</button>${sx.status === 'skipped' ? '<button class="btn sm" data-act="unskipEx">Unskip</button>' : '<button class="btn sm" data-act="skipEx">Skip exercise</button>'}</div>
    <label class="check small"><input type="checkbox" id="flag-${sx.id}" data-chg="flag" ${sx.flag ? 'checked' : ''}>Discomfort or poor technique today</label>
    <label class="f">Exercise notes<input class="in" id="xn-${sx.id}" data-chg="sxNotes" value="${esc(sx.notes)}" placeholder="Seat height 4, slow eccentric…"></label>
    <div class="row nw"><button class="btn grow" data-act="exGo" data-i="${s.cur - 1}" ${s.cur === 0 ? 'disabled' : ''}>‹ Previous</button><button class="btn grow ${nextIdx < 0 ? 'primary' : ''}" data-act="exGo" data-i="${s.cur + 1}" ${s.cur >= n - 1 ? 'disabled' : ''}>Next ›</button></div>
  </section>${sessionFooter(s)}`;
}
const setTxt = (x, sx) => sx.tracking === 'duration' ? (x.duration || 0) + ' s' : sx.tracking === 'reps' ? (x.reps || 0) + ' reps' : `${wNum(x.weight)}${sx.tracking === 'assisted' ? ' assist' : ''} × ${x.reps}`;
function setCard(s, sx, x, i, pv, isNext) {
  const showW = sx.tracking === 'weight_reps' || sx.tracking === 'assisted';
  const dur = sx.tracking === 'duration';
  const typeName = (SET_TYPES.find(t => t[0] === x.type) || [0, 'Working'])[1];
  const stepper = (field, label, val) => `<div class="stepper"><span class="lbl">${label}</span><div class="ctl"><button data-act="step" data-f="${field}" data-d="-1" data-i="${i}" aria-label="Decrease ${label}">−</button><input id="in-${x.id}-${field}" inputmode="decimal" value="${esc(val)}" data-chg="setField" data-f="${field}" data-i="${i}" aria-label="Set ${i + 1} ${label}"><button data-act="step" data-f="${field}" data-d="1" data-i="${i}" aria-label="Increase ${label}">+</button></div></div>`;
  const ctl = dur ? stepper('duration', 'Seconds', x.duration ?? '') + '<div></div>'
    : (showW ? stepper('weight', (sx.tracking === 'assisted' ? 'Assist ' : '') + wUnit() + (sx.loadBasis === 'per_hand' ? '/hand' : ''), wNum(x.weight)) : '<div></div>') + stepper('reps', 'Reps', x.reps ?? '');
  const sel = (f, opts, v, lab) => `<select id="sel-${x.id}-${f}" data-chg="setField" data-f="${f}" data-i="${i}" aria-label="${lab}">${opts.map(o => `<option value="${o[0]}" ${String(v ?? '') === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  return `<div class="setcard ${x.status} ${isNext && x.status === 'pending' ? 'next' : ''}">
    <div class="set-top"><span class="setno">${i + 1}</span><b>${esc(typeName)}</b><span class="muted">Target ${repTxt(x.tMin, x.tMax)}${dur ? ' s' : ''}</span><span class="muted grow" style="text-align:right">${pv ? 'Prev ' + esc(setTxt(pv, sx)) : ''}</span>${x.status === 'skipped' ? '<span class="pill">Skipped</span>' : ''}</div>
    <div class="set-ctl">${ctl}<button class="donebtn" data-act="toggleSet" data-i="${i}" aria-pressed="${x.status === 'completed'}" aria-label="${x.status === 'completed' ? 'Mark set ' + (i + 1) + ' not done' : 'Complete set ' + (i + 1)}">${I.check}</button></div>
    <div class="set-extra">${sel('type', SET_TYPES, x.type, 'Set type')}${set().showRir ? sel('rir', [['', 'RIR –'], [0, 'RIR 0'], [1, 'RIR 1'], [2, 'RIR 2'], [3, 'RIR 3'], [4, 'RIR 4+']], x.rir, 'Reps in reserve') : ''}${set().showRpe ? sel('rpe', [['', 'RPE –']].concat([6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map(v => [v, 'RPE ' + v])), x.rpe, 'Rate of perceived exertion') : ''}
      <span class="grow"></span>${x.status === 'pending' ? `<button class="btn sm ghost" data-act="skipSet" data-i="${i}">Skip</button>` : x.status === 'skipped' ? `<button class="btn sm ghost" data-act="unskipSet" data-i="${i}">Undo skip</button>` : ''}<button class="btn sm ghost danger" data-act="delSet" data-i="${i}" aria-label="Delete set ${i + 1}">Delete</button></div></div>`;
}
function sessionFooter(s) {
  return `<section class="sec"><div class="grid2"><button class="btn" data-act="pickExercise" data-mode="add">${I.plus}Add exercise</button><button class="btn" data-act="pauseToggle">${s.pausedAt ? 'Resume' : 'Pause'} workout</button></div>
  <button class="btn primary big" data-act="finishSheet">Finish workout</button><button class="btn danger" data-act="discard">Discard workout</button>
  <p class="tiny muted" style="text-align:center">Every change is saved on this device instantly. You can close the app and resume later.</p></section>`;
}
</script>
<script>
/* ============ PLAN ============ */
VIEWS.plan = () => {
  const sow = set().weekStart, order = Array.from({ length: 7 }, (_, i) => (sow + i) % 7), days = S.kv.schedule.days;
  const opt = (d) => `<option value="tpl:" disabled>Workout templates</option>${S.templates.filter(t => t.active).map(t => `<option value="tpl:${t.id}" ${d.kind === 'workout' && d.templateId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="recovery" ${d.kind === 'recovery' ? 'selected' : ''}>Active recovery</option><option value="cardio" ${d.kind === 'cardio' ? 'selected' : ''}>Cardio / Badminton</option><option value="rest" ${d.kind === 'rest' ? 'selected' : ''}>Rest</option>`;
  const ov = S.kv.overrides || {}, tk = dkey(now());
  const ovs = Object.keys(ov).filter(k => k >= dkey(addDays(now(), -7))).sort();
  const nWork = Object.values(days).filter(d => d.kind === 'workout').length;
  return `<section class="card"><div class="sec-h"><h3>Weekly schedule</h3><span class="tiny muted">${nWork} workouts / week · repeats weekly</span></div>
    <div class="list">${order.map(wd => `<div class="li"><label for="sch-${wd}" style="width:96px;font-weight:500">${WDL[wd]}</label><select class="in grow" id="sch-${wd}" data-chg="schedDay" data-wd="${wd}">${opt(days[wd] || { kind: 'rest' })}</select></div>`).join('')}</div></section>
  <section class="card"><div class="sec-h"><h3>Changes to specific days</h3><button class="link" data-act="extraForm">${'+ Extra workout'}</button></div>
    ${ovs.length ? `<div class="list">${ovs.map(k => { const p = planFor(fromKey(k)); return `<div class="li"><div class="grow"><div style="font-weight:500">${esc(fmtDate(fromKey(k)))}${k === tk ? ' · today' : ''}</div><div class="tiny muted">${p.skipped ? 'Skipped' : esc(planLabel(p))}${p.note ? ' · ' + esc(p.note) : ''}</div></div><button class="btn sm" data-act="undoOverride" data-k="${k}">Undo</button></div>`; }).join('')}</div>` : '<p class="small muted">Skip, move or add a workout from the Home week strip. One-off changes show here and never alter the weekly pattern.</p>'}</section>
  <section class="sec"><div class="sec-h"><h2>Workout templates</h2><button class="link" data-act="go" data-v="template" data-id="new">+ New</button></div>
  ${S.templates.map(t => `<div class="card"><div class="row nw between" style="align-items:flex-start"><div class="grow"><h3>${esc(t.name)} ${t.active ? '' : '<span class="pill">Inactive</span>'}</h3><p class="tiny muted">${t.items.length} exercises · ${sum(t.items.map(i => i.sets))} sets · ~${t.duration} min · v${t.version}</p><p class="small" style="margin-top:6px">${esc(t.items.map(i => (exOf(i.exerciseId) || {}).name).filter(Boolean).join(' · '))}</p></div></div>
    <div class="btns"><button class="btn sm" data-act="go" data-v="template" data-id="${t.id}">Edit</button><button class="btn sm" data-act="dupTpl" data-id="${t.id}">Duplicate</button><button class="btn sm primary" data-act="startTpl" data-id="${t.id}">Start</button></div></div>`).join('')}</section>
  <button class="btn" data-act="go" data-v="exercises">Open exercise library ${I.chev}</button>`;
};

VIEWS.template = p => {
  if (p.ro) { const t = tplOf(p.id); if (!t) return '<div class="empty">Template not found.</div>';
    return `<section class="card"><h2>${esc(t.name)}</h2><p class="small muted">${esc(t.description)}</p><div class="list">${t.items.map((it, i) => { const e = exOf(it.exerciseId) || {}; return `<button class="li" data-act="go" data-v="exercise" data-id="${it.exerciseId}"><span class="setno">${i + 1}</span><div class="grow"><div style="font-weight:500">${esc(e.name)}</div><div class="tiny muted">${it.sets} × ${repTxt(it.repMin, it.repMax)} · rest ${fmtRest(it.rest)}${it.optional ? ' · optional' : ''}</div></div>${I.chev}</button>`; }).join('')}</div>
      <div class="btns"><button class="btn primary" data-act="startTpl" data-id="${t.id}">${I.play}Start</button><button class="btn" data-act="tplEdit" data-id="${t.id}">Edit template</button></div></section>`; }
  if (!p.draft) { const t = p.id === 'new' ? { id: uid(), name: '', description: '', muscles: [], duration: 60, version: 0, active: true, items: [], isNew: true } : JSON.parse(JSON.stringify(tplOf(p.id))); p.draft = t; }
  const d = p.draft;
  return `<section class="card"><label class="f">Name<input class="in" id="tp-name" data-chg="tpField" data-f="name" value="${esc(d.name)}" placeholder="e.g. Full Body C" maxlength="60"></label>
    <label class="f">Description<input class="in" id="tp-desc" data-chg="tpField" data-f="description" value="${esc(d.description)}"></label>
    <div class="grid2"><label class="f">Primary muscles<input class="in" id="tp-mus" data-chg="tpField" data-f="muscles" value="${esc(d.muscles.join(', '))}" placeholder="Chest, Lats"></label><label class="f">Est. minutes<input class="in" id="tp-dur" type="number" min="5" max="240" data-chg="tpField" data-f="duration" value="${d.duration}"></label></div>
    <label class="check"><input type="checkbox" id="tp-act" data-chg="tpField" data-f="active" ${d.active ? 'checked' : ''}>Active (shows in Start and the schedule)</label></section>
  <section class="sec"><div class="sec-h"><h2>Exercises</h2><span class="tiny muted">${d.items.length} · ${sum(d.items.map(i => +i.sets || 0))} sets</span></div>
  ${d.items.map((it, i) => { const e = exOf(it.exerciseId) || {}; return `<div class="card" style="gap:10px"><div class="row nw"><span class="setno">${i + 1}</span><b class="grow">${esc(e.name)}</b><button class="iconbtn" data-act="tpMove" data-i="${i}" data-d="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button><button class="iconbtn" data-act="tpMove" data-i="${i}" data-d="1" aria-label="Move down" ${i === d.items.length - 1 ? 'disabled' : ''}>↓</button><button class="iconbtn" data-act="tpDel" data-i="${i}" aria-label="Remove ${esc(e.name)}" style="color:var(--error)">✕</button></div>
    <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))"><label class="f">Sets<input class="in" id="ti-${it.id}-s" type="number" min="1" max="12" data-chg="tpItem" data-i="${i}" data-f="sets" value="${it.sets}"></label><label class="f">Reps min<input class="in" id="ti-${it.id}-a" type="number" min="1" max="100" data-chg="tpItem" data-i="${i}" data-f="repMin" value="${it.repMin}"></label><label class="f">Reps max<input class="in" id="ti-${it.id}-b" type="number" min="1" max="100" data-chg="tpItem" data-i="${i}" data-f="repMax" value="${it.repMax}"></label><label class="f">Rest s<input class="in" id="ti-${it.id}-r" type="number" min="0" max="900" step="15" data-chg="tpItem" data-i="${i}" data-f="rest" value="${it.rest}"></label></div>
    <label class="check small"><input type="checkbox" id="ti-${it.id}-o" data-chg="tpItem" data-i="${i}" data-f="optional" ${it.optional ? 'checked' : ''}>Optional</label></div>`; }).join('') || '<div class="empty">No exercises yet.</div>'}
  <button class="btn" data-act="pickExercise" data-mode="tpl">${I.plus}Add exercise</button></section>
  <p class="tiny muted">Saving creates version ${(d.version || 0) + 1}. Workouts you already logged keep their own copy and do not change.</p>
  <div class="btns"><button class="btn primary big" data-act="tpSave">Save template</button>${d.isNew ? '' : '<button class="btn danger" data-act="tpDelete">Delete template</button>'}</div>`;
};

/* ============ EXERCISE LIBRARY ============ */
function exFilter(p) {
  const q = (p.q || '').toLowerCase().trim();
  return S.exercises.filter(e => e.active !== false && (!q || e.name.toLowerCase().includes(q) || (e.aliases || []).some(a => a.toLowerCase().includes(q))) && (!p.muscle || e.primary === p.muscle || (e.secondary || []).includes(p.muscle)) && (!p.equip || e.equipment === p.equip) && (!p.fav || e.fav))
    .sort((a, b) => (b.fav - a.fav) || a.name.localeCompare(b.name));
}
function exList(list, act) { return list.length ? list.map(e => `<button class="li" data-act="${act}" data-id="${e.id}"><div class="glyph" style="width:40px;height:40px;border-radius:10px" aria-hidden="true">${glyph(e.equipment)}</div><div class="grow"><div style="font-weight:500">${esc(e.name)} ${e.custom ? '<span class="pill">Custom</span>' : ''}</div><div class="tiny muted">${esc(e.primary)} · ${esc(e.equipment)} · ${esc(e.movement)}</div></div>${e.fav ? `<span class="fav" aria-label="Favorite">${I.star}</span>` : ''}${I.chev}</button>`).join('') : '<div class="empty">No exercises match. Try another search or create a custom exercise.</div>'; }
VIEWS.exercises = p => `<section class="sec"><input class="in" id="ex-q" type="search" placeholder="Search ${S.exercises.length} exercises" data-inp="exSearch" value="${esc(p.q || '')}" aria-label="Search exercises">
  <div class="grid2"><select class="in" id="ex-m" data-chg="exFilt" data-f="muscle" aria-label="Muscle group"><option value="">All muscles</option>${MUSCLES.map(m => `<option ${p.muscle === m ? 'selected' : ''}>${m}</option>`).join('')}</select><select class="in" id="ex-e" data-chg="exFilt" data-f="equip" aria-label="Equipment"><option value="">All equipment</option>${EQUIP.map(m => `<option ${p.equip === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
  <div class="row between"><button class="chip" aria-pressed="${!!p.fav}" data-act="exFav">★ Favorites</button><button class="btn sm primary" data-act="exForm">${I.plus}Custom exercise</button></div></section>
  <section class="card"><div class="list" id="exlist">${exList(exFilter(p), 'go" data-v="exercise')}</div></section>`;

VIEWS.exercise = p => {
  const e = exOf(p.id); if (!e) return '<div class="empty">Exercise not found.</div>';
  const h = exHistory(e.id), b = prData().best[e.id], metric = p.metric || 'e1';
  const wr = e.tracking === 'weight_reps';
  const pts = h.map(({ s, sx }) => { const m = sxMetrics(sx); const y = metric === 'e1' ? m.e1 : metric === 'top' ? m.top : metric === 'vol' ? m.vol : m.reps; return { x: s.startedAt, y: metric === 'vol' ? (imp() ? y * LB : y) : metric === 'reps' ? y : +wNum(y) }; }).filter(x => x.y > 0);
  const last = h[h.length - 1];
  const repsAt = b && b.repsAt ? Object.entries(b.repsAt).sort((a, c) => c[0] - a[0]).slice(0, 6) : [];
  const metricLabel = { e1: 'Estimated 1RM', top: 'Heaviest set', vol: 'Volume', reps: 'Total reps' };
  return `<section class="card"><div class="row nw" style="align-items:flex-start"><div class="glyph" aria-hidden="true">${glyph(e.equipment)}</div><div class="grow"><h2>${esc(e.name)}</h2><p class="tiny muted">${esc(e.equipment)} · ${esc(e.movement)} · ${esc(e.difficulty)}</p></div><button class="iconbtn fav" data-act="toggleFav" data-id="${e.id}" aria-pressed="${!!e.fav}" aria-label="${e.fav ? 'Remove from favorites' : 'Add to favorites'}">${e.fav ? I.star : I.starO}</button></div>
    <p>${esc(e.description)}</p>
    <div class="chips"><span class="pill info">Primary: ${esc(e.primary)}</span>${(e.secondary || []).map(m => `<span class="pill">${esc(m)}</span>`).join('')}</div>
    <div class="grid3"><div class="stat"><span class="k">Rep range</span><span class="v" style="font-size:15px">${esc(e.repRange)}</span></div><div class="stat"><span class="k">Rest</span><span class="v" style="font-size:15px">${fmtRest(e.rest)}</span></div><div class="stat"><span class="k">Tracking</span><span class="v" style="font-size:15px">${esc({ weight_reps: 'Weight × reps', reps: 'Reps only', duration: 'Duration', assisted: 'Assisted' }[e.tracking])}</span></div></div>
    ${e.loadBasis === 'per_hand' ? '<p class="tiny muted">Logged weight is per dumbbell. Volume counts both hands (weight × 2 × reps).</p>' : ''}
    ${e.custom ? `<div class="btns"><button class="btn sm" data-act="exForm" data-id="${e.id}">Edit custom exercise</button></div>` : ''}</section>
  <section class="card"><h3>Performance</h3>
    ${h.length ? `<div class="grid2"><div class="stat"><span class="k">Last performed</span><span class="v" style="font-size:17px">${esc(fmtDate(last.s.startedAt))}</span><span class="tiny muted">${esc(last.sx.sets.filter(x => x.status === 'completed').map(x => setTxt(x, last.sx)).join(', '))}</span></div><div class="stat"><span class="k">Sessions</span><span class="v">${h.length}</span></div>
      ${wr ? `<div class="stat"><span class="k">Heaviest set</span><span class="v">${wNum(b.top)}<small>${wUnit()}</small></span></div><div class="stat"><span class="k">Est. 1RM (Epley, approx.)</span><span class="v">${wNum(round(b.e1, 10))}<small>${wUnit()}</small></span></div>` : `<div class="stat"><span class="k">${e.tracking === 'duration' ? 'Longest hold' : 'Most reps'}</span><span class="v">${e.tracking === 'duration' ? b.maxDur + '<small>s</small>' : b.maxReps}</span></div>`}</div>
    ${wr ? `<div class="chips" role="group" aria-label="Chart metric">${Object.entries(metricLabel).map(([k, l]) => `<button class="chip" aria-pressed="${metric === k}" data-act="exMetric" data-m="${k}">${l}</button>`).join('')}</div>
    ${lineChart('exc', pts, { fmt: v => trim(round(v, 10)) + (metric === 'reps' ? '' : ' ' + wUnit()), label: metricLabel[metric] + ' over time' })}
    ${metric === 'e1' ? '<p class="tiny muted">Estimated 1RM = weight × (1 + reps ÷ 30). An approximation, only computed for sets of 12 reps or fewer.</p>' : ''}` : ''}
    ${repsAt.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Weight</th><th>Most reps</th><th>Est. 1RM</th></tr></thead><tbody>${repsAt.map(([w, r]) => `<tr><td>${fmtW(+w)}</td><td>${r}</td><td>${e1rm(+w, r) ? fmtW(round(e1rm(+w, r), 10)) : '–'}</td></tr>`).join('')}</tbody></table></div>` : ''}` : '<div class="empty">No sessions logged with this exercise yet.</div>'}</section>
  <section class="card"><h3>How to do it</h3><ol class="steps">${(e.instructions || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>${(e.mistakes || []).length ? `<h3>Common mistakes</h3><ul class="steps">${e.mistakes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${e.videoUrl ? `<a class="btn sm" href="${esc(e.videoUrl)}" target="_blank" rel="noopener">Watch demonstration</a>` : ''}</section>
  ${h.length ? `<section class="card"><h3>History</h3><div class="list">${h.slice().reverse().slice(0, 12).map(({ s, sx }) => `<button class="li" data-act="go" data-v="session" data-id="${s.id}"><div class="grow"><div style="font-weight:500">${esc(fmtDate(s.startedAt))} · ${esc(s.name)}</div><div class="tiny muted num">${esc(sx.sets.filter(x => x.status === 'completed').map(x => setTxt(x, sx)).join(' · '))}${wr ? ' · ' + fmtVol(sxVolume(sx)) : ''}</div></div>${I.chev}</button>`).join('')}</div></section>` : ''}`;
};
function exFormSheet(id) {
  const e = id ? exOf(id) : { name: '', primary: 'Chest', secondary: [], equipment: 'machine', movement: 'compound', tracking: 'weight_reps', rest: set().defaultRest, repRange: '8–12', loadBasis: 'total', difficulty: 'beginner', description: '', instructions: [], aliases: [], videoUrl: '' };
  sheet(id ? 'Edit exercise' : 'Custom exercise', `<label class="f">Name<input class="in" id="xf-name" value="${esc(e.name)}" maxlength="60"></label>
  <label class="f">Also known as (comma separated)<input class="in" id="xf-alias" value="${esc((e.aliases || []).join(', '))}"></label>
  <div class="grid2"><label class="f">Primary muscle<select class="in" id="xf-prim">${MUSCLES.map(m => `<option ${e.primary === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label><label class="f">Equipment<select class="in" id="xf-eq">${EQUIP.map(m => `<option ${e.equipment === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
  <label class="f">Movement<select class="in" id="xf-mv"><option ${e.movement === 'compound' ? 'selected' : ''}>compound</option><option ${e.movement === 'isolation' ? 'selected' : ''}>isolation</option></select></label><label class="f">Tracking<select class="in" id="xf-tr">${[['weight_reps', 'Weight × reps'], ['reps', 'Reps only'], ['duration', 'Duration'], ['assisted', 'Assisted (less is harder)']].map(o => `<option value="${o[0]}" ${e.tracking === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
  <label class="f">Default rest (s)<input class="in" id="xf-rest" type="number" min="0" max="900" step="15" value="${e.rest}"></label><label class="f">Rep range<input class="in" id="xf-rr" value="${esc(e.repRange)}"></label></div>
  <label class="f">Secondary muscles<input class="in" id="xf-sec" value="${esc((e.secondary || []).join(', '))}" placeholder="Triceps, Shoulders"></label>
  <label class="check"><input type="checkbox" id="xf-ph" ${e.loadBasis === 'per_hand' ? 'checked' : ''}>Weight is logged per hand (dumbbells)</label>
  <label class="f">Description<textarea class="in" id="xf-desc">${esc(e.description)}</textarea></label>
  <label class="f">Instructions (one step per line)<textarea class="in" id="xf-ins">${esc((e.instructions || []).join('\n'))}</textarea></label>
  <label class="f">Video URL (optional)<input class="in" id="xf-vid" type="url" value="${esc(e.videoUrl || '')}"></label>
  <p class="tiny" id="xf-err" style="color:var(--error)"></p><button class="btn primary big" data-act="saveEx" data-id="${id || ''}">Save exercise</button>`);
}
function pickSheet(mode) {
  sheet(mode === 'sub' ? 'Substitute exercise' : 'Add exercise', `<input class="in" id="pk-q" type="search" placeholder="Search exercises" data-inp="pickSearch" aria-label="Search exercises"><div class="list" id="picklist">${exList(exFilter({}), 'pickDo')}</div>`, { mode });
}

/* ============ HISTORY ============ */
VIEWS.history = p => {
  const f = p.f || (p.f = {});
  let list = S.sessions.filter(s => s.status !== 'in_progress' && s.status !== 'discarded');
  if (f.from) list = list.filter(s => s.startedAt >= +fromKey(f.from)); if (f.to) list = list.filter(s => s.startedAt < +addDays(fromKey(f.to), 1));
  if (f.tpl) list = list.filter(s => s.templateId === f.tpl); if (f.ex) list = list.filter(s => s.exercises.some(x => x.exerciseId === f.ex && x.sets.some(st => st.status === 'completed')));
  if (f.mus) list = list.filter(s => s.exercises.some(x => { const e = exOf(x.exerciseId); return e && (e.primary === f.mus || (e.secondary || []).includes(f.mus)); }));
  if (f.st) list = list.filter(s => s.status === f.st);
  list.sort((a, b) => b.startedAt - a.startedAt);
  const skipped = Object.entries(S.kv.overrides || {}).filter(([k, v]) => v.skipped).length;
  const active = Object.values(f).filter(Boolean).length;
  return `<details class="card" ${active ? 'open' : ''}><summary>Filters${active ? ` (${active} on)` : ''}</summary>
    <div class="grid2"><label class="f">From<input class="in" type="date" id="hf-from" data-chg="hFilt" data-f="from" value="${f.from || ''}"></label><label class="f">To<input class="in" type="date" id="hf-to" data-chg="hFilt" data-f="to" value="${f.to || ''}"></label>
    <label class="f">Workout<select class="in" id="hf-tpl" data-chg="hFilt" data-f="tpl"><option value="">Any</option>${S.templates.map(t => `<option value="${t.id}" ${f.tpl === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
    <label class="f">Status<select class="in" id="hf-st" data-chg="hFilt" data-f="st"><option value="">Any</option><option value="completed" ${f.st === 'completed' ? 'selected' : ''}>Completed</option><option value="partial" ${f.st === 'partial' ? 'selected' : ''}>Partial</option></select></label>
    <label class="f">Exercise<select class="in" id="hf-ex" data-chg="hFilt" data-f="ex"><option value="">Any</option>${S.exercises.slice().sort((a, b) => a.name.localeCompare(b.name)).map(e => `<option value="${e.id}" ${f.ex === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></label>
    <label class="f">Muscle<select class="in" id="hf-mus" data-chg="hFilt" data-f="mus"><option value="">Any</option>${MUSCLES.map(m => `<option ${f.mus === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label></div>
    ${active ? '<button class="btn sm" data-act="hClear">Clear filters</button>' : ''}</details>
  <p class="small muted">${list.length} workout${list.length === 1 ? '' : 's'}${skipped && !active ? ` · ${skipped} skipped day${skipped === 1 ? '' : 's'} recorded in Plan` : ''}</p>
  <section class="card"><div class="list">${list.map(sessionRow).join('') || '<div class="empty">No workouts match these filters.</div>'}</div></section>`;
};

VIEWS.session = p => {
  const s = S.sessions.find(x => x.id === p.id); if (!s) return '<div class="empty">This workout was deleted.</div>';
  const st = sessionStats(s), prs = prData().events.filter(e => e.sid === s.id), ed = !!p.edit;
  return `<section class="card"><div class="row between nw"><div class="grow"><h2>${esc(s.name)}</h2><p class="small muted">${esc(fmtDate(s.startedAt, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))} · ${fmtTime(s.startedAt)}</p></div>${pill(s.status === 'partial' ? 'partial' : 'completed', s.status === 'partial' ? 'Partial' : 'Completed')}</div>
    <div class="grid3"><div class="stat"><span class="k">Duration</span><span class="v" style="font-size:15px">${fmtDur(st.duration)}</span></div><div class="stat"><span class="k">Working sets</span><span class="v" style="font-size:15px">${st.working}</span></div><div class="stat"><span class="k">Volume</span><span class="v" style="font-size:15px">${fmtVol(st.volume)}</span></div></div>
    ${s.sessionRpe || s.fatigue ? `<p class="small">Session RPE ${s.sessionRpe || '–'} · Energy ${s.fatigue ? s.fatigue + '/5' : '–'}</p>` : ''}
    ${prs.length ? `<div>${prs.map(e => `<div class="prline"><span class="medal">PR</span><div class="grow small"><b>${esc(e.name)}</b> · ${esc(e.kind)}</div><b class="num small">${esc(e.val)}</b></div>`).join('')}</div>` : ''}
    <div class="btns"><button class="btn sm ${ed ? 'primary' : ''}" data-act="sEdit">${ed ? 'Done editing' : 'Edit entries'}</button><button class="btn sm" data-act="go" data-v="compare" data-id="${s.id}">Compare</button><button class="btn sm" data-act="sDupTpl">Save as template</button><button class="btn sm danger" data-act="sDelete">Delete</button></div></section>
  ${s.exercises.map((sx, xi) => `<section class="card" style="gap:8px"><div class="row between nw"><button class="link" style="padding:0;min-height:0;font-size:16px;text-align:left" data-act="go" data-v="exercise" data-id="${sx.exerciseId}">${esc(sx.name)}</button><span class="tiny muted">${sx.tracking === 'weight_reps' ? fmtVol(sxVolume(sx)) : ''}</span></div>
    ${sx.flag ? '<span class="pill warn">Discomfort / form flagged</span>' : ''}
    <div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>Type</th><th>${sx.tracking === 'duration' ? 'Seconds' : 'Weight'}</th><th>Reps</th>${set().showRir ? '<th>RIR</th>' : ''}<th>Status</th></tr></thead><tbody>
    ${sx.sets.map((x, i) => ed ? `<tr><td>${i + 1}</td><td><select class="in" style="min-width:96px" id="e-${x.id}-t" data-chg="hSet" data-x="${xi}" data-i="${i}" data-f="type">${SET_TYPES.map(t => `<option value="${t[0]}" ${x.type === t[0] ? 'selected' : ''}>${t[1]}</option>`).join('')}</select></td>
      <td><input class="in" style="width:76px" inputmode="decimal" id="e-${x.id}-w" data-chg="hSet" data-x="${xi}" data-i="${i}" data-f="${sx.tracking === 'duration' ? 'duration' : 'weight'}" value="${sx.tracking === 'duration' ? (x.duration ?? '') : wNum(x.weight)}"></td><td><input class="in" style="width:62px" inputmode="numeric" id="e-${x.id}-r" data-chg="hSet" data-x="${xi}" data-i="${i}" data-f="reps" value="${x.reps ?? ''}"></td>${set().showRir ? `<td><input class="in" style="width:52px" inputmode="numeric" id="e-${x.id}-q" data-chg="hSet" data-x="${xi}" data-i="${i}" data-f="rir" value="${x.rir ?? ''}"></td>` : ''}
      <td><select class="in" style="min-width:110px" id="e-${x.id}-s" data-chg="hSet" data-x="${xi}" data-i="${i}" data-f="status"><option value="completed" ${x.status === 'completed' ? 'selected' : ''}>Completed</option><option value="skipped" ${x.status === 'skipped' ? 'selected' : ''}>Skipped</option><option value="pending" ${x.status === 'pending' ? 'selected' : ''}>Not done</option></select></td></tr>`
      : `<tr><td>${i + 1}</td><td>${esc((SET_TYPES.find(t => t[0] === x.type) || [0, ''])[1])}</td><td>${sx.tracking === 'duration' ? (x.duration ?? '–') : sx.tracking === 'reps' ? '–' : fmtW(x.weight)}</td><td>${x.reps ?? '–'}</td>${set().showRir ? `<td>${x.rir ?? '–'}</td>` : ''}<td>${x.status === 'completed' ? '✓ Done' : x.status === 'skipped' ? '– Skipped' : 'Not done'}</td></tr>`).join('')}</tbody></table></div>
    ${sx.notes ? `<p class="small muted">${esc(sx.notes)}</p>` : ''}</section>`).join('')}
  <section class="card"><label class="f">Workout notes<textarea class="in" id="s-notes" data-chg="sNotes" placeholder="How did it feel? Anything to change next time?">${esc(s.notes || '')}</textarea></label></section>`;
};

VIEWS.summary = p => {
  const s = S.sessions.find(x => x.id === p.id); if (!s) return '<div class="empty">Workout not found.</div>';
  const st = sessionStats(s), prs = prData().events.filter(e => e.sid === s.id);
  const prev = doneSessions().filter(x => x.templateId && x.templateId === s.templateId && x.startedAt < s.startedAt).pop();
  const ps = prev ? sessionStats(prev) : null;
  return `<div class="hero" style="align-items:center;text-align:center"><span class="pill ${s.status === 'partial' ? 'warn' : 'ok'}">${s.status === 'partial' ? 'Saved as partial' : 'Workout complete'}</span><h2 style="font-size:24px">${esc(s.name)}</h2><div class="big">${fmtClock(st.duration)}</div><p class="small muted">${esc(fmtDate(s.startedAt, { weekday: 'long', day: 'numeric', month: 'long' }))}</p></div>
  <div class="grid2"><div class="stat"><span class="k">Exercises</span><span class="v">${st.exercises}<small>/ ${s.exercises.length}</small></span></div><div class="stat"><span class="k">Sets completed</span><span class="v">${st.sets}</span></div><div class="stat"><span class="k">Total reps</span><span class="v">${st.reps}</span></div><div class="stat"><span class="k">Volume (working sets)</span><span class="v">${Math.round(imp() ? st.volume * LB : st.volume).toLocaleString()}<small>${wUnit()}</small></span></div></div>
  <section class="card"><h3>Personal records</h3>${prs.length ? prs.map(e => `<div class="prline"><span class="medal">PR</span><div class="grow small"><b>${esc(e.name)}</b><div class="tiny muted">${esc(e.kind)}</div></div><b class="num">${esc(e.val)}</b></div>`).join('') : '<p class="small muted">No new records this time. Consistency is what produces them.</p>'}</section>
  <section class="card"><h3>Versus last ${esc(s.name)}</h3>${ps ? `<div class="list"><div class="li"><span class="grow">Volume</span><span class="num">${fmtVol(st.volume)}</span>${delta(st.volume, ps.volume, fmtVol)}</div><div class="li"><span class="grow">Working sets</span><span class="num">${st.working}</span>${delta(st.working, ps.working, v => v)}</div><div class="li"><span class="grow">Total reps</span><span class="num">${st.reps}</span>${delta(st.reps, ps.reps, v => v)}</div><div class="li"><span class="grow">Duration</span><span class="num">${fmtDur(st.duration)}</span>${delta(st.duration, ps.duration, fmtDur, false)}</div></div><p class="tiny muted">Compared with ${esc(fmtDate(prev.startedAt))}.</p>` : '<p class="small muted">First time logging this workout. Next time you will see a comparison here.</p>'}</section>
  ${s.notes ? `<section class="card"><h3>Notes</h3><p>${esc(s.notes)}</p></section>` : ''}

VIEWS.compare = p => {
  const s = S.sessions.find(x => x.id === p.id); if (!s) return '<div class="empty">Workout not found.</div>';
  const others = doneSessions().filter(x => x.id !== s.id && x.startedAt < s.startedAt).reverse();
  const o = S.sessions.find(x => x.id === p.other) || others.find(x => x.templateId === s.templateId) || others[0];
  if (!o) return '<div class="empty">No earlier workout to compare with.</div>';
  const ids = [...new Set(s.exercises.map(x => x.exerciseId).concat(o.exercises.map(x => x.exerciseId)))];
  const cell = (sess, id) => { const sx = sess.exercises.find(x => x.exerciseId === id); if (!sx) return '<span class="muted">–</span>'; const m = sxMetrics(sx); return sx.tracking === 'weight_reps' ? `${fmtW(m.top)} top<br><span class="tiny muted">${fmtVol(m.vol)}</span>` : setTxt(sx.sets[0] || {}, sx); };

  <div class="tblwrap"><table class="tbl"><thead><tr><th>Exercise</th><th>${esc(fmtDate(o.startedAt, { day: 'numeric', month: 'short' }))}</th><th>${esc(fmtDate(s.startedAt, { day: 'numeric', month: 'short' }))}</th></tr></thead><tbody>${ids.map(id => `<tr><td>${esc((exOf(id) || {}).name || '')}</td><td>${cell(o, id)}</td><td>${cell(s, id)}</td></tr>`).join('')}
  <tr><td><b>Total volume</b></td><td><b>${fmtVol(sessionVolume(o))}</b></td><td><b>${fmtVol(sessionVolume(s))}</b></td></tr><tr><td><b>Duration</b></td><td>${fmtDur(elapsed(o))}</td><td>${fmtDur(elapsed(s))}</td></tr></tbody></table></div></section>`;
};
</script>
<script>
/* ============ PROGRESS ============ */
const RANGES = [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['180', '6 months'], ['365', '12 months'], ['custom', 'Custom']];
function rangeOf(p) {
  if (p.range === 'custom' && p.from && p.to) return [fromKey(p.from), new Date(+addDays(fromKey(p.to), 1) - 1)];
  const n = +(p.range && p.range !== 'custom' ? p.range : 30); return [sod(addDays(now(), -(n - 1))), new Date()];
}
function rangeChips(p) { return `<div class="scrollx" role="group" aria-label="Date range">${RANGES.map(([k, l]) => `<button class="chip" aria-pressed="${(p.range || '30') === k}" data-act="range" data-r="${k}">${l}</button>`).join('')}</div>
  ${p.range === 'custom' ? `<div class="grid2"><label class="f">From<input class="in" type="date" id="pr-from" data-chg="rangeDate" data-f="from" value="${p.from || ''}"></label><label class="f">To<input class="in" type="date" id="pr-to" data-chg="rangeDate" data-f="to" value="${p.to || ''}"></label></div>` : ''}`; }
function buckets(a, b) {
  const days = (b - a) / DAY, out = [];
  if (days <= 120) { for (let s = weekStart(a); s <= b; s = addDays(s, 7)) out.push({ a: s, b: new Date(+addDays(s, 7) - 1), l: fmtDate(s, { day: 'numeric', month: 'short' }) }); }
  else { for (let s = new Date(a.getFullYear(), a.getMonth(), 1); s <= b; s = new Date(s.getFullYear(), s.getMonth() + 1, 1)) out.push({ a: s, b: new Date(+new Date(s.getFullYear(), s.getMonth() + 1, 1) - 1), l: fmtDate(s, { month: 'short' }) }); }
  return out;
}
function muscleAttr(exId) { const e = exOf(exId); if (!e) return {}; const m = { [e.primary]: 1 }; if (set().muscleSecondary) (e.secondary || []).forEach(x => { if (!m[x]) m[x] = 0.5; }); return m; }
function weightSeries(a, b, type = 'weight') {
  const all = S.measurements.filter(x => x.type === type).sort((x, y) => x.measuredAt - y.measuredAt);
  const pts = all.filter(x => inRange(x.measuredAt, a, b)).map(x => ({ x: x.measuredAt, y: +mDisp(type, x.value), t: fmtDate(x.measuredAt) + ': ' + mDisp(type, x.value) + ' ' + mUnit(type) }));
  const avg = pts.map(p => { const w = all.filter(x => x.measuredAt <= p.x && x.measuredAt > p.x - 7 * DAY); return { x: p.x, y: w.length >= 2 ? +mDisp(type, sum(w.map(x => x.value)) / w.length) : p.y }; });
  return { all, pts, avg };
}
VIEWS.progress = p => {
  const [a, b] = rangeOf(p), ss = doneSessions().filter(s => inRange(s.startedAt, a, b));
  const acts = S.activities.filter(x => inRange(x.startedAt, a, b)), adh = adherence(a, b);
  const prs = prData().events.filter(e => inRange(e.at, a, b));
  const vol = sum(ss.map(s => sessionVolume(s))), avgDur = ss.length ? sum(ss.map(elapsed)) / ss.length : 0;
  const tracked = [...new Set(doneSessions().flatMap(s => s.exercises.filter(x => x.tracking === 'weight_reps' && x.sets.some(st => st.status === 'completed')).map(x => x.exerciseId)))].map(exOf).filter(Boolean).sort((x, y) => x.name.localeCompare(y.name));
  const exId = p.ex && exOf(p.ex) ? p.ex : (tracked[0] || {}).id, metric = p.metric || 'e1';
  const sPts = exId ? exHistory(exId).filter(x => inRange(x.s.startedAt, a, b)).map(({ s, sx }) => { const m = sxMetrics(sx); const y = metric === 'e1' ? m.e1 : metric === 'top' ? m.top : m.vol; return { x: s.startedAt, y: metric === 'vol' ? Math.round(imp() ? y * LB : y) : +wNum(round(y, 10)) }; }).filter(x => x.y > 0) : [];
  const bk = buckets(a, b);
  const volBars = bk.map(k => { const v = sum(ss.filter(s => inRange(s.startedAt, k.a, k.b)).map(s => sessionVolume(s))); return { l: k.l, v: Math.round(imp() ? v * LB : v), t: (bk.length > 20 ? '' : 'Week of ') + k.l + ': ' + fmtVol(v) }; });
  const conBars = bk.map(k => { const n = ss.filter(s => inRange(s.startedAt, k.a, k.b)).length, ad = adherence(k.a, k.b); return { l: k.l, v: n, t: `${k.l}: ${n} workout${n === 1 ? '' : 's'}${ad.pct != null ? ' · ' + ad.pct + '% adherence' : ''}` }; });
  const mv = {}, ms = {};
  ss.forEach(s => s.exercises.forEach(sx => { const at = muscleAttr(sx.exerciseId), v = sxVolume(sx), hs = sx.sets.filter(st => st.status === 'completed' && ['working', 'failure', 'backoff'].includes(st.type)).length; Object.entries(at).forEach(([m, f]) => { mv[m] = (mv[m] || 0) + v * f; ms[m] = (ms[m] || 0) + hs * f; }); }));
  const byType = {}; ss.forEach(s => { (byType[s.name] = byType[s.name] || []).push(elapsed(s)); });
  const bw = weightSeries(a, b);
  const pf = prof();
  const missed = (() => { let n = 0; for (let d = sod(a); d <= b && dkey(d) < dkey(now()); d = addDays(d, 1)) if (planFor(d).kind === 'workout' && ['missed', 'skipped'].includes(dayStatus(d))) n++; return n; })();
  const months = (b - a) / DAY / 30.4;
  return `${sampleBanner()}${rangeChips(p)}
  <div class="grid3"><div class="stat"><span class="k">Workouts</span><span class="v">${ss.length}</span></div><div class="stat"><span class="k">Adherence</span><span class="v">${adh.pct == null ? '–' : adh.pct + '<small>%</small>'}</span><span class="tiny muted">${adh.done}/${adh.eligible} scheduled</span></div><div class="stat"><span class="k">Volume</span><span class="v">${compact(imp() ? vol * LB : vol)}<small>${wUnit()}</small></span></div>
  <div class="stat"><span class="k">Avg session</span><span class="v">${Math.round(avgDur / 60e3)}<small>min</small></span></div><div class="stat"><span class="k">Activity</span><span class="v">${Math.round(sum(acts.map(x => x.duration)) / 60)}<small>min</small></span></div><div class="stat"><span class="k">New records</span><span class="v">${prs.length}</span></div></div>
  <section class="card"><div class="sec-h"><h3>Strength</h3><button class="link" data-act="go" data-v="records">Records</button></div>
    ${tracked.length ? `<select class="in" id="pg-ex" data-chg="progEx" aria-label="Exercise">${tracked.map(e => `<option value="${e.id}" ${e.id === exId ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
    <div class="chips" role="group" aria-label="Metric">${[['e1', 'Est. 1RM'], ['top', 'Heaviest set'], ['vol', 'Volume']].map(([k, l]) => `<button class="chip" aria-pressed="${metric === k}" data-act="progMetric" data-m="${k}">${l}</button>`).join('')}</div>
    ${lineChart('str', sPts, { fmt: v => trim(round(v, 10)) + ' ' + wUnit(), label: 'Strength trend', empty: 'Fewer than two sessions with this exercise in the selected range.' })}
    ${metric === 'e1' ? '<p class="tiny muted">Estimated 1RM uses the Epley formula. It is an approximation and skips sets above 12 reps.</p>' : ''}` : '<div class="empty">Finish a workout to start tracking strength.</div>'}</section>
  <section class="card"><div class="sec-h"><h3>Training volume</h3><span class="tiny muted">${set().volumeAllTypes ? 'all set types' : 'working sets'} · ${bk.length > 20 ? 'monthly' : 'weekly'}</span></div>${barChart('vol', volBars, { fmt: v => v.toLocaleString() + ' ' + wUnit(), axisFmt: v => v >= 1000 ? round(v / 1000, 10) + 'k' : v, label: 'Training volume per period' })}</section>
  <section class="card"><div class="sec-h"><h3>Consistency</h3><span class="tiny muted">workouts per ${bk.length > 20 ? 'month' : 'week'}</span></div>${barChart('con', conBars, { fmt: v => v, label: 'Workouts per period' })}
    <div class="grid3"><div class="stat"><span class="k">Current streak</span><span class="v">${streak()}</span></div><div class="stat"><span class="k">Missed / skipped</span><span class="v">${missed}</span></div><div class="stat"><span class="k">Per month</span><span class="v">${months >= 0.9 ? round(ss.length / months, 10) : ss.length}</span></div></div></section>
  <section class="card"><div class="sec-h"><h3>Volume by muscle</h3><button class="link small" data-act="toggleSecondary">${set().muscleSecondary ? 'Primary only' : 'Include secondary ×0.5'}</button></div>
    ${hbars(Object.entries(mv).sort((x, y) => y[1] - x[1]).map(([l, v]) => ({ l, v: Math.round(imp() ? v * LB : v) })), v => v.toLocaleString())}
    <h3 style="margin-top:6px">Hard sets by muscle</h3><p class="tiny muted">Completed working, failure and back-off sets. ${set().muscleSecondary ? 'Secondary muscles count as half a set.' : 'Each set counts once, for the primary muscle only.'}</p>
    ${hbars(Object.entries(ms).sort((x, y) => y[1] - x[1]).map(([l, v]) => ({ l, v: round(v, 10) })))}</section>
  <section class="card"><h3>Workout duration</h3><div class="grid2"><div class="stat"><span class="k">Weekly training time</span><span class="v">${Math.round(sum(ss.map(elapsed)) / 60e3 / Math.max(1, (b - a) / (7 * DAY)))}<small>min avg</small></span></div><div class="stat"><span class="k">Total in range</span><span class="v">${fmtDur(sum(ss.map(elapsed)))}</span></div></div>
    ${hbars(Object.entries(byType).map(([l, v]) => ({ l, v: Math.round(sum(v) / v.length / 60e3) })), v => v + ' min avg')}</section>
  <section class="card"><div class="sec-h"><h3>Body weight</h3><button class="link" data-act="go" data-v="measurements">Measurements</button></div>
    ${bw.pts.length ? `<div class="legend"><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--primary)" opacity=".45"/></svg>Weigh-ins</span><span><svg width="22" height="6"><path d="M1 3h20" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4"/></svg>7-day average</span>${pf.weightMin ? '<span><svg width="22" height="6"><path d="M1 3h20" stroke="var(--success)" stroke-width="1.5" stroke-dasharray="2 4"/></svg>Target range</span>' : ''}</div>` : ''}
    ${lineChart('bw', bw.pts, { dotsOnly: true, extra: bw.avg, refs: pf.weightMin && pf.weightMax ? [+wNum(pf.weightMin), +wNum(pf.weightMax)] : [], fmt: v => trim(round(v, 10)), label: 'Body weight trend', empty: 'Log body weight at least twice in this range to see the trend.' })}</section>
  <div class="grid2"><button class="btn" data-act="go" data-v="activities">Activities ${I.chev}</button><button class="btn" data-act="go" data-v="goals">Goals ${I.chev}</button><button class="btn" data-act="go" data-v="history">History ${I.chev}</button><button class="btn" data-act="go" data-v="records">Records ${I.chev}</button></div>`;
};

/* ============ MEASUREMENTS ============ */
function trendPerWeek(rows) { if (rows.length < 3) return null; const xs = rows.map(r => r.measuredAt / (7 * DAY)), ys = rows.map(r => r.value), mx = sum(xs) / xs.length, my = sum(ys) / ys.length; const d = sum(xs.map(x => (x - mx) ** 2)); return d ? sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / d : null; }
VIEWS.measurements = p => {
  const type = p.type || 'weight', [a, b] = rangeOf(p), ser = weightSeries(a, b, type), u = mUnit(type);
  const all = ser.all, last = all[all.length - 1], inR = all.filter(x => inRange(x.measuredAt, a, b));
  const last7 = all.filter(x => x.measuredAt > now() - 7 * DAY), last30 = all.filter(x => x.measuredAt > now() - 30 * DAY), tr = trendPerWeek(last30);
