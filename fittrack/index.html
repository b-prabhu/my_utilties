  return `<section class="card"><h3>Personal profile</h3>
    <div class="grid2"><label class="f">Display name<input class="in" id="pf-name" data-chg="pf" data-f="name" value="${esc(p.name)}"></label><label class="f">Date of birth<input class="in" type="date" id="pf-dob" data-chg="pf" data-f="dob" value="${esc(p.dob)}"></label>
    <label class="f">Height (${lUnit()})<input class="in" id="pf-h" inputmode="decimal" data-chg="pf" data-f="height" value="${p.height ? lNum(p.height) : ''}"></label><label class="f">Starting weight (${wUnit()})<input class="in" id="pf-sw" inputmode="decimal" data-chg="pf" data-f="startWeight" value="${p.startWeight ? wNum(p.startWeight) : ''}"></label>
    <label class="f">Target weight min (${wUnit()})<input class="in" id="pf-wmin" inputmode="decimal" data-chg="pf" data-f="weightMin" value="${p.weightMin ? wNum(p.weightMin) : ''}"></label><label class="f">Target weight max (${wUnit()})<input class="in" id="pf-wmax" inputmode="decimal" data-chg="pf" data-f="weightMax" value="${p.weightMax ? wNum(p.weightMax) : ''}"></label>
    <label class="f">Experience<select class="in" id="pf-exp" data-chg="pf" data-f="experience">${['beginner', 'intermediate', 'advanced'].map(v => `<option ${p.experience === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label><label class="f">Program started<input class="in" type="date" id="pf-ps" data-chg="pf" data-f="programStart" value="${esc(p.programStart || '')}"></label></div>
    <label class="f">Fitness goal<input class="in" id="pf-goal" data-chg="pf" data-f="goal" value="${esc(p.goal)}"></label>
    <div class="f" style="font-size:13px;font-weight:600;color:var(--ink-2)">Preferred activities</div><div class="chips">${Object.entries(ACTS).map(([k, v]) => `<button class="chip" aria-pressed="${(p.activities || []).includes(k)}" data-act="prefAct" data-k="${k}">${v[0]}</button>`).join('')}</div>
    ${p.dob ? `<p class="tiny muted">Age ${Math.floor((now() - fromKey(p.dob)) / (365.25 * DAY))}</p>` : ''}</section>
  <section class="card"><h3>Preferences</h3><div class="list">
    <label class="switch" for="sf-units"><span>Units</span><select class="in" id="sf-units" data-chg="sf" data-f="units"><option value="metric" ${s.units === 'metric' ? 'selected' : ''}>Metric (kg, cm)</option><option value="imperial" ${s.units === 'imperial' ? 'selected' : ''}>Imperial (lb, in)</option></select></label>
    <label class="switch" for="sf-theme"><span>Theme</span><select class="in" id="sf-theme" data-chg="sf" data-f="theme"><option value="system" ${s.theme === 'system' ? 'selected' : ''}>System</option><option value="light" ${s.theme === 'light' ? 'selected' : ''}>Light</option><option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Dark</option></select></label>
    <label class="switch" for="sf-ws"><span>Week starts on</span><select class="in" id="sf-ws" data-chg="sf" data-f="weekStart"><option value="1" ${s.weekStart === 1 ? 'selected' : ''}>Monday</option><option value="0" ${s.weekStart === 0 ? 'selected' : ''}>Sunday</option></select></label>
    <label class="switch" for="sf-tf"><span>Time format</span><select class="in" id="sf-tf" data-chg="sf" data-f="timeFmt"><option value="24" ${s.timeFmt === '24' ? 'selected' : ''}>24-hour</option><option value="12" ${s.timeFmt === '12' ? 'selected' : ''}>12-hour</option></select></label>
    <label class="switch" for="sf-rest"><span>Default rest for new exercises</span><select class="in" id="sf-rest" data-chg="sf" data-f="defaultRest">${[45, 60, 75, 90, 120, 150, 180].map(v => `<option value="${v}" ${s.defaultRest === v ? 'selected' : ''}>${fmtRest(v)}</option>`).join('')}</select></label>
    ${sw('sf-ar', 'autoRest', 'Start rest timer after each set', s.autoRest)}${sw('sf-snd', 'sound', 'Sound when rest ends', s.sound)}${sw('sf-vib', 'vibrate', 'Vibrate when rest ends', s.vibrate, '<div class="tiny muted">Not supported on iPhone Safari</div>')}
    ${sw('sf-rir', 'showRir', 'Log RIR (reps in reserve)', s.showRir)}${sw('sf-rpe', 'showRpe', 'Log RPE per set', s.showRpe)}
    ${sw('sf-vol', 'volumeAllTypes', 'Count warm-up, drop, failure and back-off sets in volume', s.volumeAllTypes, '<div class="tiny muted">Off: volume uses working sets only</div>')}</div></section>
  <section class="card"><h3>Reminders</h3><p class="tiny muted">Notifications: <b>${notif === 'granted' ? 'allowed' : notif === 'denied' ? 'blocked in browser settings' : notif === 'unsupported' ? 'not supported here' : 'not yet allowed'}</b>. Reminders fire while FitTrack is open; otherwise they show as an in-app message next time you open it.</p>
    ${notif === 'default' ? '<button class="btn sm" data-act="notifPerm">Allow notifications</button>' : ''}
    <div class="list">${[['workout', 'Scheduled workout'], ['missed', 'Missed workout check'], ['weigh', 'Body weight logging'], ['review', 'Weekly progress review']].map(([k, l]) => `<div class="switch"><label for="rm-${k}" class="grow">${l}</label><input class="in" style="width:auto;min-height:36px;padding:4px 8px" type="time" id="rm-${k}-t" data-chg="rem" data-k="${k}" data-f="time" value="${r[k].time}" aria-label="${l} time">${k === 'review' ? `<select class="in" style="width:auto;min-width:0;min-height:36px;padding:4px 8px" id="rm-${k}-d" data-chg="rem" data-k="${k}" data-f="day" aria-label="Review day">${WD.map((d, i) => `<option value="${i}" ${r[k].day === i ? 'selected' : ''}>${d}</option>`).join('')}</select>` : ''}<input type="checkbox" id="rm-${k}" data-chg="rem" data-k="${k}" data-f="on" ${r[k].on ? 'checked' : ''}></div>`).join('')}</div>
    ${r.weigh.on ? `<div class="chips" role="group" aria-label="Weigh-in days">${WD.map((d, i) => `<button class="chip" aria-pressed="${r.weigh.days.includes(i)}" data-act="weighDay" data-d="${i}">${d}</button>`).join('')}</div>` : ''}</section>
  <section class="card"><h3>Your data</h3><p class="small muted">Everything stays on this device in the browser's database. Export a copy regularly as a backup.</p>
    <div class="grid2"><button class="btn sm" data-act="export" data-k="workouts">Workouts CSV</button><button class="btn sm" data-act="export" data-k="measurements">Measurements CSV</button><button class="btn sm" data-act="export" data-k="activities">Activities CSV</button><button class="btn sm" data-act="export" data-k="all">Everything (JSON)</button></div>
    <div class="btns"><button class="btn sm" data-act="importSheet">Import backup</button>${S.kv.hasSamples ? '<button class="btn sm" data-act="clearSamples">Clear example data</button>' : '<button class="btn sm" data-act="loadSamples">Load example data</button>'}<button class="btn sm" data-act="go" data-v="sync">Storage & sync</button></div>
    <button class="btn danger" data-act="deleteAll">Delete all my data</button></section>
  <p class="tiny muted" style="text-align:center">FitTrack 1.0 · works offline · your data is never sent anywhere</p>`;
};
VIEWS.sync = () => {
  const on = navigator.onLine;
  return `<section class="card"><div class="row nw"><span class="pill ${idb ? 'ok' : 'err'}">${idb ? 'Saved on device' : 'Not saved'}</span><span class="pill ${on ? 'ok' : 'warn'}">${on ? 'Online' : 'Offline'}</span></div>
  <p>${idb ? 'Every set, measurement and activity is written to this browser\'s IndexedDB the moment you change it, so a refresh, locked screen or lost signal does not lose anything.' : 'This browser blocked local storage (private mode or restricted site data). Changes last only until you close the page. Export your data before leaving.'}</p></section>
  <section class="card"><h3>Sync queue</h3><p class="small">${S.queue.length} change${S.queue.length === 1 ? '' : 's'} recorded with a unique operation ID, ready for a sync server. No server is connected in this version, so your records stay on this device only. Repeated edits to the same record are merged into one pending operation, so retries never duplicate sets.</p>
  <div class="list">${S.queue.slice(-8).reverse().map(q => `<div class="li small"><span class="pill">${esc(q.op)}</span><span class="grow">${esc(q.entity)}</span><span class="tiny muted num">${esc(q.id.slice(0, 8))}</span></div>`).join('') || '<div class="empty">Nothing queued.</div>'}</div></section>`;
};
</script>
<script>
/* ============ actions ============ */
const A = activeSession;
function saveS(s, rerender = true) { put('sessions', s); if (rerender) render(); }
function curSx() { const s = A(); return s && s.exercises[s.cur]; }
let wakeLock = null;
async function keepAwake(on) { try { if (on && 'wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {} }
function startWorkout(tpl, k) {
  if (A()) { toast('Finish or discard the current workout first'); tab('workout'); return; }
  const tk = dkey(now()), pl = planFor(new Date());
  const s = newSession(tpl, now(), k || (tpl && pl.kind === 'workout' && pl.templateId === tpl.id ? tk : null));
  put('sessions', s); tab('workout'); keepAwake(true);
}
function nextLabel(s, sx) {
  const i = sx.sets.findIndex(x => x.status === 'pending'); if (i >= 0) return `${sx.name}, set ${i + 1}`;
  const n = s.exercises.find((x, j) => j > s.cur && x.sets.some(st => st.status === 'pending')) || s.exercises.find(x => x.sets.some(st => st.status === 'pending'));
  return n ? n.name : 'finish workout';
}
function updateExStatus(sx) { if (sx.status === 'skipped') return; sx.status = sx.sets.length && sx.sets.every(x => x.status !== 'pending') ? 'done' : 'pending'; }

const ACT = {
  back, tab: el => tab(el.dataset.t),
  go: el => { const p = {}; if (el.dataset.id) p.id = el.dataset.id; if (el.dataset.ro) p.ro = 1; closeSheet(); go(el.dataset.v, p); },
  scrim: (el, e) => { if (e.target === el) closeSheet(); }, closeSheet,
  confirmYes: () => { const f = SHEET_CTX && SHEET_CTX.confirm; closeSheet(); if (f) f(); },
  clearSamples: () => confirmSheet('Clear example data?', 'Removes the example workouts, measurements, activities and goals. Anything you logged yourself stays.', 'Clear examples', () => { clearSamples(); render(); toast('Example data cleared'); }),
  loadSamples: () => { seedSamples(); render(); toast('Example data loaded'); },
  startTpl: el => startWorkout(tplOf(el.dataset.id), el.dataset.k),
  startEmpty: () => startWorkout(null),
  skipDay: el => { const ov = S.kv.overrides; ov[el.dataset.k] = { ...(ov[el.dataset.k] || {}), skipped: true }; setKV('overrides', ov); closeSheet(); render(); toast('Workout skipped'); },
  unskip: el => { const ov = S.kv.overrides, o = ov[el.dataset.k]; if (o) { delete o.skipped; if (!Object.keys(o).filter(k => k !== 'sample').length) delete ov[el.dataset.k]; } setKV('overrides', ov); closeSheet(); render(); },
  undoOverride: el => { const ov = S.kv.overrides; delete ov[el.dataset.k]; setKV('overrides', ov); render(); },
  reschedule: el => { const k = el.dataset.k, from = fromKey(k), p = planFor(from), ws = weekStart(from);
    const opts = Array.from({ length: 14 }, (_, i) => addDays(ws, i)).filter(d => dkey(d) >= dkey(now()) && dkey(d) !== k);
    sheet('Move ' + planLabel(p), `<p class="small muted">Pick a day. ${esc(fmtDate(from))} becomes a rest day; the weekly pattern is unchanged.</p><div class="list">${opts.map(d => { const q = planFor(d); return `<button class="li" data-act="moveTo" data-from="${k}" data-k="${dkey(d)}"><div class="grow"><b>${esc(fmtDate(d))}</b><div class="tiny muted">Currently: ${esc(q.skipped ? 'Skipped' : planLabel(q))}</div></div>${I.chev}</button>`; }).join('')}</div>`); },
  moveTo: el => { const ov = S.kv.overrides, p = planFor(fromKey(el.dataset.from));
    ov[el.dataset.from] = { kind: 'rest', templateId: null, note: 'Moved to ' + fmtDate(fromKey(el.dataset.k)) };
    ov[el.dataset.k] = { kind: 'workout', templateId: p.templateId, note: 'Moved from ' + fmtDate(fromKey(el.dataset.from)) };
    setKV('overrides', ov); closeSheet(); render(); toast('Workout moved'); },
  dayMenu: el => { const k = el.dataset.k, d = fromKey(k), p = planFor(d), st = dayStatus(d), ss = sessionsOn(k).filter(s => s.status !== 'in_progress'), acts = S.activities.filter(a => dkey(a.startedAt) === k);
    const isFuture = k >= dkey(now());
    sheet(fmtDate(d, { weekday: 'long', day: 'numeric', month: 'short' }), `<div class="row">${pill(st)}<b>${esc(p.skipped ? 'Skipped' : planLabel(p))}</b></div>${p.note ? `<p class="small muted">${esc(p.note)}</p>` : ''}
      ${ss.map(s => `<button class="btn" data-act="go" data-v="session" data-id="${s.id}">View ${esc(s.name)}</button>`).join('')}${acts.map(a => `<button class="btn" data-act="activityForm" data-id="${a.id}">${esc(ACTS[a.type][0])} · ${Math.round(a.duration / 60)} min</button>`).join('')}
      <label class="f">Plan for this date only<select class="in" id="dm-plan" data-chg="dayPlan" data-k="${k}"><option value="">Weekly default</option>${S.templates.filter(t => t.active).map(t => `<option value="tpl:${t.id}" ${p.overridden && p.kind === 'workout' && p.templateId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="recovery">Active recovery</option><option value="cardio">Cardio / Badminton</option><option value="rest">Rest</option></select></label>
      <div class="btns">${p.kind === 'workout' && !ss.length ? (p.skipped ? `<button class="btn" data-act="unskip" data-k="${k}">Undo skip</button>` : `<button class="btn" data-act="skipDay" data-k="${k}">Skip</button>`) + (isFuture ? `<button class="btn" data-act="reschedule" data-k="${k}">Move to another day</button>` : '') : ''}
      ${k === dkey(now()) && p.kind === 'workout' && !p.skipped && !ss.length ? `<button class="btn primary" data-act="startTpl" data-id="${p.templateId}" data-k="${k}">Start</button>` : ''}<button class="btn" data-act="activityForm">Record activity</button></div>`); },
  extraForm: () => sheet('Schedule an extra workout', `<div class="grid2"><label class="f">Date<input class="in" type="date" id="xw-d" value="${dkey(addDays(now(), 1))}"></label><label class="f">Workout<select class="in" id="xw-t">${S.templates.filter(t => t.active).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label></div><button class="btn primary big" data-act="extraSave">Add to plan</button>`),
  extraSave: () => { const k = $('#xw-d').value; if (!k) return; const ov = S.kv.overrides; ov[k] = { kind: 'workout', templateId: $('#xw-t').value, note: 'Extra workout' }; setKV('overrides', ov); closeSheet(); render(); toast('Added to ' + fmtDate(fromKey(k))); },
  activityForm: el => activitySheet(el.dataset.id, el.dataset.type),
  measureForm: el => measureSheet(el.dataset.type),
  // workout session
  exGo: el => { const s = A(), i = +el.dataset.i; if (!s || i < 0 || i >= s.exercises.length) return; s.cur = i; saveS(s); window.scrollTo(0, 0); },
  recApply: el => { const s = A(), sx = curSx(), w = +el.dataset.w; sx.sets.forEach(x => { if (x.status === 'pending' && x.type === 'working') { x.weight = w; x.touched = true; } }); sx.rec = 'applied'; saveS(s); },
  recDismiss: () => { const s = A(); curSx().rec = 'dismissed'; saveS(s); },
  addSet: () => { const s = A(), sx = curSx(), l = sx.sets[sx.sets.length - 1] || {}; sx.sets.push({ id: uid(), type: 'working', tMin: sx.repMin, tMax: sx.repMax, weight: l.weight ?? (sx.tracking === 'weight_reps' ? 0 : null), reps: sx.tracking === 'duration' ? null : (l.reps ?? sx.repMax), duration: sx.tracking === 'duration' ? (l.duration || 30) : null, rpe: null, rir: null, status: 'pending', completedAt: null, notes: '', touched: false }); if (sx.status === 'done') sx.status = 'pending'; saveS(s); },
  delSet: el => { const s = A(), sx = curSx(); sx.sets.splice(+el.dataset.i, 1); updateExStatus(sx); saveS(s); toast('Set deleted'); },
  skipSet: el => { const s = A(), sx = curSx(); sx.sets[+el.dataset.i].status = 'skipped'; updateExStatus(sx); saveS(s); },
  unskipSet: el => { const s = A(), sx = curSx(); sx.sets[+el.dataset.i].status = 'pending'; updateExStatus(sx); saveS(s); },
  skipEx: () => { const s = A(), sx = curSx(); sx.sets.forEach(x => { if (x.status === 'pending') x.status = 'skipped'; }); sx.status = 'skipped'; const n = s.exercises.findIndex((x, j) => j > s.cur && x.status === 'pending'); if (n >= 0) s.cur = n; saveS(s); toast('Exercise skipped'); },
  unskipEx: () => { const s = A(), sx = curSx(); sx.sets.forEach(x => { if (x.status === 'skipped') x.status = 'pending'; }); sx.status = 'pending'; saveS(s); },
  step: el => { const s = A(), sx = curSx(), x = sx.sets[+el.dataset.i], f = el.dataset.f, d = +el.dataset.d;
    if (f === 'weight') x.weight = Math.max(0, round((+x.weight || 0) + d * incKg(exOf(sx.exerciseId) || { equipment: sx.equipment }), 10000));
    else if (f === 'reps') x.reps = Math.max(0, (+x.reps || 0) + d); else x.duration = Math.max(0, (+x.duration || 0) + d * 5);
    x.touched = true; saveS(s); },
  toggleSet: el => { const s = A(), sx = curSx(), i = +el.dataset.i, x = sx.sets[i];
    if (x.status === 'completed') { x.status = 'pending'; x.completedAt = null; updateExStatus(sx); saveS(s); return; }
    if (sx.tracking !== 'duration' && !(+x.reps > 0)) { toast('Enter the reps you completed first'); return; }
    if (sx.tracking === 'duration' && !(+x.duration > 0)) { toast('Enter the seconds you held first'); return; }
    // live PR check against history before this session
    const b = prData().best[sx.exerciseId]; let pr = '';
    if (b && sx.tracking === 'weight_reps' && x.type !== 'warmup') { if (+x.weight > b.top + 1e-6) pr = 'New heaviest weight'; else if ((e1rm(+x.weight, +x.reps) || 0) > b.e1 + 0.05) pr = 'New best estimated 1RM'; }
    x.status = 'completed'; x.completedAt = now(); x.touched = true;
    const nx = sx.sets.slice(i + 1).find(y => y.status === 'pending');
    if (nx && !nx.touched) { if (x.weight != null) nx.weight = x.weight; if (nx.reps == null) nx.reps = x.reps; }
    updateExStatus(sx);
    const anyLeft = s.exercises.some(e => e.sets.some(y => y.status === 'pending'));
    if (set().autoRest && anyLeft && sx.rest > 0) s.rest = { endAt: now() + sx.rest * 1000, dur: sx.rest, next: '' };
    if (sx.status === 'done') { const n = s.exercises.findIndex((e, j) => j > s.cur && e.sets.some(y => y.status === 'pending')); const n2 = n >= 0 ? n : s.exercises.findIndex(e => e.sets.some(y => y.status === 'pending')); if (n2 >= 0) { s.cur = n2; toast((pr ? pr + '! ' : '') + 'Next: ' + s.exercises[n2].name); pr = ''; window.scrollTo(0, 0); } else toast('All sets logged. Finish when ready.'); }
    if (s.rest) s.rest.next = nextLabel(s, s.exercises[s.cur]);
    restAlerted = false; saveS(s); if (pr) toast(pr + '!');
    unlockAudio(); },
  restAdj: el => { const s = A(); if (!s || !s.rest) return; const d = +el.dataset.d; s.rest.endAt = Math.max(now() + 1000, s.rest.endAt + d * 1000); s.rest.dur = Math.max(5, s.rest.dur + d); restAlerted = false; saveS(s, false); renderRest(); },
  restSkip: () => { const s = A(); if (!s) return; s.rest = null; saveS(s, false); renderRest(); },
  pickExercise: el => pickSheet(el.dataset.mode),
  pickDo: el => { const ex = exOf(el.dataset.id), mode = SHEET_CTX && SHEET_CTX.mode; closeSheet(); if (!ex) return;
    if (mode === 'tpl') { const c = cur(); c.p.draft.items.push({ id: uid(), exerciseId: ex.id, sets: 3, repMin: 8, repMax: 12, rest: ex.rest, optional: false, notes: '' }); render(); return; }
    const s = A(); if (!s) return;
    if (mode === 'sub') { const old = s.exercises[s.cur]; const nsx = makeSx(ex, { sets: old.sets.length, repMin: old.repMin, repMax: old.repMax, rest: ex.rest }, s.startedAt); nsx.notes = 'Substituted for ' + old.name; s.exercises[s.cur] = nsx; toast('Swapped in ' + ex.name + ' for this session'); }
    else { s.exercises.push(makeSx(ex, null, s.startedAt)); s.cur = s.exercises.length - 1; }
    saveS(s); },

/* ============ export ============ */
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const csv = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
function exportSheet(kind) {
  let text, name, type = 'text/csv';
  const iso = t => t ? new Date(t).toISOString() : '';
  if (kind === 'workouts') { const rows = [['session_id', 'started_at', 'ended_at', 'workout', 'session_status', 'exercise', 'set_number', 'set_type', 'weight_kg', 'weight_basis', 'reps', 'duration_s', 'rir', 'rpe', 'set_status', 'volume_kg']];
    doneSessions().forEach(s => s.exercises.forEach(sx => sx.sets.forEach((x, i) => rows.push([s.id, iso(s.startedAt), iso(s.endedAt), s.name, s.status, sx.name, i + 1, x.type, x.weight, sx.loadBasis, x.reps, x.duration, x.rir, x.rpe, x.status, setVol(x, sx)])))); text = csv(rows); name = 'fittrack-workouts.csv'; }
  else if (kind === 'measurements') { text = csv([['measured_at', 'type', 'value', 'unit', 'note']].concat(S.measurements.slice().sort((a, b) => a.measuredAt - b.measuredAt).map(m => [iso(m.measuredAt), m.type, m.value, MTYPES[m.type][1] === 'w' ? 'kg' : MTYPES[m.type][1] === 'l' ? 'cm' : '%', m.note]))); name = 'fittrack-measurements.csv'; }
  else if (kind === 'activities') { text = csv([['started_at', 'ended_at', 'type', 'duration_s', 'distance_m', 'avg_hr', 'calories', 'intensity', 'format', 'matches', 'source', 'notes']].concat(S.activities.slice().sort((a, b) => a.startedAt - b.startedAt).map(a => [iso(a.startedAt), iso(a.endedAt), a.type, a.duration, a.distance, a.hr, a.calories, a.intensity, a.format, a.matches, a.source, a.notes]))); name = 'fittrack-activities.csv'; }
  else { text = JSON.stringify({ app: 'FitTrack', version: 1, exportedAt: new Date().toISOString(), units: { weight: 'kg', length: 'cm', distance: 'm', time: 'ms epoch' }, data: { exercises: S.exercises, templates: S.templates, sessions: S.sessions, measurements: S.measurements, activities: S.activities, goals: S.goals, kv: S.kv } }, null, 1); name = 'fittrack-backup.json'; type = 'application/json'; }
  sheet('Export ' + (kind === 'all' ? 'all data' : kind), `<p class="small muted">Values are stored in kilograms, centimetres and metres regardless of display units. If the download button does nothing in this view, use Copy and paste into a file.</p><textarea class="in" id="exp-text" readonly style="min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(text)}</textarea><div class="btns"><button class="btn" data-act="copyExport">Copy</button><button class="btn primary" data-act="downloadExport" data-name="${name}" data-type="${type}">Download ${name.split('.').pop().toUpperCase()}</button></div>`);
}

/* ============ timers, alerts, reminders ============ */
let restAlerted = false, actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() { try { if (!actx) return; [0, 0.28].forEach(t0 => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.start(t); o.stop(t + 0.25); }); } catch (e) {} }
function notify(title, body) { try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) { new Notification(title, { body, tag: 'fittrack-' + title }); return true; } } catch (e) {} return false; }

}
function checkReminders() {

  const fire = (k, title, body) => { if (fired[k] === tk) return; fired[k] = tk; setKV('remFired', fired); if (!notify(title, body)) toast(title + ': ' + body); };
  const p = planFor(d), due = p.kind === 'workout' && !p.skipped && dayStatus(d) === 'scheduled';
  if (r.workout.on && hm >= r.workout.time && due) fire('workout', 'Workout today', planLabel(p) + ' is scheduled.');
  if (r.missed.on && hm >= r.missed.time && due) fire('missed', 'Workout not logged', planLabel(p) + ' is still open today. Log it, move it or skip it.');
  if (r.weigh.on && r.weigh.days.includes(d.getDay()) && hm >= r.weigh.time && !S.measurements.some(m => m.type === 'weight' && dkey(m.measuredAt) === tk)) fire('weigh', 'Weigh-in', 'Log your body weight for today.');

function fixSettings() { const s = S.kv.settings || {}; S.kv.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ...s, reminders: { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS.reminders)), ...(s.reminders || {}) } }; S.kv.profile = { ...DEFAULT_PROFILE, ...(S.kv.profile || {}) }; if (!S.kv.overrides) S.kv.overrides = {}; if (!S.kv.schedule) S.kv.schedule = { days: {} }; }

/* ============ wiring ============ */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { unlockAudio(); f(el, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').innerHTML) closeSheet(); if (e.key === 'Enter' && e.target.matches('.stepper input')) e.target.blur(); });
document.addEventListener('pointermove', chartHover); document.addEventListener('pointerdown', chartHover);
document.addEventListener('pointerout', chartLeave);

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!$('#sheet').innerHTML && !document.activeElement.matches('input,textarea,select')) render(); }, 250); });

(async function init() {

  if (!S.kv.settings) { S.seeding = true; seedLibrary(); seedSamples(); S.seeding = false; S.queue = []; idbClear('queue'); }

  const h = location.hash.slice(1); R.tab = TABS.includes(h) ? h : (A() ? 'workout' : 'home');
